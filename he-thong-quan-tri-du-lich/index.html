<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Công nợ NCC Land Tour — Đối soát</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@500;600&family=Outfit:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap&subset=latin,latin-ext,vietnamese" rel="stylesheet">
<style>
:root{
  --ink:#16201C; --muted:#6a746e; --line:#e3e8e4; --bg:#f4f6f4; --panel:#ffffff;
  --accent:#0B5D4B; --accent-soft:#eaf3ef; --neg:#B3402E; --neg-soft:#fdeeeb;
  --warn:#8a5a12; --warn-soft:#fff9e8; --info:#1f4e79; --info-soft:#eef4fa;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --ui:'Outfit','Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif;
  --serif:'Noto Serif Display','Noto Serif SC',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--ui);font-size:13.5px;color:var(--ink);background:var(--bg);line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:60;background:var(--panel);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:14px;padding:8px 14px;flex-wrap:wrap}
#top .idt{display:flex;align-items:baseline;gap:9px;min-width:0}
#top h1{font-size:15.5px;white-space:nowrap}
.vbadge{font-family:var(--mono);font-size:10.5px;background:var(--accent);color:#fff;padding:1.5px 6px;border-radius:4px}
.stamp{font-family:var(--mono);font-size:10px;color:var(--muted);white-space:nowrap}
#top .spacer{flex:1}
#pill{font-size:11.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);
      background:#fff;color:var(--muted);opacity:0;transition:opacity .2s;white-space:nowrap;max-width:44ch;overflow:hidden;text-overflow:ellipsis}
#pill.show{opacity:1}
#pill.ok{background:var(--accent-soft);border-color:#bcd8ce;color:var(--accent)}
#pill.warn{background:var(--warn-soft);border-color:#e8d8a8;color:var(--warn)}
#pill.err{background:var(--neg-soft);border-color:#f0c4bb;color:var(--neg)}

.btn{border:1px solid var(--line);background:#fff;padding:4px 10px;border-radius:5px;cursor:pointer;
     font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:#c6cfc9;background:#fafbfa}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#0a5142}
.btn.danger{color:var(--neg);border-color:#eecac2}
.btn.danger:hover{background:var(--neg-soft)}
.btn.sm{padding:2px 7px;font-size:11.5px}

/* ---------- tabs ---------- */
#tabs{display:flex;gap:2px;padding:0 12px;background:var(--bg);border-bottom:1px solid var(--line);
      position:sticky;top:41px;z-index:55;flex-wrap:wrap}
.tab{padding:6px 13px 5px;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;
     cursor:pointer;font-size:12.5px;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--panel);border-color:var(--line);color:var(--ink);font-weight:500;margin-bottom:-1px}

/* ---------- KPI strip ---------- */
#kpi{display:flex;gap:0;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto}
.k{padding:7px 14px;border-right:1px solid var(--line);min-width:150px;flex:1}
.k .lab{font-size:10px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
.k .val{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:1px}
.k .sub{font-size:10.5px;color:var(--muted);font-family:var(--mono)}
.k.neg .val{color:var(--neg)} .k.acc .val{color:var(--accent)} .k.wr .val{color:var(--warn)}

/* ---------- shell ---------- */
#shell{display:flex;align-items:stretch;min-height:calc(100vh - 120px)}
#side{width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
      padding:10px 12px 40px;overflow-y:auto;max-height:calc(100vh - 120px);position:sticky;top:120px}
#resizer{width:5px;cursor:col-resize;background:transparent;flex:0 0 5px}
#resizer:hover{background:var(--accent-soft)}
#main{flex:1;min-width:0;padding:12px 14px 60px;background:var(--panel)}
.hint{font-size:11.5px;color:var(--muted);background:var(--bg);border:1px solid var(--line);
      border-left:3px solid var(--accent);padding:6px 10px;border-radius:4px;margin-bottom:10px}

.panelmode{display:flex;align-items:center;gap:6px;padding-bottom:7px;margin-bottom:9px;border-bottom:1px solid var(--line)}
.panelmode .tiny{flex:1}
.fgrp{margin-bottom:12px}
.fgrp>label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:4px;background:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,93,75,.13)}
textarea{font-family:var(--mono);font-size:11.5px;resize:vertical}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:5px;overflow:hidden;background:#fff}
.seg button{border:none;background:#fff;padding:3px 9px;font-size:11.5px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:none}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:500}

/* ---------- tables ---------- */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--bg);border-bottom:1px solid var(--line);padding:5px 7px;text-align:left;
   font-weight:500;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
   position:sticky;top:0;z-index:20}
td{border-bottom:1px solid #f0f3f1;padding:4px 7px;vertical-align:top}
tr.grp td{background:var(--accent-soft);font-weight:500}
tr.tot td{background:var(--bg);font-weight:500;border-top:1px solid var(--line)}
tr.dim{opacity:.22}
tr.sel td{background:#f3f8f5}
tbody tr:hover td{background:#fafbfa}
tbody tr.grp:hover td{background:#e3efe9}
.rowbtns{display:none;gap:3px}
tr:hover .rowbtns{display:inline-flex}

.chip{display:inline-block;font-size:9.5px;padding:1px 5px;border-radius:3px;border:1px solid var(--line);
      background:var(--bg);color:var(--muted);white-space:nowrap;font-family:var(--mono)}
.chip.ok{background:var(--accent-soft);border-color:#bcd8ce;color:var(--accent)}
.chip.warn{background:var(--warn-soft);border-color:#e8d8a8;color:var(--warn)}
.chip.err{background:var(--neg-soft);border-color:#f0c4bb;color:var(--neg)}
.chip.info{background:var(--info-soft);border-color:#c9dcee;color:var(--info)}
.cellin{border:1px solid transparent;background:transparent;width:100%;padding:1px 3px;border-radius:3px}
.cellin:hover{border-color:var(--line)}
.cellin:focus{border-color:var(--accent);background:#fff}
.cellin.num{text-align:right}
.sect{margin:18px 0 8px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sect h3{font-size:14px}
.sect .d{font-size:11.5px;color:var(--muted)}
.wrap{overflow:auto;max-height:calc(100vh - 210px);overscroll-behavior:contain;
      border:1px solid var(--line);border-radius:6px}
.neg{color:var(--neg)} .pos{color:var(--accent)} .mut{color:var(--muted)}
.tiny{font-size:10.5px;color:var(--muted)}

/* bridge */
.bridge{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.br{display:flex;align-items:center;gap:10px;padding:6px 10px;border-bottom:1px solid #f0f3f1;font-size:12.5px}
.br:last-child{border-bottom:none}
.br .bl{flex:1;min-width:0}
.br .bv{width:130px;text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.br .bar{width:170px;height:12px;position:relative;background:#f6f8f7;border-radius:2px;overflow:hidden;flex:0 0 170px}
.br .bar i{position:absolute;top:0;bottom:0;display:block}
.br.anchor{background:var(--accent-soft);font-weight:500}
.br.result{background:var(--bg);font-weight:600;border-top:1px solid var(--line)}
.br .why{font-size:10.5px;color:var(--muted);display:block}

.bl{border-left:2px solid var(--line)}
.led td{padding:3px 6px;font-size:12px}
.led tr.st-ok  td{background:#f2f8f5}
.led tr.st-diff td{background:var(--warn-soft)}
.led tr.st-miss td{background:var(--neg-soft)}
.led tr.st-open td,.led tr.st-end td{background:var(--bg);font-weight:500}
.led tr.st-end td{border-top:1px solid var(--line);border-bottom:2px solid var(--accent)}
.led td:first-child{border-left:3px solid transparent}
.led tr.st-ok  td:first-child{border-left-color:var(--accent)}
.led tr.st-diff td:first-child{border-left-color:#c9a227}
.led tr.st-miss td:first-child{border-left-color:var(--neg)}
.led tr:hover td{filter:brightness(.975);cursor:pointer}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:10.5px;color:var(--muted);margin:4px 0 8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.card{border:1px solid var(--line);border-radius:6px;padding:10px 12px;background:#fff;margin-bottom:10px}
.card h4{margin:0 0 5px;font-size:12.5px;font-family:var(--ui);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
details>summary{cursor:pointer;font-size:12px;color:var(--muted);padding:3px 0}
details>summary:hover{color:var(--ink)}
.kv{display:flex;gap:8px;font-size:12px;padding:2px 0;border-bottom:1px dotted #eef1ef}
.kv b{font-weight:500;min-width:120px;color:var(--muted)}
.kv span{flex:1;text-align:right;font-family:var(--mono)}
#log{font-family:var(--mono);font-size:11px;background:#fbfcfb;border:1px solid var(--line);border-radius:5px;
     padding:7px;max-height:180px;overflow-y:auto;white-space:pre-wrap}

@media(max-width:1280px){ .stamp{display:none} .grid2{grid-template-columns:1fr} }
@media(max-width:900px){
  #shell{display:block}
  #side{width:auto!important;flex-basis:auto!important;flex:none;position:static;max-height:none;
        border-right:none;border-bottom:1px solid var(--line)}
  .wrap{max-height:none}
  #resizer{display:none}
  th{position:static}
  .grid2,.grid3{grid-template-columns:1fr}
  .br .bar{display:none}
}
</style>
</head>
<body>

<div id="top">
  <div class="idt">
    <h1>Công nợ NCC Land Tour</h1>
    <span class="vbadge" id="vbadge"></span>
    <span class="stamp" id="stamp"></span>
    <span id="wsname"></span>
  </div>
  <div class="spacer"></div>
  <span id="pill"></span>
  <span id="acts"></span>
</div>

<div id="tabs"></div>
<div id="kpi"></div>

<div id="shell">
  <div id="side"></div>
  <div id="resizer"></div>
  <div id="main"></div>
</div>

<script>
/* ============================================================
   CÔNG CỤ QUẢN LÝ CÔNG NỢ NCC LAND TOUR
   Workbench class · single-file · localStorage
   ============================================================ */
const VERSION = "6.2";
const RELEASED = "30/08/2026";
const SCOPE_NOTE = "Danh mục đoàn thuần điều hành · cột kiểm tra độ hoàn thiện thay 4 cột tài chính";
const LS_PREFIX = "landtour_ap:";
const LS_LAST   = "landtour_ap:__last";

/* Cấu trúc rỗng + 1 dòng ví dụ để thấy định dạng. Không có số liệu thật nào nhúng trong file này. */
function blankDB(name){ return {
  schema:5, components:COMP_DEF.map(([code,name])=>({code,name,note:''})), tourParts:[],
  accounts:[{code:'ACC1',name:'Tài khoản chính',ccy:'VND',note:''}], bank:[],
  meta:{name:name||'Hồ sơ mới', company:'[[CẦN ĐIỀN]] tên công ty', companyShort:'Ta',
        period:'', baseCost:'RMB', baseRev:'VND', sources:[]},
  parties:[], groups:[], bills:[], services:[], payments:[], revenues:[], receipts:[],
  recon:{note:''},
  policy:{usdFixed:6.9, vndTip:3750, vndRate:3850, usdVnd:26000, tolCost:1, tolPay:1, tolRev:10000, tolRcv:10000, scopeBasis:'start',
          scopeFrom:new Date().getFullYear()+'-01-01', scopeTo:new Date().getFullYear()+'-12-31'}
};}
function templateDB(){ const d=blankDB('Hồ sơ mẫu (cấu trúc)');
  d.meta.supplier='[[CẦN ĐIỀN]] tên NCC'; 
  d.groups=[{code:'VD-XX-20260101',codeSup:null,route:'[[CẦN ĐIỀN]] hành trình',date:'2026-01-01',
             air:'XX',pax:20,codeCus:'BG-2026-001',cus:null,note:'DÒNG VÍ DỤ — xóa sau khi đã hiểu cấu trúc'}];
  d.services=[{id:'S001',g:'VD-XX-20260101',d:'地接团款 Group payment',u:1500,m:null,q:20,a:30000,
               t:'landtour',src:'ví dụ',note:'DÒNG VÍ DỤ',excluded:false}];
  d.payments=[{id:'P001',date:'2026-01-05',ccy:'USD',amt:1000,method:'CK',rmbSup:null,rateSupNote:'',
               allocSup:'VD-XX-20260101',amtTip:1000,allocTip:'VD-XX-20260101',
               note:'DÒNG VÍ DỤ — rmbSup để null nghĩa là NCC chưa ghi có',src:'ví dụ',flag:null,pair:null}];
  return d;
}

/* ---------- state ---------- */
let DB = null;      // null = chưa mở hồ sơ nào → hiện màn hình chào
let WS = null;      // slug hồ sơ đang mở
let UI = {party:null, selParty:null, newTour:false,
  fPartyKind:'all', fPartyIssue:'all', fTourStatus:'all', fCus:'all', fTmp:'all',
  fComp:'all', fKind:'all', fRate:'all', fDir:'all', fAlloc:'all', reviewOnly:false, slice:'tour', balSup:'ALL', balCus:'ALL', tab:'t0', selGroup:null, selPay:null, fText:'', fStatus:'all', fType:'all',
          dimMode:true, sideW:330, lens:'group'};
let UNDO = [];
const MAXUNDO = 60;

/* Nhãn hai bên lấy từ meta — shell dùng lại được cho NCC/khách khác, không hardcode tên. */
function CO(){ return (DB&&DB.meta.companyShort)||'Ta'; }
/* Đối tác đang xem. Toàn bộ lõi đối soát chạy trên MỘT đối tác tại một thời điểm —
   nhờ vậy sổ phải thu khách dùng lại y nguyên engine của sổ phải trả NCC. */
function activeParty(){
  if(!DB||!DB.parties.length) return null;
  return DB.parties.find(p=>p.code===UI.party) || DB.parties[0];
}
function SU(){ const p=activeParty(); return p?p.short:'ĐT'; }
function PK(){ const p=activeParty(); return p?p.kind:'sup'; }
function isCus(){ return PK()==='cus'; }
/* Sổ đang dùng: bên bán → chi phí/chi tiền (gốc RMB) · bên mua → doanh thu/thu tiền (gốc VND) */
function BK(){ const p=activeParty(), c=isCus();
  /* Tiền gốc lấy theo TỪNG ĐỐI TÁC, không theo loại sổ — NCC vé trong nước là VND
     trong khi NCC land tour Trung Quốc là RMB, hai sổ không thể chung một gốc. */
  const base = (p&&p.ccy) || (c ? (DB.meta.baseRev||'VND') : (DB.meta.baseCost||'RMB'));
  return c ? {lines:'revenues', money:'receipts', base, lineWord:'doanh thu', moneyWord:'thu tiền', dirIn:true}
           : {lines:'services', money:'payments', base, lineWord:'chi phí', moneyWord:'chi tiền', dirIn:false}; }
function BASE(){ return BK().base; }
/* Quy đổi nguyên tệ → tiền gốc của sổ. Giữ quy ước quen thuộc: tỷ giá VND/RMB là "bao nhiêu VND đổi 1 RMB". */
function conv(ccy, amt, rate, base){
  if(amt===null||amt===undefined) return null;
  if(ccy===base) return Number(amt);
  if(!rate) return null;
  if(ccy==='VND'&&base==='RMB') return amt/rate;
  return amt*rate;
}
function derive(ccy, amt, val, base){
  if(ccy===base) return 1;
  if(!amt||val===null||val===undefined) return null;
  if(ccy==='VND'&&base==='RMB') return amt/val;
  return val/amt;
}
function defRate(ccy){
  const b=BASE(), P=DB.policy;
  if(ccy===b) return 1;
  if(b==='RMB') return ccy==='USD'?P.usdFixed:(ccy==='VND'?P.vndTip:null);
  return ccy==='USD'?P.usdVnd:(ccy==='RMB'?P.vndRate:null);
}
function dec(ccy){ return ccy==='VND'?0:2; }

/* ---------- utils ---------- */
const $ = s=>document.querySelector(s);
const clone = o=>JSON.parse(JSON.stringify(o));
function n2(v,d=2){ if(v===null||v===undefined||v==='' ) return '—';
  const x=Number(v); if(!isFinite(x)) return '—';
  return x.toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d}); }
function n0(v){ return n2(v,0); }
function sgn(v,d=2){ if(v===null||v===undefined) return '—';
  const s=n2(Math.abs(v),d); return (v<0?'−':'+')+s; }
function esc(s){ return (s===null||s===undefined?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function num(v){ const x=parseFloat(String(v).replace(/[^\d.,\-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isFinite(x)?x:null; }

function pill(msg,kind='ok'){ const p=$('#pill'); p.textContent=msg; p.className='show '+kind;
  clearTimeout(p._t); p._t=setTimeout(()=>{p.className='';},4000); }
function logline(msg){ const l=$('#log'); if(!l) return;
  l.textContent += '['+new Date().toLocaleTimeString('vi-VN')+'] '+msg+'\n'; l.scrollTop=l.scrollHeight; }

function push(){ UNDO.push(clone(DB)); if(UNDO.length>MAXUNDO) UNDO.shift(); syncUndo(); }
function syncUndo(){ const b=$('#btnUndo'); if(!b) return; b.textContent='↩ Undo ('+UNDO.length+')'; b.disabled=UNDO.length===0; }
function undo(){ if(!UNDO.length) return; DB=UNDO.pop(); syncUndo(); save(); render(); pill('Đã hoàn tác 1 bước','ok'); }
/* ---------- workspace layer (nhiều hồ sơ trên cùng 1 máy) ---------- */
function slugify(s){ return (s||'ho-so').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40)||'ho-so'; }
function wsList(){ const out=[];
  for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(!k.startsWith(LS_PREFIX)||k===LS_LAST) continue;
    try{ const w=JSON.parse(localStorage.getItem(k));
      out.push({slug:k.slice(LS_PREFIX.length), name:w.name||k, savedAt:w.savedAt||'',
                nG:(w.db.groups||[]).length, nS:(w.db.services||[]).length, nP:(w.db.payments||[]).length}); }catch(e){}
  }
  return out.sort((a,b)=>(b.savedAt||'').localeCompare(a.savedAt||''));
}
function save(){ if(!WS) return;
  try{ localStorage.setItem(LS_PREFIX+WS, JSON.stringify({name:DB.meta.name, savedAt:new Date().toISOString(), db:DB}));
       localStorage.setItem(LS_LAST, WS);
  }catch(e){ pill('Không lưu được localStorage: '+e.message,'err'); } }
function wsOpen(sl){ try{ const w=JSON.parse(localStorage.getItem(LS_PREFIX+sl));
    DB=normalize(w.db); WS=sl; UNDO=[]; UI.party=(DB.parties[0]||{}).code||null; syncUndo(); localStorage.setItem(LS_LAST,sl);
    render(); pill('Đã mở hồ sơ "'+DB.meta.name+'"','ok');
  }catch(e){ pill('Không mở được hồ sơ: '+e.message,'err'); } }
function wsNew(obj,name){
  const nm = name || (obj&&obj.meta&&obj.meta.name) || 'Hồ sơ mới';
  let sl=slugify(nm), i=1; while(localStorage.getItem(LS_PREFIX+sl)) sl=slugify(nm)+'-'+(++i);
  DB=normalize(obj||blankDB(nm)); DB.meta.name=nm; WS=sl; UNDO=[];
  UI.party=(DB.parties[0]||{}).code||null; syncUndo(); save(); render();
  pill('Đã tạo hồ sơ "'+nm+'"','ok'); }
function wsClose(){ if(DB) save(); DB=null; WS=null; UNDO=[]; syncUndo();
  localStorage.removeItem(LS_LAST); render(); }
function wsDelete(sl,nm){

/* ============================================================
   DERIVED — mọi số tính tại render time, không lưu song song
   ============================================================ */
/* Mốc xét kỳ của một đoàn: ngày đi hay ngày về. Tiền thường chốt sau khi đoàn về,
   nên với kỳ thanh toán thì mốc "ngày về" đúng hơn; giữ mặc định "ngày đi" để số cũ không đổi. */
function gDate(g){ return (DB.policy.scopeBasis==='end' && g.dateEnd) ? g.dateEnd : g.date; }
function gScope(g){ return inScope(gDate(g)); }
function paxOf(g){ const a=Number(g.paxAdult)||0, c=Number(g.paxChild)||0;
  return (g.paxAdult===null&&g.paxChild===null)?(g.pax??null):(a+c); }
function tourDays(g){
  if(!g.date||!g.dateEnd) return null;
  const d=(new Date(g.dateEnd)-new Date(g.date))/86400000;
  return isFinite(d)? Math.round(d)+1 : null;
}
function inScope(dateStr){
  const f=DB.policy.scopeFrom, t=DB.policy.scopeTo;
  if(!dateStr) return true;                       // khoản không ngày (offset) luôn trong kỳ
  return (!f||dateStr>=f) && (!t||dateStr<=t);
}
function lineAmt(s){                              // thành tiền theo công thức
  if(s.u===null||s.u===undefined||s.q===null||s.q===undefined) return null;
  return s.u * s.q * (s.m||1);
}
function lineOk(s){                               // công thức có khớp số đã nhập không
  const c=lineAmt(s); if(c===null||s.a===null||s.a===undefined) return null;
  return Math.abs(c-s.a)<0.005;
}
/* Đơn vị cuối của toàn hệ là RMB. Mọi dòng dù ghi bằng tiền gì cũng quy về đây
   bằng CHÍNH tỷ giá ghi trên dòng đó — không suy ngược từ bình quân, không đoán. */
const FINAL='RMB';
function lineRmb(x){
  if(x.a===null||x.a===undefined) return null;
  if(x.ccy===FINAL) return Number(x.a);
  if(!x.rate) return null;
  return x.ccy==='VND' ? Number(x.a)/x.rate : Number(x.a)*x.rate;
}
function needRate(x){ return x.ccy!==FINAL && !x.rate; }
/* Đưa một dòng về tiền gốc của đối tác để đối soát. Cùng loại tiền thì lấy thẳng số gốc
   (không quy đổi hai lần, không sinh sai số); khác loại thì đi vòng qua RMB. */
function lineIn(x, base){
  if(x.ccy===base) return (x.a===null||x.a===undefined)?null:Number(x.a);
  const r=lineRmb(x); if(r===null) return null;
  if(base===FINAL) return r;
  if(base==='VND') return r*(Number(DB.policy.vndRate)||3850);
  if(base==='USD') return r/(Number(DB.policy.usdFixed)||6.9);
  return r;
}
function sumIn(arr, base){ return arr.filter(x=>!x.excluded).reduce((a,x)=>a+(lineIn(x,base)||0),0); }
function sumRmb(arr){ return arr.filter(x=>!x.excluded).reduce((a,x)=>a+(lineRmb(x)||0),0); }
function sumKindRmb(arr){ const m={BG:0,PS:0,DC:0,HH:0,TOT:0};
  arr.forEach(x=>{ if(x.excluded) return; const v=lineRmb(x)||0; m[x.kind]=(m[x.kind]||0)+v; m.TOT+=v; });
  return m; }
function ourLines(code,party){ const K=BK().lines, pc=party||UI.party;
  return DB[K].filter(x=>x.g===code && x.party===pc); }
function costTip(code,party){
  const pc=party||UI.party, p=DB.parties.find(y=>y.code===pc);
  return sumIn(ourLines(code,pc), (p&&p.ccy)||BASE());
}
function theirTotal(code,party){ const pc=party||UI.party;
  const b=DB.bills.find(x=>x.tour===code && x.party===pc);
  return (b&&b.total!==null&&b.total!==undefined)?Number(b.total):null; }
function groupRow(g){
  const ct = ourLines(g.code).length ? costTip(g.code) : null;
  const cs = theirTotal(g.code);
  const diff = (ct===null||cs===null) ? null : cs-ct;
  return {...g, ct, cs, diff};
}
/* tỷ giá áp dụng cho 1 khoản thanh toán, theo chính sách đang chọn */

function payVal(p){
  const P=DB.policy;
  /* Hai chế độ cho từng khoản:
     - rateSup = null  → RMB lấy đúng số NCC đã ghi trên bảng kê; tỷ giá là số SUY RA.
     - rateSup có giá trị → tỷ giá là số CHỐT (sau khi làm việc với NCC); RMB tính lại từ nó.
     Số gốc p.rmbSup luôn được giữ nguyên để đối chiếu ngược. */
  const B=BASE();
  const locked = (p.rateSup!==null && p.rateSup!==undefined && p.rateSup!=='');
  let rmbSup, rateSup;
  if(locked){ rateSup=Number(p.rateSup); rmbSup=conv(p.ccy,p.amt,rateSup,B); }
  else { rmbSup=(p.rmbSup===null||p.rmbSup===undefined)?null:Number(p.rmbSup);
         rateSup=derive(p.ccy,p.amt,rmbSup,B); }
  // --- theo sổ của ta: tỷ giá riêng của khoản nếu có, không thì theo chính sách chung
  let rmbTip=null, rateTip=null;
  if(p.amtTip!==null && p.amtTip!==undefined){
    const lt=(p.rateTip!==null&&p.rateTip!==undefined&&p.rateTip!=='');
    rateTip = lt?Number(p.rateTip):defRate(p.ccy);
    rmbTip  = conv(p.ccy,p.amtTip,rateTip,B);
  }
  const fx = (rmbTip!==null&&rmbSup!==null)? rmbTip-rmbSup : null;
  return {rmbSup, rmbTip, rateSup, rateTip, fx, lockedSup:locked,
          lockedTip:(p.rateTip!==null&&p.rateTip!==undefined&&p.rateTip!==''),
          rmbSupRaw:(p.rmbSup===null||p.rmbSup===undefined)?null:Number(p.rmbSup)};
}
/* Một "sự kiện tiền" có thể được 2 bên ghi thành số dòng khác nhau (bên mua tách 3 lệnh,
   bên bán gộp 1 dòng). Gom theo p.pair để đối soát đúng đơn vị kinh tế, không đúng đơn vị chứng từ. */
function events(list){
  const map=new Map();
  list.forEach(p=>{ const k=p.pair||p.id;
    if(!map.has(k)) map.set(k,{key:k, ids:[], ccy:p.ccy, amtSup:0, amtTip:0, rmbSup:null, rmbTip:null, members:[]});
    const e=map.get(k); const v=payVal(p);
    e.ids.push(p.id); e.members.push(p);
    if(v.rmbSup!==null){ e.rmbSup=(e.rmbSup||0)+v.rmbSup; e.amtSup+=Number(p.amt)||0; }
    if(v.rmbTip!==null){ e.rmbTip=(e.rmbTip||0)+v.rmbTip; e.amtTip+=Number(p.amtTip)||0; }
  });
  map.forEach(e=>{ e.fx=(e.rmbSup!==null&&e.rmbTip!==null)? e.rmbTip-e.rmbSup : null;
    e.label=e.ids.length>1? e.ids.join('+') : e.ids[0]; });
  return [...map.values()];
}
/* Cộng nguyên tệ phải tách theo loại tiền — USD, VND, RMB không cộng chéo được.
   Trả về chuỗi hiển thị nhiều dòng cho ô tổng. */
function ccySum(items, getCcy, getAmt){
  const m={};
  items.forEach(it=>{ const c=getCcy(it), a=getAmt(it);
    if(a===null||a===undefined) return; m[c]=(m[c]||0)+Number(a); });
  const order=['USD','VND','RMB'];
  const keys=Object.keys(m).sort((a,b)=>order.indexOf(a)-order.indexOf(b));
  if(!keys.length) return '—';
  return keys.map(c=>`<div>${c} ${n2(m[c], c==='VND'?0:2)}</div>`).join('');
}
function agg(){
  const gs = DB.groups.map(groupRow);
  const inS = g=>gScope(g);
  const gsS = gs.filter(inS);
  const costSup = gsS.reduce((a,g)=>a+(g.cs||0),0);
  const costTipS= gsS.reduce((a,g)=>a+(g.ct||0),0);
  const pays = DB[BK().money].filter(p=>p.party===UI.party && inScope(p.date));
  let credSup=0, credTip=0;
  pays.forEach(p=>{const v=payVal(p); credSup+=v.rmbSup||0; credTip+=v.rmbTip||0;});
  const ap=activeParty(); const openSup=ap?Number(ap.open)||0:0;
  return {gs, gsS, costSup, costTipS, credSup, credTip, openSup,
          balSup: openSup+costSup-credSup, pays};
}

/* ---------- cầu nối số dư: sổ bên mua → sổ bên bán ---------- */
function bridge(){
  const A=agg(), P=DB.policy;
  // phạm vi bên mua = các đoàn bên mua CÓ ghi sổ (có dòng dịch vụ) và trong kỳ
  const tipG = A.gsS.filter(g=>g.ct!==null);
  const notInTip = A.gsS.filter(g=>g.ct===null);
  const costT = tipG.reduce((a,g)=>a+g.ct,0);
  const paysT = A.pays.filter(p=>p.amtTip!==null&&p.amtTip!==undefined);
  const credT = paysT.reduce((a,p)=>a+(payVal(p).rmbTip||0),0);
  const apx=activeParty(); const openT = apx?Number(apx.openOur)||0:0;
  const balT  = openT+costT-credT;

  const addJul = notInTip.reduce((a,g)=>a+(g.cs||0),0);
  const dCost  = tipG.filter(g=>g.diff!==null&&Math.abs(g.diff)>0.005);
  const addD   = dCost.reduce((a,g)=>a+g.diff,0);
  const EV     = events(A.pays);
  const onlySup= EV.filter(e=>e.rmbSup!==null&&e.rmbTip===null);
  const subS   = onlySup.reduce((a,e)=>a+e.rmbSup,0);
  const onlyTip= EV.filter(e=>e.rmbTip!==null&&e.rmbSup===null);
  const addT   = onlyTip.reduce((a,e)=>a+e.rmbTip,0);
  const matched= EV.filter(e=>e.rmbSup!==null&&e.rmbTip!==null);
  const fxU = matched.filter(e=>e.ccy==='USD').reduce((a,e)=>a+e.fx,0);
  const fxV = matched.filter(e=>e.ccy!=='USD').reduce((a,e)=>a+e.fx,0);

  /* Đoàn TA đã ghi sổ nhưng đối tác CHƯA xuất bảng kê: chi phí này nằm trong số dư sổ ta
     mà chưa có trong sổ họ → phải trừ ra khi bắc cầu, nếu không cầu hở đúng bằng nó. */
  const noBill = A.gsS.filter(g=>g.ct!==null && g.cs===null);
  const subNB  = noBill.reduce((a,g)=>a+g.ct,0);
  const rows=[
    {id:'anchor', k:'anchor', l:'Số dư theo sổ '+CO().toUpperCase(), v:balT,
     why:`dư đầu kỳ ${n0(openT)} + chi phí ${n0(costT)} (${tipG.length} đoàn) − đã ghi có ${n0(credT)}`},
    {id:'open', k:'add', l:'(±) Chênh số dư đầu kỳ mang sang', v:(A.openSup-openT),
     why:`${SU()} ${n0(A.openSup)} vs ${CO()} ${n0(openT)}`},
    {id:'noOurs', k:'add', l:'(+) Đoàn '+SU()+' đã xuất bảng kê, '+CO()+' CHƯA vào sổ', v:addJul,
     why: notInTip.map(g=>g.code.slice(-8)+' · '+n0(g.cs)).join(' · ')||'—', ref:'g:none'},
    {id:'noTheirs', k:'sub', l:'(−) Đoàn '+CO()+' đã ghi sổ, '+SU()+' CHƯA xuất bảng kê', v:-subNB,
     why: noBill.map(g=>g.code.slice(-12)+' · '+n0(g.ct)).join(' · ')||'không có'},
    {id:'dCost', k:'add', l:'(±) Chênh chi phí cùng đoàn ('+SU()+' − '+CO()+')', v:addD,
     why: dCost.map(g=>g.code.slice(-8)+' '+sgn(g.diff,0)).join(' · ')||'không có'},
    {id:'onlySup', k:'sub', l:'(−) Thanh toán '+SU()+' đã ghi nhận, '+CO()+' CHƯA ghi', v:-subS,
     why: onlySup.map(e=>e.label+' '+e.ccy+' '+n0(e.amtSup)+' → '+n0(e.rmbSup)+' RMB').join(' · ')||'không có'},
    {id:'onlyTip', k:'add', l:'(+) Thanh toán '+CO()+' đã ghi, '+SU()+' CHƯA ghi nhận', v:addT,
     why: onlyTip.map(e=>e.label+' '+e.ccy+' '+n0(e.amtTip)).join(' · ')||'không có'},
    {id:'fxU', k:'add', l:'(+) Chênh tỷ giá USD — ghi có @'+P.usdFixed+' vs tỷ giá thực nhận của '+SU(), v:fxU,
     why: matched.filter(e=>e.ccy==='USD').length+' sự kiện khớp đôi'},
    {id:'fxV', k:'add', l:'(+) Chênh tỷ giá VND — quy đổi @'+n0(P.vndTip)+' vs '+SU()+' ghi có @'+n0(P.vndRate), v:fxV,
     why: matched.filter(e=>e.ccy!=='USD').length+' sự kiện khớp đôi'}
  ];
  const total = rows.reduce((a,r)=>a+r.v,0);
  return {rows, total, check:A.balSup, tipG, notInTip, noBill, onlySup, onlyTip, matched, balT, EV,
          val:id=>{const r=rows.find(x=>x.id===id); return r?r.v:0;}};
}

function readJson(f,cb){ const r=new FileReader();
  r.onload=()=>{ try{ cb(JSON.parse(r.result)); }catch(e){ pill('File JSON lỗi: '+e.message,'err'); } };
  r.readAsText(f); }
function openFromFile(el){ const f=el.files[0]; if(!f) return;

function sideFilter(){

      "UI.fCus=this.value;render()");
    h+=sel('Mã đoàn',UI.fTmp||'all',[['all','Tất cả'],['tmp','Còn dùng mã tạm'],['real','Đã có mã khách']],"UI.fTmp=this.value;render()");
  }
  else if(t==='t1'){
    h+=sel('Cấu phần',UI.fComp||'all',[['all','Tất cả']].concat(DB.components.map(c=>[c.code,c.name])),"UI.fComp=this.value;render()");
    h+=sel('Nhóm',UI.fKind||'all',[['all','Tất cả']].concat(KIND_ORDER.map(k=>[k,KIND[k]])),"UI.fKind=this.value;render()");
    h+=sel('Tỷ giá',UI.fRate||'all',[['all','Tất cả'],['miss','Chỉ dòng thiếu tỷ giá']],"UI.fRate=this.value;render()");

  }
  else if(t==='t2'){
    h+=sel('Chiều tiền',UI.fDir||'all',[['all','Tất cả'],['out','Chi'],['in','Thu']],"UI.fDir=this.value;render()");

  const B=bridge(), A=agg();

   <div class="kv"><b>Giao dịch chưa gán</b><span>${DB.bank.filter(x=>inScope(x.date)&&!allocOf(x.id).length).length}</span></div>
   <div class="kv"><b>Dòng thiếu tỷ giá</b><span>${[...DB.services,...DB.revenues].filter(needRate).length}</span></div>
   </div>`;
  return h;
}

   vì đây là chỗ duy nhất trong toàn bộ migration mà hệ đoán thay vì chép. */
function guessComp(x){
  const d=(x.d||'')+' '+(x.t||'');
  if(/地接团款|Group payment/i.test(d)) return 'TOUR';        // xét trước: "phạt cọc" của tiền tour không phải vé
  if(/领队机票|机票|TICKET|vé máy bay/i.test(d)) return 'AIR';
  if(/签证|visa/i.test(d)) return 'VISA';
  if(/单房差|Single Supplement|khách sạn|hotel|酒店|入住|房/i.test(d)) return 'HOTEL';
  if(/地接团款|Group payment|附加费|Surcharge|不占床|No extra bed|玫瑰|rose|小费|Tip|退餐/i.test(d)) return 'TOUR';
  return 'TOUR';
}
function guessKind(x){
  const d=(x.d||'');
  if(/玫瑰|rose|hoa hồng/i.test(d)) return 'HH';
  if(/^退|退\s|Hoàn|hoàn|giảm|优惠|自理|取消|đã chuẩn hóa dấu/i.test(d) || (Number(x.a)<0 && !/玫瑰|rose/i.test(d))) return 'DC';
  if(/附加费|Surcharge|罚款|罚金|Penalty|phạt|小费|Tip|phát sinh/i.test(d)) return 'PS';
  return 'BG';
}

function addParty(kindPre){
  let kind=kindPre;
  if(!kind){
    const k=prompt('LOẠI ĐỐI TÁC — gõ 1 hoặc 2:\n  1. NCC — Nhà cung cấp (sổ chi phí / phải trả)\n  2. KH — Khách hàng (sổ doanh thu / phải thu)\n\nPhân loại này quyết định đối tác nằm ở sổ nào và không đổi được sau khi đã có dữ liệu.','1');
    if(k===null) return; kind = String(k).trim()==='2' ? 'cus' : 'sup';
  }
  const name=prompt(kind==='sup'?'Tên nhà cung cấp:':'Tên khách hàng / đại lý:'); if(!name) return;
  const seed=name.trim().split(/\s+/)[0].slice(0,8);
  let short=prompt('Nhãn ngắn — TÊN VIẾT TẮT của đối tác (≤8 ký tự), không phải loại đối tác:', seed);
  if(short===null) return;
  if(looksLikeKind(short)){
    if(!confirm(`"${short}" là LOẠI đối tác chứ không phải tên.\n\nLoại đã được ghi riêng rồi (${KIND_LBL[kind]}).\nNhãn ngắn nên là tên viết tắt để phân biệt các đối tác cùng loại — vd "${seed}".\n\nVẫn giữ "${short}"?`)) short=seed;
  }
  let code=slugify(name).toUpperCase().replace(/-/g,'').slice(0,8)||('P'+DB.parties.length);
  let i=1; while(DB.parties.some(p=>p.code===code)) code=code.slice(0,7)+(++i);
  push(); DB.parties.push(fixParty({code, kind, name, short:short||code, ccy:kind==='sup'?'RMB':'VND'}));
  UI.party=code; save(); render(); pill('Đã thêm đối tác '+name,'ok');
}

function addPart(tour){
  const sup=DB.parties.filter(p=>p.kind==='sup');
  if(!sup.length){ pill('Chưa khai nhà cung cấp nào','err'); return; }
  const cList=DB.components.map((c,i)=>` ${i+1}. ${c.name}`).join('\n');
  const ci=prompt('Cấu phần nào?\n'+cList+'\n\nGõ số, hoặc gõ TÊN MỚI để khai thêm cấu phần:','1');
  if(ci===null) return;
  let comp;
  const idx=parseInt(ci,10);
  if(idx>=1&&idx<=DB.components.length) comp=DB.components[idx-1].code;
  else { const nm=ci.trim(); if(!nm) return;
    comp=slugify(nm).toUpperCase().replace(/-/g,'').slice(0,8)||'C'+DB.components.length;
    if(!DB.components.some(c=>c.code===comp)) DB.components.push({code:comp,name:nm,note:'khai thêm khi nhập đoàn'}); }
  const sList=sup.map((p,i)=>` ${i+1}. ${pLabel(p)}`).join('\n');
  const si=prompt('Nhà cung cấp của cấu phần này?\n'+sList,'1'); if(si===null) return;
  const sp=sup[parseInt(si,10)-1]; if(!sp){ pill('Không nhận ra nhà cung cấp','err'); return; }
  const cp=prompt('Mã đoàn phía '+sp.name+' (để đối soát):',''); if(cp===null) return;
  push(); DB.tourParts.push({id:'TP'+Date.now().toString(36).toUpperCase().slice(-5),
    tour, comp, party:sp.code, codeParty:cp.trim()||null, note:''});
  save(); render(); pill('Đã khai cấu phần '+compName(comp)+' — '+sp.short,'ok');
}

/* Nhãn cho mọi danh sách chọn đối tác. Chỉ hiện nhãn ngắn là hỏng ngay khi nhãn ngắn
   bị đặt trùng nhau hoặc bị điền bằng loại đối tác — luôn kèm tên đầy đủ. */
function pLabel(p){ if(!p) return '—';
  const n=(p.legal&&p.legal.fullName)||p.name||p.code;
  return (p.short && p.short!==n) ? `${p.short} — ${n}` : n; }
function pOpts(kind, cur, blank){
  const ps=DB.parties.filter(p=>!kind||p.kind===kind);
  return (blank?`<option value="">${esc(blank)}</option>`:'')
    + ps.map(p=>`<option value="${esc(p.code)}"${cur===p.code?' selected':''}>${esc(pLabel(p))}</option>`).join('');
}

/* Lãi lỗ một đoàn, trình bày bằng VND.
   Giá vốn quy đổi theo TỶ GIÁ THỰC TRẢ của phần đã trả, phần chưa trả dùng tỷ giá chính sách
   và được gắn nhãn ước tính — không trộn hai loại vào một con số im lặng. */
/* Tỷ giá thực trả bình quân của một nhà cung cấp trong kỳ.
   Dùng bình quân cả kỳ chứ không khớp từng lệnh với từng đoàn: bên bán cấn tiền vào đoàn
   theo ý họ (có đoàn cấn thừa, có đoàn cấn thiếu), nên khớp lệnh–đoàn cho ra tỷ giá vô nghĩa.
   vndOut = số VND THỰC TRỪ khỏi tài khoản, đọc trên ủy nhiệm chi. Không có thì phải ước và nói rõ. */
function supRate(partyCode){
  const R=Number(DB.policy.vndRate)||3850;
  const pp=DB.parties.find(x=>x.code===partyCode);
  if(pp && pp.ccy==='VND') return {rate:1, base:0, vnd:0, nEst:0, nAct:0, est:false};
  let base=0, vnd=0, nEst=0, nAct=0;
  const keep=UI.party; UI.party=partyCode;
  DB.payments.filter(m=>m.party===partyCode && inScope(m.date)).forEach(m=>{
    const v=payVal(m); if(v.rmbSup===null) return;
    base+=v.rmbSup;
    if(m.vndOut!==null&&m.vndOut!==undefined&&m.vndOut!==''){ vnd+=Number(m.vndOut); nAct++; }
    else { vnd+=v.rmbSup*R; nEst++; }
  });
  UI.party=keep;
  return {rate: base>0? vnd/base : R, base, vnd, nEst, nAct, est:nEst>0};
}
function tourPL(code){
  const rev=sumRmb(DB.revenues.filter(x=>x.g===code));
  const costs=[];
  DB.parties.filter(p=>p.kind==='sup').forEach(p=>{
    const arr=DB.services.filter(x=>x.g===code&&x.party===p.code);
    const hasBill=DB.bills.some(b=>b.tour===code&&b.party===p.code);
    if(!arr.length && !hasBill) return;
    const base=p.ccy||FINAL;
    const mix={}; arr.filter(x=>!x.excluded).forEach(x=>{ mix[x.ccy]=(mix[x.ccy]||0)+(Number(x.a)||0); });
    costs.push({party:p.code, short:p.short, ccy:base, raw:sumIn(arr,base), mix,
                rmb:sumRmb(arr), miss:arr.filter(needRate).length});
  });
  const cost=costs.reduce((a,c)=>a+c.rmb,0);
  const g=DB.groups.find(x=>x.code===code)||{};
  const missRev=DB.revenues.filter(x=>x.g===code&&needRate(x)).length;
  return {code, rev, cost, gp:rev-cost, margin:rev?(rev-cost)/rev:null,
          pax:paxOf(g), perPax:paxOf(g)?(rev-cost)/paxOf(g):null, costs,
          hasRev:rev!==0, est:costs.some(c=>c.miss)||missRev>0,
          missRate:costs.reduce((a,c)=>a+c.miss,0)+missRev};
}

           title="Ngày đoàn về — mốc để chốt tiền với NCC và với khách"
           onclick="event.stopPropagation()" onchange="setGroup('${esc(g.code)}','dateEnd',this.value)"></td>
      <td class="num tiny">${(()=>{const d=tourDays(g); return d===null?'—':(d<1?'<span class="chip err">!</span>':d);})()}</td>
      <td><input class="cellin num" value="${g.paxAdult??''}" title="Người lớn" onclick="event.stopPropagation()" onchange="setGroup('${esc(g.code)}','paxAdult',this.value)"></td>
      <td><input class="cellin num" value="${g.paxChild??''}" title="Trẻ em" onclick="event.stopPropagation()" onchange="setGroup('${esc(g.code)}','paxChild',this.value)"></td>
      <td><input class="cellin mono" style="font-size:11px" value="${esc(g.air||'')}" placeholder="?"
           onclick="event.stopPropagation()" onchange="setGroup('${esc(g.code)}','air',this.value)"></td>
      <td class="tiny">${partsChips(g.code)}</td>
      <td style="max-width:1px"><input class="cellin" style="font-size:11px" value="${esc(g.route||'')}"
          title="${esc(g.route||'')}" placeholder="—"
          onclick="event.stopPropagation()" onchange="setGroup('${esc(g.code)}','route',this.value)"></td>
      <td class="tiny" style="line-height:1.6">${gapChips(g)}</td>
      <td style="max-width:1px"><input class="cellin" style="font-size:11px" value="${esc(g.note||'')}"
          title="${esc(g.note||'')}" placeholder="—"
          onclick="event.stopPropagation()" onchange="setGroupNote('${esc(g.code)}',this.value)"></td></tr>`;
  });
  const nDone=rows.filter(g=>!gapList(g).length).length;
  h+=`<tr class="tot"><td colspan="7">TỔNG ${rows.length} ĐOÀN TRONG KỲ</td>
      <td class="num">${rows.reduce((a,g)=>a+(Number(g.paxAdult)||0),0)}</td>
      <td class="num">${rows.reduce((a,g)=>a+(Number(g.paxChild)||0),0)}</td>
      <td colspan="3"></td>
      <td class="tiny">${nDone}/${rows.length} đoàn đủ dữ liệu</td><td></td></tr></tbody></table></div>`;
  h+=`<div class="tiny" style="margin-top:6px">Đây là <b>danh mục điều hành</b> — cột “còn thiếu” cho biết đoàn nào chưa đủ dữ liệu để lên số.
   Doanh thu, giá vốn và lãi gộp xem ở <b>chi tiết từng đoàn</b> (bấm ⤢) hoặc ở <b>tab Báo cáo</b>.</div>`;
  return h;
}
/* Mọi nơi trỏ về mã đoàn. Đổi mã mà bỏ sót một chỗ là bản ghi đó mồ côi — không báo lỗi,
   chỉ lặng lẽ biến mất khỏi mọi bảng. Vì vậy cascade phải liệt kê đủ và đếm được. */
/* OWNED  = bản ghi chỉ tồn tại vì đoàn này → xóa đoàn thì xóa theo.
   TAGGED = bản ghi tồn tại độc lập, chỉ GẮN NHÃN đoàn → xóa đoàn thì gỡ nhãn, KHÔNG xóa.
   Nhầm hai nhóm này là xóa mất tiền đã chi khỏi sổ. */
const TOUR_OWNED =[['services','g'],['revenues','g'],['bills','tour'],['tourParts','tour']];
const TOUR_TAGGED=[['payments','allocSup'],['payments','allocTip'],
                   ['receipts','allocSup'],['receipts','allocTip']];
const TOUR_REFS=[...TOUR_OWNED,...TOUR_TAGGED];
function countRefs(code){
  const c={}; let tot=0;
  TOUR_REFS.forEach(([k,f])=>{ const n=DB[k].filter(x=>x[f]===code).length;
    if(n){ c[k+'.'+f]=n; tot+=n; } });
  return {c, tot};
}
function renameTour(oldCode){
  const g=DB.groups.find(x=>x.code===oldCode); if(!g) return;
  const nw=prompt('Mã nội bộ mới cho đoàn này:\n(mọi bản ghi đang trỏ về mã cũ sẽ được đổi theo)', oldCode);
  if(nw===null) return;
  const code=nw.trim();
  if(!code||code===oldCode) return;
  if(DB.groups.some(x=>x.code===code)){ pill('Mã "'+code+'" đã tồn tại ở đoàn khác','err'); return; }
  const r=countRefs(oldCode);
  const detail=Object.entries(r.c).map(([k,n])=>'  · '+n+' × '+k).join('\n')||'  · không có bản ghi nào tham chiếu';
  if(!confirm(`Đổi mã đoàn:\n  ${oldCode}\n→ ${code}\n\nSẽ cập nhật theo ${r.tot} tham chiếu:\n${detail}\n\nMã báo khách và mã NCC KHÔNG bị đổi. Có thể hoàn tác bằng Undo.`)) return;
  push();
  g.code=code;
  TOUR_REFS.forEach(([k,f])=>DB[k].forEach(x=>{ if(x[f]===oldCode) x[f]=code; }));
  DB.bills.forEach(b=>{ if(b.id==='B-'+oldCode) b.id='B-'+code; });
  DB.groups.sort((x,y)=>((x.date||'')+x.code).localeCompare((y.date||'')+y.code));
  if(UI.selGroup===oldCode) UI.selGroup=code;
  save(); render(); pill(`Đã đổi mã đoàn → ${code} (${r.tot} tham chiếu cập nhật theo)`,'ok');
  logline(`rename ${oldCode} → ${code} · ${r.tot} refs`);
}
const REF_LBL={'services.g':'dòng chi phí','revenues.g':'dòng doanh thu','bills.tour':'bảng kê đối tác',
  'payments.allocSup':'khoản chi — phân bổ bên bán','payments.allocTip':'khoản chi — phân bổ bên ta',
  'receipts.allocSup':'khoản thu — phân bổ đối tác','receipts.allocTip':'khoản thu — phân bổ bên ta'};
function delTour(code){
  const own=[], tag=[];
  TOUR_OWNED.forEach(([k,f])=>{const n=DB[k].filter(x=>x[f]===code).length; if(n) own.push([k+'.'+f,n]);});
  TOUR_TAGGED.forEach(([k,f])=>{const n=DB[k].filter(x=>x[f]===code).length; if(n) tag.push([k+'.'+f,n]);});
  const nOwn=own.reduce((a,x)=>a+x[1],0), nTag=tag.reduce((a,x)=>a+x[1],0);
  let msg=`Xóa đoàn ${code}?\n\n`;
  msg += nOwn ? `SẼ XÓA THEO ${nOwn} bản ghi chỉ thuộc về đoàn này:\n`
        + own.map(([k,n])=>'  · '+n+' '+(REF_LBL[k]||k)).join('\n')+'\n\n'
      : 'Đoàn này chưa có dòng chi phí / doanh thu / bảng kê nào.\n\n';
  if(nTag) msg += `GIỮ NGUYÊN ${nTag} khoản tiền, chỉ gỡ nhãn đoàn:\n`
        + tag.map(([k,n])=>'  · '+n+' '+(REF_LBL[k]||k)).join('\n')
        + '\nTiền đã chi/thu vẫn nằm trong sổ và vẫn vào số chốt, nhưng thành khoản chưa phân bổ đoàn.\n\n';
  msg += 'Số dư đối soát và lãi lỗ sẽ thay đổi. Có thể hoàn tác bằng Undo.';
  if(!confirm(msg)) return;
  push();
  TOUR_OWNED.forEach(([k,f])=>{ DB[k]=DB[k].filter(x=>x[f]!==code); });
  TOUR_TAGGED.forEach(([k,f])=>{ DB[k].forEach(x=>{ if(x[f]===code) x[f]=null; }); });
  DB.groups=DB.groups.filter(g=>g.code!==code);
  if(UI.selGroup===code) UI.selGroup=null;
  save(); render();
  pill(`Đã xóa đoàn ${code} — ${nOwn} bản ghi xóa theo, ${nTag} khoản tiền giữ lại và gỡ nhãn`,'warn');
  logline(`del tour ${code}: -${nOwn} owned, ${nTag} untagged`);
}
function dupTour(code){
  const g=DB.groups.find(x=>x.code===code); if(!g) return;
  const nw=prompt('Mã nội bộ cho đoàn mới:', code+'-COPY'); if(nw===null) return;
  const nc=nw.trim(); if(!nc) return;
  if(DB.groups.some(x=>x.code===nc)){ pill('Mã "'+nc+'" đã tồn tại','err'); return; }
  const nS=DB.services.filter(x=>x.g===code).length, nR=DB.revenues.filter(x=>x.g===code).length;
  let copyLines=false;
  if(nS+nR){ copyLines=confirm(`Chép sang đoàn mới cả ${nS} dòng chi phí và ${nR} dòng doanh thu?\n\nOK = chép (giữ nguyên đơn giá, số lượng, thành tiền — nhớ sửa lại theo đoàn mới)\nCancel = chỉ tạo đoàn rỗng`); }
  push();
  const ng={...g, code:nc, codeCus:null, codeSup:null, note:'Nhân bản từ '+code};
  DB.groups.push(ng);
  if(copyLines){
    const st=Date.now().toString(36).toUpperCase().slice(-4);
    DB.services.filter(x=>x.g===code).forEach((x,i)=>DB.services.push({...x, id:'S'+st+'-'+i, g:nc, src:'nhân bản từ '+code}));
    DB.revenues.filter(x=>x.g===code).forEach((x,i)=>DB.revenues.push({...x, id:'V'+st+'-'+i, g:nc, src:'nhân bản từ '+code}));
  }
  DB.groups.sort((x,y)=>((x.date||'')+x.code).localeCompare((y.date||'')+y.code));
  UI.selGroup=nc; save(); render();
  pill(`Đã tạo ${nc}${copyLines?` kèm ${nS+nR} dòng`:' (rỗng)'} — nhớ sửa ngày, mã đối tác và số liệu`,'ok');
}
/* Danh mục đoàn là bảng ĐIỀU HÀNH. Bốn cột tài chính nhường chỗ cho một cột kiểm tra
   độ hoàn thiện dữ liệu — thứ người điều hành cần thấy ở màn hình này.
   Số tiền xem ở chi tiết từng đoàn hoặc tab Báo cáo. */
function gapList(g){
  const out=[];   /* [màu, nhãn ngắn, mô tả đầy đủ] — nhãn ngắn để 3–4 mục vẫn nằm một dòng */
  if(!g.cus) out.push(['err','khách','Chưa gán khách hàng — đoàn chưa thuộc sổ phải thu nào']);
  if(!DB.tourParts.some(t=>t.tour===g.code)) out.push(['err','cấu phần','Chưa khai cấu phần dịch vụ và NCC của từng cấu phần']);
  if(!DB.services.some(x=>x.g===g.code)) out.push(['err','chi phí','Chưa có dòng chi phí nào']);
  if(!DB.revenues.some(x=>x.g===g.code)) out.push(['err','doanh thu','Chưa có dòng doanh thu nào — lãi gộp chưa tính được']);
  if(!g.dateEnd) out.push(['','ngày về','Thiếu ngày về — không dùng được mốc kỳ theo ngày về']);
  if([...DB.services,...DB.revenues].some(x=>x.g===g.code&&needRate(x))) out.push(['warn','tỷ giá','Có dòng chưa đặt tỷ giá — đang bị tính là 0 khi quy RMB']);
  if(!DB.bills.some(b=>b.tour===g.code)) out.push(['warn','bảng kê','NCC chưa xuất bảng kê cho đoàn này — chưa đối soát chi phí được']);
  return out;
}
function gapChips(g){ const l=gapList(g);
  return l.length? l.map(([c,t,f])=>`<span class="chip ${c}" title="${esc(f)}">${t}</span>`).join(' ')
                 : '<span class="chip ok">đủ dữ liệu</span>'; }
function partsChips(code){
  const ps=DB.tourParts.filter(t=>t.tour===code);
  return (ps.length? ps.map(t=>`<span class="chip" title="${esc(pShort(t.party))}${t.codeParty?' · mã '+esc(t.codeParty):''}">${esc(t.comp)}</span>`).join(' ')
                   : '<span class="chip err">chưa khai</span>')
    + ` <button class="btn sm" onclick="event.stopPropagation();UI.selGroup='${esc(code)}';UI.editParts=true;render()">⋯</button>`;
}
/* Đổi khóa đoàn sang chính mã khách — dùng lại cascade đã có, không viết lại. */
function promoteCode(code){
  const g=DB.groups.find(x=>x.code===code); if(!g||!g.codeCus) return;
  const nc=g.codeCus.trim();
  const iss=codeCusIssue(g);
  if(iss){ alert(`Không nâng "${nc}" làm khóa đoàn được.\n\n${iss}.\n\nSửa mã báo khách cho duy nhất rồi thử lại.`); return; }
  if(DB.groups.some(x=>x.code===nc)){ pill('Mã "'+nc+'" trùng khóa đoàn khác','err'); return; }
  const r=countRefs(code);
  if(!confirm(`Dùng mã khách làm khóa đoàn?\n  ${code}  (mã tạm)\n→ ${nc}\n\nCập nhật ${r.tot} tham chiếu. Có thể Undo.`)) return;
  push();
  g.code=nc; g.tmp=false;
  TOUR_REFS.forEach(([k,f])=>DB[k].forEach(x=>{ if(x[f]===code) x[f]=nc; }));
  DB.tourParts.forEach(t=>{ if(t.tour===code) t.tour=nc; });
  DB.groups.sort((x,y)=>((x.date||'')+x.code).localeCompare((y.date||'')+y.code));
  if(UI.selGroup===code) UI.selGroup=nc;
  save(); render(); pill(`Khóa đoàn → ${nc} · ${r.tot} tham chiếu cập nhật`,'ok');
}
/* Mã báo khách là số hiệu đoàn trên chứng từ gửi khách, không phải danh tính khách.
   Nhưng nó có thể được nâng lên làm khóa đoàn, nên phải kiểm trùng ngay lúc nhập —
   phát hiện lúc bấm "dùng làm khóa" thì đã muộn. */
function codeCusIssue(g){
  const c=(g.codeCus||'').trim(); if(!c) return null;
  if(DB.groups.some(x=>x.code===c && x.code!==g.code)) return 'Trùng khóa đoàn khác — không nâng làm khóa được';
  if(DB.groups.some(x=>x!==g && (x.codeCus||'').trim()===c)) return 'Trùng mã báo khách của đoàn khác';
  if(DB.parties.some(p=>p.code===c)) return 'Trùng mã đối tác — dễ nhầm khi tra ngược';
  return null;
}
function openTourLines(code){ UI.selGroup=code; UI.selPay=null; UI.selParty=null; go('t1'); }
function setGroup(code,f,v){
  push(); const g=DB.groups.find(x=>x.code===code);
  g[f] = (['pax','paxAdult','paxChild'].includes(f)) ? (v===''?null:num(v)) : (v===''?null:v);
  if(f==='codeCus'&&v){ g.tmp = (g.code!==v.trim());
    const iss=codeCusIssue(g);
    if(iss) pill('Mã báo khách "'+v.trim()+'": '+iss,'err'); }
  save(); render(); pill('Đã cập nhật đoàn '+code,'ok');
}

/* ============================================================
   TAB — LÃI LỖ THEO ĐOÀN
   ============================================================ */
function viewPL(){
  const rows=DB.groups.filter(gScope).map(g=>tourPL(g.code));
  const sup=DB.parties.filter(p=>p.kind==='sup');
  const tR=rows.reduce((a,r)=>a+r.rev,0), tC=rows.reduce((a,r)=>a+r.cost,0);
  const noRev=rows.filter(r=>!r.hasRev).length;
  let h=`<div class="hint">Lãi lỗ là <b>phép trừ hai sổ đã đối soát</b>, không phải bảng nhập tay riêng. Đoàn nào chưa nhập doanh thu hoặc chưa đối soát xong chi phí thì con số ở đây chưa dùng để ra quyết định được — cột trạng thái nói rõ đoàn nào đang ở tình trạng đó.</div>`;
  h+=`<div class="grid3">
   <div class="card"><h4>Doanh thu trong kỳ</h4><div class="mono" style="font-size:20px">${n2(tR,0)}</div><div class="tiny">VND · ${rows.length-noRev}/${rows.length} đoàn đã có doanh thu</div></div>
   <div class="card"><h4>Giá vốn trong kỳ</h4><div class="mono" style="font-size:20px">${n2(tC,0)}</div><div class="tiny">VND · ${sup.length} nhà cung cấp</div></div>
   <div class="card" style="border-color:var(--accent)"><h4>Lãi gộp</h4>
     <div class="mono ${tR-tC<0?'neg':'pos'}" style="font-size:20px">${n2(tR-tC,0)}</div>
     <div class="tiny">VND · biên ${tR?n2((tR-tC)/tR*100,1)+'%':'—'}</div></div></div>`;
  if(noRev) h+=`<div class="card" style="border-color:#e8d8a8;background:var(--warn-soft)"><div class="tiny">
    <b>${noRev} đoàn chưa có dòng doanh thu nào.</b> Giá vốn của chúng đang nằm trong tổng nhưng doanh thu bằng 0 → lãi gộp toàn kỳ đang bị hiểu thấp. Nhập doanh thu ở sổ khách hàng trước khi đọc con số biên lãi.</div></div>`;
  h+=`<div class="sect"><h3>Lãi lỗ từng đoàn</h3><span class="d">Giá vốn tách theo từng nhà cung cấp</span></div>`;
  h+=`<div class="wrap"><table><thead><tr><th style="width:165px">Đoàn</th><th style="width:110px">Khách</th>
     <th class="num" style="width:45px">Pax</th><th class="num" style="width:110px">Doanh thu</th>
     ${sup.map(p=>`<th class="num" style="width:100px">GV ${esc(p.short)}</th>`).join('')}
     <th class="num" style="width:110px">Lãi gộp</th><th class="num" style="width:50px">%</th>
     <th class="num" style="width:95px">Lãi/khách</th><th style="width:130px">Trạng thái</th></tr></thead><tbody>`;
  rows.forEach(r=>{
    const g=DB.groups.find(x=>x.code===r.code);
    const ok=matches(r.code)||matches(g.codeCus||'');
    if(!keep(ok)) return;
    const st = !r.hasRev ? ['err','Chưa có doanh thu'] : (r.est?['warn','Còn nợ NCC — GV ước']:['ok','Đủ dữ liệu']);
    h+=`<tr class="${rowCls(ok)}" onclick="UI.selGroup='${esc(r.code)}';render()">
      <td class="mono" style="font-size:11px">${esc(r.code)}<div class="tiny">${esc(g.codeCus||'')}</div></td>
      <td class="tiny">${esc(pShort(g.cus))}</td><td class="num">${g.pax??'—'}</td>
      <td class="num">${r.rev?n2(r.rev,0):'—'}</td>
      ${sup.map(p=>{const c=r.costs.find(x=>x.party===p.code);
        return `<td class="num">${c?n2(c.costVnd,0):'—'}</td>`;}).join('')}
      <td class="num ${r.gp<0?'neg':'pos'}">${r.hasRev?n2(r.gp,0):'—'}</td>
      <td class="num tiny">${r.margin!==null&&r.hasRev?n2(r.margin*100,1):'—'}</td>
      <td class="num tiny">${r.perPax!==null&&r.hasRev?n2(r.perPax,0):'—'}</td>
      <td><span class="chip ${st[0]}">${st[1]}</span></td></tr>`;
  });
  h+=`<tr class="tot"><td colspan="3">TỔNG</td><td class="num">${n2(tR,0)}</td>

     <td class="num ${tR-tC<0?'neg':'pos'}">${n2(tR-tC,0)}</td>
     <td class="num tiny">${tR?n2((tR-tC)/tR*100,1):'—'}</td><td colspan="2"></td></tr></tbody></table></div>`;
  if(UI.selGroup){
    const r=tourPL(UI.selGroup);
    h+=`<div class="sect"><h3>Cấu thành giá vốn — ${esc(UI.selGroup)}</h3></div>

        <td class="tiny">${Object.entries(c.mix).map(([k,v])=>k+' '+n2(v,0)).join(' · ')}</td>
        <td class="tiny">${c.miss?`<span class="chip err">${c.miss} dòng thiếu tỷ giá</span>`:'<span class="chip ok">đủ tỷ giá</span>'}</td>
        <td class="num">${n2(c.rmb,0)}</td></tr>`).join('')
        ||'<tr><td colspan="6" class="tiny">Đoàn này chưa có chi phí từ nhà cung cấp nào.</td></tr>'}
      </tbody></table></div>`;
  }
  return h;
}



/* ============================================================
   DÒNG DỊCH VỤ HAI MẶT
   Một hạng mục dịch vụ vốn có hai mặt: bán cho khách và mua từ NCC.
   Phần dùng chung (cấu phần · nội dung · số lượng) nằm giữa, hai bên là phần đặc thù.
   Ghép bằng trường "link"; dòng chỉ có một mặt vẫn hợp lệ (phạt, hoa hồng một phía)
   nhưng bị gắn cờ để thấy ngay chỗ có mua mà không có bán.
   ============================================================ */
function itemsOf(tour){
  const map=new Map(); const key=x=>x.link||('#'+x.id);
  DB.revenues.filter(x=>x.g===tour).forEach(x=>map.set(key(x),{key:key(x),sell:x,buy:[]}));
  DB.services.filter(x=>x.g===tour).forEach(x=>{ const k=key(x);
    if(map.has(k)) map.get(k).buy.push(x); else map.set(k,{key:k,sell:null,buy:[x]}); });
  const out=[...map.values()];
  out.forEach(it=>{ const r=it.sell||it.buy[0]; it.comp=r.comp; it.kind=r.kind; it.d=r.d; it.q=r.q; it.m=r.m;
    it.sellRmb=it.sell?lineRmb(it.sell):null;
    it.buyRmb=it.buy.length?it.buy.reduce((a,x)=>a+(lineRmb(x)||0),0):null;
    it.gp=(it.sellRmb!==null&&it.buyRmb!==null)?it.sellRmb-it.buyRmb:null;
    it.only = !it.sell ? 'buy' : (!it.buy.length ? 'sell' : null); });
  out.sort((a,b)=>KIND_ORDER.indexOf(a.kind)-KIND_ORDER.indexOf(b.kind)
    || (a.comp||'').localeCompare(b.comp||''));
  return out;
}
function newLink(){ return 'L'+Date.now().toString(36).toUpperCase().slice(-6)+Math.floor(Math.random()*90+10); }

  ${['RMB','VND','USD'].map(c=>`<option value="${c}"${x.ccy===c?' selected':''}>${c}</option>`).join('')}</select>`; }
function rateCell(x){ return x.ccy===FINAL ? '<span class="tiny mut" style="display:block;text-align:right">1</span>'
  : `<input class="cellin num mono" style="font-size:10px${needRate(x)?';background:var(--neg-soft)':''}"
      title="Tỷ giá quy về RMB" value="${x.rate??''}" placeholder="cần" onchange="setLine('${x.id}','rate',this.value)">`; }

   ${nOnlyBuy?`<b class="neg">${nOnlyBuy} hạng mục có mua mà chưa có bán</b> — đây là chỗ chi phí không được thu lại.`:''}

/* Sửa trường dùng chung: áp cho cả hai mặt để chúng không trôi khỏi nhau. */
function setShared(key,tour,f,v){
  push();
  const targets=[...DB.revenues,...DB.services].filter(x=>x.g===tour && (x.link?x.link===key:('#'+x.id)===key));
  targets.forEach(x=>{
    /* Phải xét đồng bộ TRƯỚC khi ghi giá trị mới — ghi xong rồi mới xét thì
       dòng nào cũng thành "lệch công thức" và không bao giờ tính lại. */
    const wasInSync = lineOk(x)===true || x.a===null || x.a===undefined;
    x[f]=(f==='q')?(v===''?null:num(v)):v;
    if(f==='comp') delete x.compGuess; if(f==='kind') delete x.kindGuess;
    if(f==='q' && wasInSync){ const c=lineAmt(x); if(c!==null) x.a=Math.round(c*100)/100; } });
  save(); render(); pill(`Đã sửa ${targets.length>1?'cả hai mặt':'hạng mục'}`,'ok');
}
function mkLine(K,tour,link,party,comp,kind,d,q,ccy){
  const id=(K==='revenues'?'V':'S')+Date.now().toString(36).toUpperCase().slice(-5)+Math.floor(Math.random()*90+10);
  const rate = ccy===FINAL?1:(ccy==='VND'?(Number(DB.policy.vndRate)||null):(Number(DB.policy.usdFixed)||null));
  DB[K].push({id, g:tour, party, link, side:(K==='revenues'?'sell':'buy'), comp, kind,
    d, u:null, uTxt:null, m:null, q, a:null, ccy, rate, t:'other', src:'nhập tay', note:''});
  return id;
}
function addItem(tour,mode){
  const g=DB.groups.find(x=>x.code===tour);
  const sup=DB.parties.filter(p=>p.kind==='sup');
  if(mode!=='sell' && !sup.length){ pill('Chưa khai nhà cung cấp nào','err'); return; }
  if(mode!=='buy' && !g.cus){ if(!confirm('Đoàn này chưa gán khách hàng.\n\nVẫn tạo dòng bán? Dòng sẽ chưa thuộc sổ phải thu nào cho tới khi gán khách ở tab Đoàn.')) return; }
  push(); const link=newLink();
  if(mode!=='buy') mkLine('revenues',tour,link,g.cus||null,'TOUR','BG','',null,(DB.meta.baseRev||'VND'));
  if(mode!=='sell') mkLine('services',tour,link,sup[0].code,'TOUR','BG','',null,(sup[0].ccy||FINAL));
  save(); render();
  pill(mode==='both'?'Đã thêm hạng mục hai mặt — điền nội dung, SL rồi giá từng bên'
      :(mode==='sell'?'Đã thêm dòng chỉ bán':'Đã thêm dòng chỉ mua'),'ok');
}
/* Tạo mặt còn thiếu cho một hạng mục, chép sẵn phần dùng chung. */
function pairSide(key,tour,want){
  const src=[...DB.revenues,...DB.services].find(x=>x.g===tour && (x.link?x.link===key:('#'+x.id)===key));
  if(!src) return;
  const g=DB.groups.find(x=>x.code===tour), sup=DB.parties.filter(p=>p.kind==='sup');
  if(want==='buy'&&!sup.length){ pill('Chưa khai nhà cung cấp nào','err'); return; }
  push();
  const link=src.link||newLink();
  [...DB.revenues,...DB.services].filter(x=>x.g===tour&&(x.link?x.link===key:('#'+x.id)===key)).forEach(x=>x.link=link);
  const id=want==='sell'
    ? mkLine('revenues',tour,link,g.cus||null,src.comp,src.kind,src.d,src.q,(DB.meta.baseRev||'VND'))
    : mkLine('services',tour,link,sup[0].code,src.comp,src.kind,src.d,src.q,(sup[0].ccy||FINAL));
  save(); render();
  pill(`Đã tạo dòng ${want==='sell'?'bán':'mua'} tương ứng (${id}) — chép sẵn nội dung và SL, còn thiếu đơn giá`,'ok');
}

   TAB DỊCH VỤ — bảng tổng hợp + chi tiết một đoàn

function compName(c){ const x=DB.components.find(y=>y.code===c); return x?x.name:c; }
function linesOf(tour, side, party){
  const K = side==='sell' ? 'revenues' : 'services';
  return DB[K].filter(x=>x.g===tour && (!party||x.party===party));
}
function sumKind(arr){ const m={BG:0,PS:0,DC:0,HH:0,TOT:0};
  arr.forEach(x=>{ if(x.excluded) return; const v=Number(x.a)||0; m[x.kind]=(m[x.kind]||0)+v; m.TOT+=v; });
  return m; }
function guessCount(){ return [...DB.services,...DB.revenues].filter(x=>x.compGuess||x.kindGuess).length; }

function setSvc(id,f,v){
  push(); const s=DB[BK().lines].find(x=>x.id===id);
  const wasInSync = lineOk(s)===true;      // trước khi sửa, thành tiền có khớp công thức không
  if(['u','m','q','a'].includes(f)){ const x=num(v); if(f==='u'&&x===null&&v.trim()){ s.uTxt=v; s.u=null; } else { s[f]= (v===''?null:x); if(f==='u') s.uTxt=null; } }
  else s[f]=v;
  // Dòng nào đang khớp công thức thì sửa cấu phần sẽ tính lại thành tiền.
  // Dòng đã bị ghi đè thủ công (không khớp) thì giữ nguyên số đã book và tiếp tục gắn cờ lệch.
  let recalc=false;
  if(['u','m','q'].includes(f) && wasInSync){ const c=lineAmt(s); if(c!==null){ s.a=Math.round(c*100)/100; recalc=true; } }
  save(); render(); pill('Đã sửa dòng '+id+(recalc?' — thành tiền tính lại '+n2(s.a,0):''),'ok');
}

## Mô hình
ĐOÀN là trục nối. Mỗi đoàn có BA mã cho ba mục đích khác nhau:
· code     mã NỘI BỘ — khóa duy nhất của hệ, mọi bản ghi khác trỏ về đây
· codeCus  mã BÁO KHÁCH — xuất hiện trên báo giá, hợp đồng, hóa đơn cho khách
· codeSup  mã của NHÀ CUNG CẤP — xuất hiện trên bảng kê bên bán
Ba mã có thể khác nhau hoàn toàn. TUYỆT ĐỐI không dùng codeCus hay codeSup làm khóa nối; chỉ dùng chúng để nhận diện đoàn rồi quy về code nội bộ.

Một đoàn bán cho MỘT khách hàng (đại lý). Chi phí đoàn có thể đến từ NHIỀU nhà cung cấp (land tour, vé máy bay, visa tách riêng) — mỗi dòng chi phí phải ghi rõ thuộc nhà cung cấp nào.

## Ý nghĩa
PARTIES — đối tác. Hồ sơ đầy đủ gồm bốn khối: legal (pháp lý), terms (điều khoản tài chính), contacts (người liên hệ), banks (tài khoản ngân hàng). Chỉ điền phần nào đầu vào NÓI RÕ; không suy tên pháp lý từ tên gọi tắt, không đoán mã số thuế.
· terms.rateRule chỉ nhận: "actual" (theo tỷ giá thực nhận) · "fixed" (tỷ giá cố định đã chốt) · "invoice" (tỷ giá trên hóa đơn) · "bank" (tỷ giá ngân hàng ngày chuyển) · "" nếu chứng từ không nói.
· banks.def = true cho tài khoản mặc định. Thấy số tài khoản trên ủy nhiệm chi thì đưa vào đây và ghi vào recon.note để người dùng xác nhận có đúng tài khoản chính chủ không.
 kind = "sup" (nhà cung cấp) hoặc "cus" (khách hàng). short = nhãn ngắn ≤8 ký tự hiện trên đầu cột. ccy = tiền gốc đối soát ("RMB" cho NCC Trung Quốc, "VND" cho khách trong nước). open = dư đầu kỳ theo sổ ĐỐI TÁC, openOur = dư đầu kỳ theo sổ TA. Chỉ tạo party mới khi đầu vào nhắc tới một đối tác chưa có trong danh sách ở phần bối cảnh.

GROUPS — code = MÃ KHÁCH (khóa đoàn). Chưa có mã khách thì đặt mã tạm dễ nhận và ghi vào recon.note để người dùng đổi sau. status = "plan" chưa đi · "done" đã đi · "cancel" hủy. paxAdult / paxChild tách riêng người lớn và trẻ em.
date = ngày KHỞI HÀNH "YYYY-MM-DD", suy từ 8 chữ số trong mã đoàn nếu có. dateEnd = ngày đoàn VỀ, chỉ điền khi đầu vào nói rõ hoặc suy chắc chắn được từ số ngày tour (vd "tour 6 ngày 5 đêm" khởi hành 05/08 → dateEnd 10/08); không chắc thì null, KHÔNG đoán. air = mã hãng bay. pax = số khách. cus = code của khách hàng mua đoàn này.

COMPONENTS / TOURPARTS — cấu phần dịch vụ của đoàn: TOUR (land) · AIR (vé) · VISA · HOTEL · khai thêm nếu đầu vào nhắc tới loại khác. Mỗi tourParts nối (đoàn × cấu phần) với MỘT nhà cung cấp và mã đoàn phía nhà cung cấp đó. Mã đoàn của NCC nằm ở ĐÂY, không nằm trên groups.

BANK — SAO KÊ ngân hàng, là nguồn đúng. dir = "in" (tiền vào) hoặc "out" (tiền ra). amt = số nguyên tệ trên sao kê. vndReal = số VND thực trừ/nhận (chỉ điền cho giao dịch ngoại tệ, thấy trên chứng từ mới điền). Một giao dịch bank có thể được chia cho nhiều dòng payments/receipts qua trường "txn". Khoản cấn trừ qua bên thứ ba KHÔNG tạo bank — chúng không đi qua tài khoản.

BILLS — TỔNG một đoàn theo bảng kê của MỘT đối tác, tiền gốc của đối tác đó. Đây là "sổ bên kia", dùng để đối soát với tổng các dòng chi tiết bên ta. Không có thì bỏ qua, đừng tự cộng các dòng rồi ghi vào đây.

SERVICES — dòng chi phí theo sổ TA, gốc RMB. REVENUES — dòng doanh thu theo sổ TA, gốc VND. Hai khối cùng cấu trúc:
· g   mã đoàn NỘI BỘ · party mã đối tác của dòng đó
· d   nguyên văn nội dung, GIỮ NGUYÊN tiếng Trung/Việt/Anh, không dịch, không rút gọn
· u đơn giá · m hệ số nhân phụ (số ngày, số bữa), không có thì null · q số lượng
· a   THÀNH TIỀN đúng như bản gốc ghi, BẰNG NGUYÊN TỆ CỦA CHỨNG TỪ. Đây là số quyết định; u×m×q chỉ để kiểm tra chéo.
· ccy tiền tệ của chính dòng đó: "RMB" · "VND" · "USD". Không suy từ đối tác — đọc trên chứng từ.
· rate tỷ giá quy dòng đó về RMB (đơn vị cuối của hệ). RMB → 1. VND → bao nhiêu VND đổi 1 RMB (vd 3850). USD → 1 USD ra bao nhiêu RMB (vd 6.75).
      Chứng từ có ghi tỷ giá thì lấy đúng số đó. KHÔNG có thì để null — hệ sẽ báo "thiếu TG", đừng tự điền tỷ giá thị trường.
· comp MUA/BÁN CÁI GÌ: TOUR · AIR · VISA · HOTEL · OTHER (hoặc mã cấu phần đã khai)
· kind VÌ SAO SỐ NÀY KHÁC GIÁ ĐÃ BÁO — bốn nhóm, bắt buộc chọn đúng một:
     BG = giá trọn gói đã báo ban đầu
     PS = phát sinh dịch vụ thêm sau khi báo giá (phụ thu lễ, tip, phạt, dịch vụ gọi thêm)
     DC = điều chỉnh do thực tế (hoàn tiền, khách tự lo, giảm giá thỏa thuận, trả lại dịch vụ)
     HH = hoa hồng (玫瑰/rose NCC trả lại, hoa hồng trả cho đại lý)
· t   nhãn phụ tuỳ chọn, giữ tương thích cũ
· excluded true nếu dòng đó KHÔNG được cộng vào tổng ở bản gốc

PAYMENTS (tiền ra) / RECEIPTS (tiền vào) — cùng cấu trúc:
· amt số nguyên tệ theo ĐỐI TÁC ghi · amtTip theo TA ghi · rmbSup số tiền gốc ĐỐI TÁC thực ghi nhận
· rateSup/rateTip chỉ điền khi hai bên ĐÃ CHỐT tỷ giá bằng văn bản, còn lại null
· method "CK" · "TM" · "OFFSET" (cấn trừ qua bên thứ ba)
· vndOut  số VND THỰC TRỪ khỏi tài khoản theo ủy nhiệm chi (chỉ cho khoản chi ngoại tệ). Không thấy trên chứng từ thì null — hệ sẽ ước và đánh dấu.
· allocSup/allocTip mã đoàn mỗi bên cấn khoản tiền vào — hai bên cấn khác nhau là bình thường, ghi đúng từng bên
· pair mã cặp đối ứng khi một dòng tiền bị hai bên ghi thành số dòng khác nhau; không phải thì null
· flag null hoặc: missing_in_sup_total · missing_in_sup · missing_in_tip · date_suspect

## Quy tắc bắt buộc
1. KHÔNG BỊA SỐ. Thiếu thì null. Không nội suy, không làm tròn cho đẹp bảng, không điền số trung bình.
2. Không tự quy đổi ngoại tệ. Chỉ chép lại con số bản gốc ghi.
3. Giữ nguyên văn nội dung. Người dùng đối chiếu với chứng từ bằng chính chuỗi ký tự đó.
4. MỌI dòng services/revenues/payments/receipts đều PHẢI có "party", "comp" và "kind". Dòng services/revenues còn phải có "ccy". Không suy được thuộc đối tác nào thì để null và nêu trong recon.note.
5. Nhận diện đoàn qua bất kỳ mã nào trong ba mã, nhưng LUÔN ghi "g"/"tour" bằng mã NỘI BỘ. Nếu đầu vào chỉ có mã khách hoặc mã NCC mà bối cảnh chưa có đoàn tương ứng, tạo groups mới với code = mã bạn thấy và ghi vào recon.note rằng cần xác nhận mã nội bộ.
6. src = chỉ dẫn truy ngược (vd "Bảng kê NCC T7 dòng 12", "UNC 14/07", "Hợp đồng BG-2026-014").
7. Thấy bất thường (số sai dấu, ngày vô lý, dòng tổng không bằng tổng chi tiết, hai bên ghi lệch) thì ghi vào note của dòng đó mở đầu bằng "⚠ " và thêm một dòng vào recon.note. KHÔNG tự sửa số cho khớp.
8. id: services S… · revenues V… · payments P… · receipts R… · bills B… · bank TX… · tourParts TP… Tránh trùng id đã có ở phần bối cảnh.
9. Số dùng dấu chấm thập phân kiểu JSON (7116.42), không dùng dấu phân nhóm.
10. Mơ hồ đến mức không quy được về cấu trúc này thì trả {"error":"mô tả cái còn thiếu"} thay vì đoán.`;

function ctxBlock(){
  const g=DB.groups.map(x=>x.code);
  const sid=[...DB.services,...DB.revenues].map(x=>x.id), pid=[...DB.payments,...DB.receipts].map(x=>x.id);
  return `## Bối cảnh hồ sơ hiện tại (để không tạo trùng)
Bên mua: ${DB.meta.company} (${CO()}) · Đối tác đang nạp: ${(activeParty()||{}).name||'chưa chọn'} (${SU()}, ${PK()==='cus'?'khách hàng':'nhà cung cấp'}, mã ${UI.party})
Đối tác đã khai (${DB.parties.length}): ${DB.parties.map(p=>p.code+'='+p.name+(p.kind==='cus'?' [KH]':' [NCC]')).join(' · ')||'chưa có'}
Cấu phần đã khai: ${DB.components.map(c=>c.code+'='+c.name).join(' · ')}
Nhóm hợp lệ: BG=giá trọn gói đã báo · PS=phát sinh · DC=điều chỉnh thực tế · HH=hoa hồng
Đơn vị cuối của hệ: RMB. Tỷ giá đang dùng làm mặc định: VND/RMB ${n0(DB.policy.vndRate)} · USD/RMB ${DB.policy.usdFixed}
Kỳ đối soát: ${DB.policy.scopeFrom} → ${DB.policy.scopeTo} · Đơn vị gốc: RMB
Mã đoàn đã có (${g.length}): ${g.join(', ')||'chưa có'}
id services đã dùng: ${sid.length?sid[0]+'…'+sid[sid.length-1]+' ('+sid.length+' dòng)':'chưa có'}
id payments đã dùng: ${pid.join(', ')||'chưa có'}
Đoàn đã có mà thêm dòng dịch vụ/thanh toán mới → dùng đúng mã đoàn cũ, đừng tạo mã mới.`;
}
function buildPrompt(raw, src, side){
  return `${DATA_CONTRACT}

${ctxBlock()}

## Đầu vào lần này
Nguồn: ${src} — ghi nhận theo sổ ${side==='sup'?'BÊN BÁN':(side==='tip'?'BÊN MUA':'chưa rõ, tự suy từ nội dung')}
--- BẮT ĐẦU DỮ LIỆU THÔ ---
${raw}
--- HẾT DỮ LIỆU THÔ ---

Trả về JSON.`;
}


/* ============================================================
   CỔNG NẠP LIỆU AI — chuẩn hóa đầu vào thô theo DATA_CONTRACT
   Hai đường, cùng một prompt:
   (A) Thủ công: sinh prompt → dán sang Claude → dán JSON về. Không cần key, luôn chạy được.
   (B) Tự động: gọi thẳng API bằng key của người dùng lưu trong localStorage.
   Cả hai đều đi qua bước XEM TRƯỚC rồi mới ghi vào hồ sơ — không bao giờ merge mù.
   ============================================================ */
const LS_KEY_API = 'landtour_ap:__apikey';
let PENDING = null;

function apiKey(){ try{ return localStorage.getItem(LS_KEY_API)||''; }catch(e){ return ''; } }
function setApiKey(v){
  if(!v){ localStorage.removeItem(LS_KEY_API); pill('Đã xóa API key khỏi trình duyệt này','warn'); }
  else { localStorage.setItem(LS_KEY_API, v.trim()); pill('Đã lưu API key trong trình duyệt này','ok'); }
  render();
}
function gateInput(){
  return {raw:($('#airaw')||{}).value||'', src:($('#aisrc')||{}).value||'', side:($('#aiside')||{}).value||''};
}
function genPrompt(){
  const g=gateInput(); if(!g.raw.trim()){ pill('Chưa dán dữ liệu thô','warn'); return; }
  const p=buildPrompt(g.raw.trim(), g.src, g.side);
  const box=$('#aiprompt'); box.value=p; box.style.display='';
  $('#aipromptwrap').style.display='';
  navigator.clipboard?.writeText(p).then(
    ()=>pill('Đã sinh prompt và copy vào clipboard — dán sang Claude','ok'),
    ()=>pill('Đã sinh prompt — bấm Copy để chép','ok'));
}
function copyPrompt(){ const b=$('#aiprompt'); b.select(); navigator.clipboard?.writeText(b.value);
  pill('Đã copy prompt','ok'); }

async function aiNormalize(){
  const g=gateInput(); if(!g.raw.trim()){ pill('Chưa dán dữ liệu thô','warn'); return; }
  const key=apiKey(); if(!key){ pill('Chưa có API key — dùng đường thủ công hoặc nhập key','warn'); return; }
  const model=$('#aimodel').value;
  const btn=$('#aigo'); btn.disabled=true; btn.textContent='Đang chuẩn hóa…';
  logline('AI: gửi '+g.raw.trim().length+' ký tự · model '+model);
  try{
    const r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,
               'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model, max_tokens:8000,
        messages:[{role:'user',content:buildPrompt(g.raw.trim(),g.src,g.side)}]})
    });
    if(!r.ok){ const t=await r.text(); throw new Error(r.status+' '+t.slice(0,300)); }
    const d=await r.json();
    const txt=(d.content||[]).filter(x=>x.type==='text').map(x=>x.text).join('\n');
    logline('AI: nhận '+txt.length+' ký tự');
    stageJSON(txt);
  }catch(e){
    logline('AI LỖI: '+e.message);
    pill('Gọi API lỗi: '+e.message.slice(0,90),'err');
  }finally{ btn.disabled=false; btn.textContent='⚡ Chuẩn hóa tự động'; }
}
function stageFromPaste(){ const t=($('#aijson')||{}).value||''; if(!t.trim()){pill('Chưa dán JSON','warn');return;} stageJSON(t); }
function stageJSON(txt){
  let o;
  try{ o=JSON.parse(txt.replace(/```json|```/g,'').trim()); }
  catch(e){ pill('JSON không đọc được: '+e.message,'err'); logline('parse lỗi: '+e.message); return; }
  if(o.error){ pill('AI báo thiếu dữ liệu: '+o.error,'warn'); logline('AI error: '+o.error); return; }
  const KS=['parties','groups','bills','services','payments','revenues','receipts'];
  const diff={new:{}, over:{}, note:(o.recon&&o.recon.note)||''};
  KS.forEach(k=>{diff.new[k]=[];diff.over[k]=[];});
  [['parties','code'],['groups','code'],['bills','id'],['services','id'],['payments','id'],['revenues','id'],['receipts','id']].forEach(([k,key])=>{
    (o[k]||[]).forEach(it=>{
      if(!it[key]){ return; }
      (DB[k].some(x=>x[key]===it[key]) ? diff.over[k] : diff.new[k]).push(it);
    });
  });
  PENDING={obj:o, diff};
  render(); pill('Đã chuẩn hóa — kiểm tra bảng xem trước rồi mới nạp','ok');
}
/* Ngày của lô đang chờ nạp so với kỳ đối soát đang đặt. */
function pendingScope(){
  if(!PENDING) return {out:0};
  const o=PENDING.obj, ds=[];
  (o.groups||[]).forEach(g=>{ if(g.date) ds.push(g.date); });
  (o.payments||[]).forEach(p=>{ if(p.date) ds.push(p.date); });
  (o.receipts||[]).forEach(p=>{ if(p.date) ds.push(p.date); });
  const svcDates=[...(o.services||[]),...(o.revenues||[])].map(x=>{
    const g=(o.groups||[]).find(y=>y.code===x.g)||DB.groups.find(y=>y.code===x.g); return g&&g.date; }).filter(Boolean);
  ds.push(...svcDates);
  if(!ds.length) return {out:0};
  const min=ds.reduce((a,b)=>a<b?a:b), max=ds.reduce((a,b)=>a>b?a:b);
  const f=DB.policy.scopeFrom, t=DB.policy.scopeTo;
  const out=ds.filter(x=>(f&&x<f)||(t&&x>t)).length;
  return {out, min, max, newFrom:(min<f?min:f), newTo:(max>t?max:t)};
}
function extendScope(min,max){
  const f=(min<DB.policy.scopeFrom?min:DB.policy.scopeFrom), t=(max>DB.policy.scopeTo?max:DB.policy.scopeTo);
  push(); DB.policy.scopeFrom=f; DB.policy.scopeTo=t; save(); render();
  pill('Đã mở rộng kỳ đối soát: '+f+' → '+t,'ok');
}
function commitPending(){
  if(!PENDING) return;
  const d=PENDING.diff, o=PENDING.obj;
  const nNew=d.new.groups.length+d.new.services.length+d.new.payments.length;
  const nOver=d.over.groups.length+d.over.services.length+d.over.payments.length;
  const scPre=pendingScope();
  if(!confirm(`Nạp vào hồ sơ "${DB.meta.name}"?\n\n· Thêm mới ${nNew} bản ghi\n· Ghi đè ${nOver} bản ghi đã có (giá trị cũ bị thay)\n${d.note?'· Thêm '+d.note.split('\n').filter(Boolean).length+' dòng vào "điểm phải nêu khi ký biên bản"\n':''}${scPre.out?'· ⚠ '+scPre.out+' bản ghi nằm ngoài kỳ đối soát hiện tại, sẽ không vào số chốt cho tới khi bạn mở rộng kỳ\n':''}\nSố dư đối soát sẽ thay đổi. Có thể hoàn tác bằng nút Undo.`)) return;
  push();
  ['parties','groups','bills','services','payments','revenues','receipts'].forEach(k=>{
    const key = (k==='groups'||k==='parties')?'code':'id';
    (o[k]||[]).forEach(it=>{ if(!it[key]) return;
      const i=DB[k].findIndex(x=>x[key]===it[key]);
      if(i>=0) DB[k][i]={...DB[k][i],...it}; else DB[k].push(it); });
  });
  if(d.note) DB.recon.note=(DB.recon.note?DB.recon.note+'\n':'')+d.note;
  DB.groups.sort((x,y)=>((x.date||'')+x.code).localeCompare((y.date||'')+y.code));
  DB=normalize(DB); const outN=scPre.out||0; PENDING=null; save(); render();
  if(outN){ pill(`Đã nạp ${nNew} mới, ${nOver} ghi đè — nhưng ${outN} bản ghi NGOÀI kỳ ${DB.policy.scopeFrom}→${DB.policy.scopeTo} nên chưa vào số chốt`,'warn');
            logline(`merge +${nNew} ~${nOver} · ${outN} ngoài kỳ`); }
  else { pill(`Đã nạp: ${nNew} mới, ${nOver} ghi đè`,'ok'); logline(`merge +${nNew} ~${nOver}`); }
}
function dropPending(){ PENDING=null; render(); pill('Đã bỏ bản chuẩn hóa','warn'); }

function pendingHTML(){
  if(!PENDING) return '';
  const d=PENDING.diff, KS=Object.keys(d.new);
  const LBL={parties:'Đối tác',groups:'Đoàn',bills:'Bảng kê đối tác',services:'Chi phí',
             payments:'Chi tiền',revenues:'Doanh thu',receipts:'Thu tiền'};
  const desc=(k,x)=>{
    if(k==='parties') return `${x.kind==='cus'?'Khách hàng':'NCC'} · ${x.name||''}`;
    if(k==='groups')  return `${x.date||'?'} · KH ${x.codeCus||'—'} · NCC ${x.codeSup||'—'} · ${x.pax||'?'} pax`;
    if(k==='bills')   return `đoàn ${x.tour} · ${x.party} · tổng ${x.total!==null&&x.total!==undefined?n2(x.total,0):'—'}`;
    if(k==='services'||k==='revenues') return `${x.g} · ${(x.d||'').slice(0,40)} · ${x.a!==null&&x.a!==undefined?n2(x.a,0):'—'}`;
    return `${x.date||'?'} · ${x.ccy} ${n2(x.amt??x.amtTip, x.ccy==='VND'?0:2)} · đối tác ghi ${x.rmbSup!==null&&x.rmbSup!==undefined?n2(x.rmbSup,0):'—'}`;
  };
  const sc=pendingScope();
  let body='', nNew=0, nOver=0;
  KS.forEach(k=>{
    nNew+=d.new[k].length; nOver+=d.over[k].length;
    [['Thêm mới',d.new[k],'ok'],['Ghi đè',d.over[k],'warn']].forEach(([t,arr,c])=>{
      body+=arr.map(x=>`<tr><td><span class="chip ${c}">${t}</span></td><td class="tiny">${LBL[k]||k}</td>
        <td class="mono" style="font-size:11px">${esc(x.code||x.id||'')}</td>
        <td class="tiny">${esc(desc(k,x))}</td>
        <td class="tiny">${x.flag?`<span class="chip err">${FLAG[x.flag]||x.flag}</span> `:''}${esc(x.note||'')}</td></tr>`).join('');

const SLICES=[['tour','Theo đoàn'],['cus','Theo khách hàng'],['sup','Theo nhà cung cấp'],
              ['comp','Theo loại dịch vụ'],['month','Theo tháng']];
function paidTo(partyCode, tour){
  /* tiền đã trả/thu cho một đối tác, lọc theo đoàn nếu có */
  const K=DB.parties.find(p=>p.code===partyCode)?.kind==='cus'?'receipts':'payments';
  const keep=UI.party; UI.party=partyCode;
  const v=DB[K].filter(m=>m.party===partyCode && inScope(m.date) && (!tour||m.allocTip===tour||m.allocSup===tour))
    .reduce((a,m)=>a+(payVal(m).rmbTip||0),0);
  UI.party=keep; return v;
}

/* ============================================================
   TAB SỔ NGÂN HÀNG — sao kê là nguồn đúng, phân bổ là lớp diễn giải
   ============================================================ */
function allocOf(txnId){
  return [...DB.payments.map(x=>({...x,_k:'payments'})), ...DB.receipts.map(x=>({...x,_k:'receipts'}))]
    .filter(x=>x.txn===txnId);
}
function allocSum(txnId){ return allocOf(txnId).reduce((a,x)=>a+(Number(x.amtTip)||0),0); }
function txnState(t){
  const a=allocSum(t.id), d=Number(t.amt)-a;
  if(Math.abs(d)<0.005) return {st:'ok', rest:0, alloc:a};
  if(Math.abs(a)<0.005) return {st:'none', rest:d, alloc:a};
  return {st:'part', rest:d, alloc:a};
}
function viewBank(){

     <div class="mono ${DB.bank.filter(t=>inScope(t.date)&&!allocOf(t.id).length).length?'neg':''}" style="font-size:19px">${DB.bank.filter(t=>inScope(t.date)&&!allocOf(t.id).length).length}</div>

     <div class="tiny">cộng gộp nguyên tệ — xem chi tiết từng dòng</div></div></div>`;
  h+=`<div class="sect"><h3>Sao kê</h3><span class="d">Bấm một dòng để xem/sửa phân bổ</span>
     <span style="flex:1"></span><button class="btn sm" onclick="addTxn()">+ Giao dịch</button></div>`;
  h+=`<div class="wrap"><table><thead><tr><th style="width:74px">ID</th><th style="width:98px">Ngày</th>

  rows.forEach(t=>{

    const fa=UI.fAlloc||'all';
    const aOK = fa==='all' || (fa==='none'&&!al.length) || (fa==='part'&&S.st==='part')
      || (fa==='ok'&&S.st==='ok') || (fa==='notour'&&al.length&&al.some(a=>!a.allocSup&&!a.allocTip));
    const ok=(!UI.fDir||UI.fDir==='all'||UI.fDir===t.dir) && aOK
      && (matches(t.id)||matches(t.desc||'')||matches(t.ref||'')||al.some(a=>matches(a.allocSup||'')));
    if(!keep(ok)) return;
    const cls=S.st==='ok'?'st-ok':(S.st==='part'?'st-diff':'st-miss');
    h+=`<tr class="led ${rowCls(ok)}"><td class="mono tiny">${t.id}</td>
      <td><input class="cellin mono" type="date" style="font-size:11px" value="${t.date||''}" onchange="setTxn('${t.id}','date',this.value)"></td>
      <td><select class="cellin" style="font-size:10.5px" onchange="setTxn('${t.id}','dir',this.value)">
