        <option value="in"${t.dir==='in'?' selected':''}>Thu</option></select></td>
      <td class="mono">${t.ccy}</td>
      <td><input class="cellin num mono" style="font-size:11px" value="${t.amt??''}" onchange="setTxn('${t.id}','amt',this.value)"></td>
      <td>${t.ccy==='VND'?'<span class="tiny mut">—</span>':`<input class="cellin num mono" style="font-size:11px" value="${t.vndReal??''}" placeholder="—"
        title="Số VND thực trừ/nhận trên sao kê. Có nó thì giá vốn quy VND là số thật." onchange="setTxn('${t.id}','vndReal',this.value)">`}</td>
      <td class="num">${n2(S.alloc,0)}</td>
      <td class="num ${S.rest?'neg':''}">${S.rest?n2(S.rest,0):''}</td>
      ${objCells(t,S,al)}
      <td><span class="chip ${S.st==='ok'?'ok':(S.st==='part'?'warn':'err')}">${S.st==='ok'?'đã phân bổ đủ':(S.st==='part'?'dở dang':'CHƯA phân bổ')}</span></td>
      <td class="tiny"><input class="cellin" style="font-size:11px" value="${esc(t.desc||'')}" onchange="setTxn('${t.id}','desc',this.value)">
        ${al.map(a=>`<span class="chip ${a._k==='receipts'?'ok':''}" title="${esc(a.id)}">${esc(pShort(a.party))} · ${esc(a.allocSup||a.allocTip||'chưa gán đoàn')} · ${n2(a.amtTip,0)}
          <a href="#" onclick="delAlloc('${a._k}','${a.id}');return false" style="color:var(--neg)">✕</a></span>`).join(' ')}
        ${S.rest?`<button class="btn sm" style="margin-left:4px" onclick="addAlloc('${t.id}')">+ phân bổ ${n2(S.rest,0)}</button>`:''}
        ${(()=>{const p=al[0]&&DB.parties.find(x=>x.code===al[0].party);
          if(!p) return ''; if(!p.banks.length) return `<span class="chip warn" title="Hồ sơ ${esc(p.name)} chưa khai tài khoản ngân hàng nào để đối chiếu">chưa có TK trong hồ sơ</span>`;
          const bk=p.banks.find(b=>b.def)||p.banks[0];
          return `<span class="chip" title="Tài khoản đã khai: ${esc(bk.bank)} · ${esc(bk.accNo)}">TK ${esc(bk.accNo||bk.bank)}</span>`;})()}</td>
      <td><span class="rowbtns"><button class="btn sm danger" onclick="delTxn('${t.id}')">✕</button></span></td></tr>`;
  });
  h+=`</tbody></table></div>`;
  h+=`<div class="tiny" style="margin-top:6px">Giao dịch cấn trừ qua bên thứ ba và khoản chỉ có đối tác ghi nhận <b>không nằm ở đây</b> — chúng chưa từng đi qua tài khoản.
   Xem chúng ở tab Đối soát mục B.</div>`;
  h+=`<div class="sect"><h3>Dòng phân bổ — ${esc(SU())}</h3>
     <span class="d">Đây là lớp đối soát với đối tác: tỷ giá, số họ ghi có, cấn vào đoàn nào</span></div>`;
  h+=viewPayments(true);
  return h;
}
/* Gán nhanh đối tượng ngay trên dòng sao kê. Chiều tiền quyết định danh sách hiện ra:
   chi → nhà cung cấp · thu → khách hàng. Giao dịch đã tách nhiều dòng thì khoá ô này,
   vì gán một đối tượng cho cả giao dịch sẽ ghi đè mất phần đã tách. */
/* Tiền chảy hai chiều với CẢ HAI loại đối tác: NCC hoàn tiền là tiền vào từ NCC,
   trả lại khách là tiền ra cho KH. Lọc danh sách theo chiều tiền sẽ giấu mất đối tác hợp lệ,
   nên hiện tất cả — chỉ xếp nhóm thuận chiều lên trước. */
function partyOpts(t, cur){
  const nat = t.dir==='in' ? 'cus' : 'sup';
  const grp=k=>{ const ps=DB.parties.filter(p=>p.kind===k); if(!ps.length) return '';
    const rev = k!==nat;
    return `<optgroup label="${k==='sup'?'Nhà cung cấp':'Khách hàng'}${rev?' — ngược chiều (hoàn/trả lại)':''}">`
      + ps.map(p=>`<option value="${esc(p.code)}"${cur===p.code?' selected':''}>${esc(pLabel(p))}</option>`).join('')
      + '</optgroup>'; };
  return grp(nat)+grp(nat==='sup'?'cus':'sup');
}
function objCells(t,S,al){
  const tours=DB.groups.filter(gScope);
  if(al.length>1) return `<td class="tiny"><span class="chip info">tách ${al.length} dòng</span></td>
    <td class="tiny">${al.map(a=>esc(a.allocSup||'—')).join(', ')}</td>`;
  const a=al[0];
  const rev = a && (()=>{const p=DB.parties.find(x=>x.code===a.party); return p && p.kind!==(t.dir==='in'?'cus':'sup');})();
  return `<td><select class="cellin" style="font-size:10.5px${a?'':';background:var(--neg-soft)'}"
      onchange="setTxnObj('${t.id}','party',this.value)">
      <option value="">— chưa gán —</option>${partyOpts(t, a&&a.party)}
    </select>${DB.parties.length?'':'<div class="tiny neg">chưa khai đối tác nào</div>'}
    ${rev?'<div class="tiny"><span class="chip warn" title="Đối tác ngược chiều: khoản này ghi âm trên sổ của họ">ngược chiều</span></div>':''}</td>
    <td><select class="cellin" style="font-size:10.5px" ${a?'':'disabled'} onchange="setTxnObj('${t.id}','tour',this.value)">
      <option value="">— chưa gán đoàn —</option>
      ${tours.map(g=>`<option value="${esc(g.code)}"${a&&a.allocSup===g.code?' selected':''}>${esc(g.code)}</option>`).join('')}
    </select></td>`;
}
/* Sổ chứa quyết định bởi LOẠI đối tác (NCC→payments · KH→receipts).
   Dấu quyết định bởi chiều tiền so với chiều "thuận" của loại đó:
   chi cho NCC và thu của KH là dương; hoàn từ NCC và trả lại KH là âm. */
function allocTarget(partyCode, dir){
  const p=DB.parties.find(x=>x.code===partyCode);
  const kind=(p&&p.kind)||'sup';
  const K = kind==='cus' ? 'receipts' : 'payments';
  const natural = kind==='cus' ? 'in' : 'out';
  return {K, sign: dir===natural ? 1 : -1, kind};
}
function setTxnObj(txnId,f,v){
  const t=DB.bank.find(x=>x.id===txnId); if(!t) return;
  const al=allocOf(txnId);
  if(al.length>1){ pill('Giao dịch đã tách nhiều dòng — sửa từng dòng ở bảng phân bổ bên dưới','warn'); return; }
  if(!al.length){
    if(f!=='party'||!v){ pill('Chọn đối tượng trước rồi mới gán đoàn','warn'); return; }
    push();
    const T=allocTarget(v,t.dir);
    const id=(T.K==='receipts'?'R':'P')+Date.now().toString(36).toUpperCase().slice(-5);
    DB[T.K].push({id, party:v, txn:t.id, date:t.date, ccy:t.ccy, amt:null, method:'CK',
      rmbSup:null, rateSup:null, vndOut:(t.vndReal??null), allocSup:null,
      amtTip:(Number(t.amt)||0)*T.sign, rateTip:null, allocTip:null, pair:null,
      note:'Gán từ sao kê '+t.id+(T.sign<0?' (ngược chiều)':''), src:t.src||'', flag:null});
    save(); render();
    pill(`Đã gán ${n2((Number(t.amt)||0)*T.sign,0)} ${t.ccy} cho ${pShort(v)}${T.sign<0?' — ngược chiều nên ghi âm':''} — nhớ chọn đoàn`,'ok');
    return;
  }
  push();
  const a=al[0], K=a._k, x=DB[K].find(y=>y.id===a.id);
  if(f==='party'){
    if(!v){ DB[K]=DB[K].filter(y=>y.id!==a.id); save(); render(); pill('Đã gỡ gán đối tượng','warn'); return; }
    const T=allocTarget(v,t.dir);
    x.party=v;
    x.amtTip=Math.abs(Number(x.amtTip)||Number(t.amt)||0)*T.sign;
    if(T.K!==K){ DB[K]=DB[K].filter(y=>y.id!==a.id);
      const nid=(T.K==='receipts'?'R':'P')+String(x.id).slice(1);
      DB[T.K].push({...x, id:nid, rmbSup:null, rateSup:null});
      save(); render();
      pill(`Chuyển ${a.id} sang sổ ${T.K==='receipts'?'thu tiền':'chi tiền'} → ${nid} · số đối tác ghi có đã xóa để nhập lại`,'warn');
      return; }
  } else { x.allocSup=v||null; x.allocTip=v||null; }
  save(); render(); pill('Đã gán '+(f==='party'?pShort(v):(v||'bỏ gán đoàn')),'ok');
}
function setTxn(id,f,v){ push(); const t=DB.bank.find(x=>x.id===id);
  t[f]=(f==='date'||f==='desc'||f==='ref'||f==='note'||f==='dir')?v:(v===''?null:num(v));
  if(f==='dir'){ allocOf(id).forEach(a=>{ const T=allocTarget(a.party,v);
      const x=DB[a._k].find(y=>y.id===a.id); if(x) x.amtTip=Math.abs(Number(x.amtTip)||0)*T.sign; }); }
  /* VND thực trên sao kê là nguồn đúng → đẩy xuống các dòng phân bổ để giá vốn dùng số thật */
  if(f==='vndReal'){ const al=allocOf(id), tot=allocSum(id);
    al.forEach(a=>{ const arr=DB[a._k], x=arr.find(y=>y.id===a.id);
      x.vndOut = (t.vndReal===null||!tot)?null:t.vndReal*(Number(x.amtTip)||0)/tot; }); }
  save(); render(); pill('Đã sửa '+id,'ok'); }
function addTxn(){
  push(); const id='TX'+Date.now().toString(36).toUpperCase().slice(-5);
  DB.bank.push({id, date:new Date().toISOString().slice(0,10), account:(DB.accounts[0]||{}).code||'ACC1',
    dir:'out', ccy:BASE(), amt:null, vndReal:null, ref:'', desc:'', note:'', src:'nhập tay'});
  save(); render(); pill('Đã thêm giao dịch '+id+' — nhớ phân bổ cho đối tác và đoàn','warn');
}
function delTxn(id){
  const t=DB.bank.find(x=>x.id===id), al=allocOf(id);
  if(!confirm(`Xóa giao dịch ${id} (${t.ccy} ${n2(t.amt,0)})?\n\n${al.length?al.length+' dòng phân bổ gắn với nó SẼ BỊ XÓA THEO — số đối soát và lãi lỗ đổi theo.':'Chưa có dòng phân bổ nào.'}\nCó thể Undo.`)) return;
  push(); al.forEach(a=>{ DB[a._k]=DB[a._k].filter(y=>y.id!==a.id); });
  DB.bank=DB.bank.filter(x=>x.id!==id); save(); render(); pill('Đã xóa '+id,'warn');
}
function addAlloc(txnId){
  const t=DB.bank.find(x=>x.id===txnId); if(!t) return;
  const S=txnState(t);
  const nat = t.dir==='in' ? 'cus' : 'sup';
  const ps=[...DB.parties.filter(p=>p.kind===nat), ...DB.parties.filter(p=>p.kind!==nat)];
  if(!ps.length){ pill('Chưa khai đối tác nào','err'); return; }
  const pi=prompt(`Phân bổ ${t.ccy} ${n2(S.rest,0)} cho đối tác nào?\n`
    +ps.map((p,i)=>` ${i+1}. ${pLabel(p)} [${p.kind==='sup'?'NCC':'KH'}]${p.kind!==nat?' — ngược chiều':''}`).join('\n'),'1');
  if(pi===null) return; const pt=ps[parseInt(pi,10)-1];
  if(!pt){ pill('Không nhận ra đối tác','err'); return; }
  const tours=DB.groups.filter(gScope).map(g=>g.code);
  const tc=prompt('Cấn vào đoàn nào? (gõ mã đoàn, để trống = chưa gán)\n\nĐoàn trong kỳ: '+tours.slice(0,12).join(', ')+(tours.length>12?' …':''),'');
  if(tc===null) return;
  const am=prompt('Số tiền phân bổ ('+t.ccy+'):', String(S.rest));
  if(am===null) return; const a=num(am); if(!a){ pill('Số tiền không hợp lệ','err'); return; }
  push();
  const T=allocTarget(pt.code,t.dir);
  const id=(T.K==='receipts'?'R':'P')+Date.now().toString(36).toUpperCase().slice(-5);
  DB[T.K].push({id, party:pt.code, txn:t.id, date:t.date, ccy:t.ccy, amt:null, method:'CK',
    rmbSup:null, rateSup:null, vndOut:null, allocSup:tc.trim()||null,
    amtTip:Math.abs(a)*T.sign, rateTip:null, allocTip:tc.trim()||null, pair:null,
    note:'Phân bổ từ '+t.id, src:t.src||'', flag:null});
  save(); render();
  pill(`Đã phân bổ ${n2(a,0)} ${t.ccy} cho ${pt.short}${tc?' · đoàn '+tc:''} — nhớ điền số đối tác ghi có ở bảng dưới`,'ok');
}
function delAlloc(K,id){
  const x=DB[K].find(y=>y.id===id); if(!x) return;
  if(!confirm(`Gỡ dòng phân bổ ${id} (${n2(x.amtTip,0)} ${x.ccy})?\n\nGiao dịch ngân hàng vẫn còn, chỉ quay lại trạng thái chưa phân bổ. Số đối soát với ${pShort(x.party)} sẽ đổi. Có thể Undo.`)) return;
  push(); DB[K]=DB[K].filter(y=>y.id!==id); save(); render(); pill('Đã gỡ phân bổ','warn');
}



/* ============================================================
   TAB ĐỐI TÁC — hồ sơ pháp lý · liên hệ · điều khoản · tài khoản
   Hai trường nối thẳng vào vận hành: creditLimit (cảnh báo vượt hạn mức ở sổ số dư)
   và rateRule (cơ chế ghi có ngoại tệ — nguồn gốc của mọi tranh chấp tỷ giá).
   ============================================================ */
const RATE_RULES={'':'— chưa thỏa thuận —', actual:'Theo tỷ giá thực nhận', fixed:'Theo tỷ giá cố định đã chốt',
                  invoice:'Theo tỷ giá ghi trên hóa đơn', bank:'Theo tỷ giá ngân hàng ngày chuyển'};
function partyBal(p){ return withParty(p.code, ()=>ledger('tip').end); }
function overLimit(p){ if(!p) return null; const L=Number(p.terms&&p.terms.creditLimit)||0;
  if(!L) return null; const b=partyBal(p); return {limit:L, bal:b, pct:b/L, over:b>L}; }

function viewParties(){
  const sel=DB.parties.find(p=>p.code===UI.selParty);
  let h=`<div class="hint">Hồ sơ đối tác là gốc của mọi thứ khác: đoàn trỏ về khách hàng, cấu phần trỏ về nhà cung cấp,
   dòng tiền trỏ về cả hai. Hai trường có tác dụng ngay: <b>hạn mức công nợ</b> bật cảnh báo ở sổ số dư,
   <b>cơ chế ghi có ngoại tệ</b> là điều khoản phải chốt bằng văn bản — chưa chốt thì mọi chênh tỷ giá đều thành tranh chấp.</div>`;
  h+=`<div class="sect" style="margin-top:0"><h3>Danh mục đối tác</h3>
     <span class="d">${DB.parties.filter(p=>p.kind==='sup').length} nhà cung cấp · ${DB.parties.filter(p=>p.kind==='cus').length} khách hàng</span>
     ${DB.parties.filter(p=>looksLikeKind(p.short)).length?`<span class="chip err">${DB.parties.filter(p=>looksLikeKind(p.short)).length} nhãn ngắn đang bị điền bằng loại đối tác</span>`:''}
     <span style="flex:1"></span>
     <button class="btn sm" onclick="addParty('sup')">+ Nhà cung cấp</button>
     <button class="btn sm" onclick="addParty('cus')">+ Khách hàng</button></div>`;
  h+=`<div class="wrap" style="max-height:none"><table><thead><tr>
    <th style="width:80px">Mã</th><th style="width:190px">Tên</th><th style="width:56px">Loại</th>
    <th style="width:44px">Tệ</th><th style="width:150px">Tên pháp lý / MST</th>
    <th style="width:130px">Liên hệ chính</th><th style="width:150px">Cơ chế ghi có TG</th>
    <th class="num" style="width:110px">Hạn mức</th><th class="num" style="width:110px">Dư hiện tại</th>
    <th style="width:110px">Mức dùng</th><th class="num" style="width:50px">TK</th><th style="width:26px"></th></tr></thead><tbody>`;
  DB.parties.forEach(p=>{
    const L0=overLimit(p), iss=UI.fPartyIssue||'all';
    const issOK = iss==='all' || (iss==='norule'&&!p.terms.rateRule) || (iss==='nobank'&&!p.banks.length)
      || (iss==='nocontact'&&!p.contacts.length) || (iss==='over'&&L0&&L0.over);
    const ok=(UI.fPartyKind==='all'||!UI.fPartyKind||UI.fPartyKind===p.kind) && issOK
      && (matches(p.name)||matches(p.code)||matches((p.legal||{}).taxCode||'')||matches((p.legal||{}).fullName||''));
    if(!keep(ok)) return;
    const L=overLimit(p), c0=(p.contacts||[])[0];
    h+=`<tr class="${rowCls(ok)} ${UI.selParty===p.code?'sel':''}" onclick="selSet('party','${esc(p.code)}')">
      <td class="mono tiny">${esc(p.code)}<div><span class="chip ${looksLikeKind(p.short)?'err':''}"
        title="${looksLikeKind(p.short)?'Nhãn ngắn đang bị điền bằng LOẠI đối tác — nên đặt thành tên viết tắt':''}">${esc(p.short)}</span></div></td>
      <td><b>${esc(p.name)}</b></td>
      <td><select class="cellin" style="font-size:10.5px" ${partyRefs(p.code)?'disabled title="Đã có dữ liệu — không đổi loại được"':''}
        onclick="event.stopPropagation()" onchange="setKind('${esc(p.code)}',this.value)">
        <option value="sup"${p.kind==='sup'?' selected':''}>NCC</option>
        <option value="cus"${p.kind==='cus'?' selected':''}>KH</option></select></td>
      <td class="mono tiny">${esc(p.ccy)}</td>
      <td class="tiny">${esc((p.legal||{}).fullName||'—')}${(p.legal||{}).taxCode?'<div class="mono" style="font-size:10px">MST '+esc(p.legal.taxCode)+'</div>':''}</td>
      <td class="tiny">${c0?esc(c0.name||'')+(c0.phone?'<div class="mono" style="font-size:10px">'+esc(c0.phone)+'</div>':''):'<span class="chip err">chưa có</span>'}</td>
      <td class="tiny">${(p.terms||{}).rateRule?`<span class="chip ok">${esc(RATE_RULES[p.terms.rateRule]||'')}</span>`:'<span class="chip err">chưa thỏa thuận</span>'}</td>

      <td class="tiny">${L?`<div style="background:#eef1ef;border-radius:3px;height:9px;position:relative;overflow:hidden">
          <i style="position:absolute;left:0;top:0;bottom:0;width:${Math.min(100,Math.max(0,L.pct*100))}%;background:${L.over?'var(--neg)':'var(--accent)'}"></i></div>
          <span class="${L.over?'neg':''}">${n2(L.pct*100,0)}%${L.over?' VƯỢT':''}</span>`:'—'}</td>
      <td class="num tiny">${(p.banks||[]).length||'<span class="chip err">0</span>'}</td>

  });
  h+='</tbody></table></div>';
  if(!DB.parties.length) h+=`<div class="card tiny">Chưa có đối tác nào. Bấm “+ Đối tác”, hoặc để cổng nạp liệu AI tự tạo khi đọc chứng từ.</div>`;
  if(sel) h+=partyDetail(sel);
  else if(DB.parties.length) h+=`<div class="tiny" style="margin-top:8px">Bấm một dòng để mở hồ sơ đầy đủ.</div>`;
  return h;
}
const KIND_LBL={sup:'NCC — Nhà cung cấp', cus:'KH — Khách hàng'};
/* Đếm mọi thứ đang trỏ về đối tác. Đổi loại NCC↔KH là đổi cả sổ chứa dữ liệu
   (chi phí nằm ở services, doanh thu nằm ở revenues) nên chỉ cho đổi khi hồ sơ còn trống. */
function partyRefs(code){
  return ['services','revenues','payments','receipts','bills','tourParts'].reduce((a,k)=>a+DB[k].filter(x=>x.party===code).length,0)
       + DB.groups.filter(g=>g.cus===code).length;
}
function setKind(code,v){
  const p=DB.parties.find(x=>x.code===code); if(!p||p.kind===v) return;
  const n=partyRefs(code);
  if(n){ alert(`Không đổi được loại của ${p.name}: còn ${n} bản ghi đang trỏ về đối tác này.\n\n`
    +`NCC và KH dùng hai sổ khác nhau (chi phí ↔ doanh thu), đổi loại giữa chừng sẽ làm mồ côi toàn bộ số liệu.\n`
    +`Muốn đổi thì xóa hoặc chuyển các bản ghi đó sang đối tác khác trước.`); render(); return; }
  push(); p.kind=v; p.ccy=(v==='sup'?'RMB':'VND'); save(); render();
  pill(`${p.name} → ${KIND_LBL[v]}`,'ok');
}
function looksLikeKind(v){ return /^(ncc|kh|nha cung cap|khach hang|sup|cus)$/i.test((v||'').trim()); }
function pf(code,grp,f,v){ push(); const p=DB.parties.find(x=>x.code===code);
  const val=(f==='creditLimit'||f==='creditDays')?(v===''?null:num(v)):v;
  if(grp) p[grp][f]=val; else p[f]=val;
  save(); render(); pill('Đã cập nhật hồ sơ '+p.short,'ok'); }

function setSub(code,arr,i,f,v){ push(); const p=DB.parties.find(x=>x.code===code);
  if(f==='def'&&v) p[arr].forEach(x=>x.def=false);
  p[arr][i][f]=v; save(); render(); }
function addSub(code,arr){ push(); const p=DB.parties.find(x=>x.code===code);
  p[arr].push(arr==='banks'?{bank:'',branch:'',accName:p.legal.fullName||p.name,accNo:'',swift:'',ccy:p.ccy,def:!p.banks.length,note:''}
                           :{name:'',role:'',phone:'',email:'',im:'',note:''});
  save(); render(); }
function delSub(code,arr,i){ const p=DB.parties.find(x=>x.code===code);
  const lbl=arr==='banks'?('tài khoản '+(p.banks[i].accNo||'')):('liên hệ '+(p.contacts[i].name||''));
  if(!confirm('Xóa '+lbl+' khỏi hồ sơ '+p.name+'?\n\nChỉ xóa thông tin hồ sơ, không ảnh hưởng số liệu đối soát. Có thể Undo.')) return;
  push(); p[arr].splice(i,1); save(); render(); pill('Đã xóa','warn'); }
function delParty(code){
  const p=DB.parties.find(x=>x.code===code);
  const n=['services','revenues','payments','receipts','bills','tourParts'].reduce((a,k)=>a+DB[k].filter(x=>x.party===code).length,0)
        + DB.groups.filter(g=>g.cus===code).length;
  if(n){ alert(`Không xóa được ${p.name}: còn ${n} bản ghi đang trỏ về đối tác này.\n\nXóa hoặc chuyển các bản ghi đó sang đối tác khác trước.`); return; }
  if(!confirm(`Xóa đối tác ${p.name}?\n\nChưa có bản ghi nào trỏ về đối tác này nên không ảnh hưởng số liệu. Có thể Undo.`)) return;
  push(); DB.parties=DB.parties.filter(x=>x.code!==code);
  if(UI.party===code) UI.party=(DB.parties[0]||{}).code||null;
  if(UI.selParty===code) UI.selParty=null;
  save(); render(); pill('Đã xóa đối tác','warn'); }

/* ============================================================
   SỐ DƯ THEO ĐỐI TÁC — dùng chung cho NCC và KH, khác nhau ở kind
   ============================================================ */
function withParty(code, fn){ const k=UI.party; UI.party=code; try{ return fn(); } finally{ UI.party=k; } }
function partyRow(p){
  return withParty(p.code, ()=>{
    const A=agg(), Ls=ledger('sup'), Lt=ledger('tip'), B=bridge();
    /* Cột phát sinh / đã thanh toán lấy theo SỔ TA — đó là số ta luôn có.
       Sổ đối tác chỉ dùng ở hai cột dư cuối để so; với khách hàng thường chưa có sổ họ. */
    const cost=A.costTipS, cred=A.credTip;
    return {p, open:A.openSup, openOur:(Number(p.openOur)||0), cost, cred,
            endThem:Ls.end, endOurs:Lt.end, gap:Ls.end-Lt.end,
            nOk:Ls.nOk, nDiff:Ls.nDiff, nMiss:Ls.nMiss, bridgeOk:Math.abs(B.total-A.balSup)<0.05};
  });
}
function toVnd(p, v){ const R=Number(DB.policy.vndRate)||3850;
  return (p.ccy==='VND')? v : v*R; }

function viewBalance(kind){
  const ps=DB.parties.filter(x=>x.kind===kind);
  const label = kind==='sup' ? 'nhà cung cấp' : 'khách hàng';
  const mode = kind==='sup' ? (UI.balSup||'ALL') : (UI.balCus||'ALL');
  const setter = kind==='sup' ? 'balSup' : 'balCus';
  let h='';
  if(!ps.length) return `<div class="card"><h4>Chưa khai ${label} nào</h4>
    <div class="tiny">Thêm ở panel trái, hoặc để cổng nạp liệu AI tự tạo khi đọc chứng từ.</div></div>`;

  h+=`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
    <div class="seg"><button class="${mode==='ALL'?'on':''}" onclick="setBal('${setter}','ALL')">Tổng hợp ${ps.length} ${label}</button>
    ${ps.map(p=>`<button class="${mode===p.code?'on':''}" onclick="setBal('${setter}','${esc(p.code)}')">${esc(p.short)}</button>`).join('')}</div>
    <span class="tiny">Kỳ ${DB.policy.scopeFrom} → ${DB.policy.scopeTo} · mốc ${DB.policy.scopeBasis==='end'?'ngày về':'ngày đi'}</span></div>`;

  if(mode==='ALL'){
    const rows=ps.map(partyRow);
    const tO=rows.reduce((a,r)=>a+toVnd(r.p,r.endOurs),0);
    const tV=rows.reduce((a,r)=>a+toVnd(r.p,r.endThem),0);
    h+=`<div class="hint">Tổng hợp công nợ ${label}. Mỗi dòng là một sổ đối soát độc lập — bấm vào để mở sổ chi tiết hai cột.
      Cột <b>quy VND</b> dùng tỷ giá chính sách ${n0(DB.policy.vndRate)} để cộng được các đối tác khác loại tiền; con số đàm phán lấy ở cột tiền gốc.</div>`;
    h+=`<div class="wrap" style="max-height:none"><table><thead><tr><th style="width:180px">${kind==='sup'?'Nhà cung cấp':'Khách hàng'}</th>
      <th style="width:44px">Tệ</th><th class="num" style="width:96px">Dư đầu kỳ</th>
      <th class="num" style="width:118px">${kind==='sup'?'Chi phí phát sinh':'Doanh thu phát sinh'}</th>
      <th class="num" style="width:118px">${kind==='sup'?'Đã trả':'Đã thu'}</th>
      <th class="num" style="width:118px">Dư cuối — sổ ta</th><th class="num" style="width:118px">Dư cuối — sổ họ</th>
      <th class="num" style="width:104px">Chênh</th><th style="width:130px">Khớp dòng</th>
      <th style="width:120px">Hạn mức</th><th class="num" style="width:130px">Quy VND</th></tr></thead><tbody>`;
    rows.forEach(r=>{
      const ok=matches(r.p.name)||matches(r.p.short);
      if(!keep(ok)) return;
      h+=`<tr class="${rowCls(ok)}" onclick="setBal('${setter}','${esc(r.p.code)}')">
        <td><b>${esc(r.p.name)}</b> <span class="chip">${esc(r.p.short)}</span></td>
        <td class="mono tiny">${esc(r.p.ccy)}</td>
        <td class="num">${n2(r.openOur,0)}</td><td class="num">${n2(r.cost,0)}</td><td class="num">${n2(r.cred,0)}</td>
        <td class="num neg">${n2(r.endOurs,0)}</td>
        <td class="num">${r.nMiss||r.nDiff||r.endThem?n2(r.endThem,0):'<span class="tiny mut">chưa có sổ họ</span>'}</td>
        <td class="num ${Math.abs(r.gap)>1?'neg':''}">${sgn(r.gap,0)}</td>
        <td class="tiny"><span class="chip ok">${r.nOk}</span> <span class="chip warn">${r.nDiff}</span> <span class="chip err">${r.nMiss}</span>
          ${r.bridgeOk?'':'<span class="chip err">cầu hở</span>'}</td>
        <td class="num">${n2(toVnd(r.p,r.endThem),0)}</td></tr>`;
    });
    h+=`<tr class="tot"><td colspan="5">TỔNG ${rows.length} ${label.toUpperCase()}</td>
      <td class="num neg">—</td><td class="num">—</td>
      <td class="num ${Math.abs(tV-tO)>1?'neg':''}">${sgn(tV-tO,0)}</td><td></td><td></td>
      <td class="num neg">${n2(tO,0)}</td></tr></tbody></table></div>`;
    h+=`<div class="tiny" style="margin-top:6px">Cột <b>khớp dòng</b>: xanh = số dòng hai bên ghi giống nhau trong ngưỡng · vàng = lệch quá ngưỡng · đỏ = một bên chưa ghi.
      Đối tác nào còn dòng vàng/đỏ thì số dư cuối của họ chưa nên đem đi ký biên bản.</div>`;
    const ovr=rows.map(r=>overLimit(r.p)).filter(L=>L&&L.over).length;
    const noRule=rows.filter(r=>!(r.p.terms&&r.p.terms.rateRule)).length;
    if(ovr) h+=`<div class="card" style="border-color:var(--neg);background:var(--neg-soft);margin-top:8px"><div class="tiny">
      <b>${ovr} đối tác đang VƯỢT hạn mức công nợ.</b> Xem cột hạn mức; đặt lại hạn mức hoặc thu xếp thanh toán ở tab Đối tác.</div></div>`;
    if(noRule) h+=`<div class="card" style="border-color:#e8d8a8;background:var(--warn-soft);margin-top:8px"><div class="tiny">
      <b>${noRule} đối tác chưa chốt cơ chế ghi có ngoại tệ.</b> Chưa có điều khoản này thì mọi chênh tỷ giá đều thành tranh chấp không có căn cứ. Khai ở tab Đối tác.</div></div>`;
    const tot=rows.reduce((a,r)=>a+r.nDiff+r.nMiss,0);
    if(tot) h+=`<div class="card" style="border-color:#e8d8a8;background:var(--warn-soft);margin-top:8px"><div class="tiny">
      <b>${tot} dòng chưa khớp</b> nằm rải ở ${rows.filter(r=>r.nDiff+r.nMiss).length} ${label}. Mở từng sổ để xử lý, hoặc xem danh sách việc phải làm ở tab Đối soát.</div></div>`;
    return h;
  }

  /* --- một đối tác --- */
  const p=ps.find(x=>x.code===mode) || ps[0];
  return h + withParty(p.code, ()=>viewOverview());
}
function setBal(k,v){ UI[k]=v;
  if(v!=='ALL'){ UI.party=v; UI.selGroup=null; UI.selPay=null; }
  render(); }

/* ============================================================
   TAB 5 — TỔNG QUAN: hai sổ song song + trạng thái khớp
   ============================================================ */
/* Dựng sổ chi tiết công nợ của MỘT bên: dư đầu kỳ → phát sinh & thanh toán theo ngày → dư cuối.
   Trạng thái mỗi dòng so với bên kia: ok (khớp trong ngưỡng) · diff (lệch quá ngưỡng) · miss (bên kia không có). */
function ledger(side){
  const A=agg(), EV=events(A.pays);
  const tolC=Number(DB.policy.tolCost)||0, tolP=Number(DB.policy.tolPay)||0;
  const ap=activeParty();
  const open = side==='tip' ? (ap?Number(ap.openOur)||0:0) : (ap?Number(ap.open)||0:0);
  const rows=[];
  A.gsS.forEach(g=>{
    const mine  = side==='tip'? g.ct : g.cs;
    const other = side==='tip'? g.cs : g.ct;
    if(mine===null||mine===undefined) return;
    const d = (other===null||other===undefined) ? null : (g.cs-g.ct);
    rows.push({kind:'cost', date:g.date||'', ref:g.code, label:g.route||'Phát sinh dịch vụ',
      up:mine, down:0, diff:d, st:(d===null?'miss':(Math.abs(d)<=tolC?'ok':'diff')), gcode:g.code});
  });
  EV.forEach(e=>{
    const mine  = side==='tip'? e.rmbTip : e.rmbSup;
    const other = side==='tip'? e.rmbSup : e.rmbTip;
    if(mine===null) return;
    const amt = side==='tip'? e.amtTip : e.amtSup;
    rows.push({kind:'pay', date:e.members[0].date||'', ref:e.label,
      label:e.ccy+' '+n2(amt,e.ccy==='VND'?0:2)+(e.members[0].method==='OFFSET'?' (cấn trừ)':''),
      up:0, down:mine, diff:(other===null?null:e.fx),
      st:(other===null?'miss':(Math.abs(e.fx)<=tolP?'ok':'diff')), pid:e.members[0].id});
  });
  rows.sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999') || (a.kind===b.kind?0:(a.kind==='cost'?-1:1)));
  let bal=open;
  rows.forEach(r=>{ bal += r.up - r.down; r.bal=bal; });
  return {open, rows, end:bal,
          nOk:rows.filter(r=>r.st==='ok').length, nDiff:rows.filter(r=>r.st==='diff').length,
          nMiss:rows.filter(r=>r.st==='miss').length};
}

  return {h, L};
}
function bridgeHTML(B,compact){
  const mx=Math.max(...B.rows.map(r=>Math.abs(r.v)),1);
  let h='<div class="bridge">';
  B.rows.forEach(r=>{ const w=Math.abs(r.v)/mx*100;
    h+=`<div class="br ${r.k==='anchor'?'anchor':''}">
      <div class="bl">${esc(r.l)}${compact?'':`<span class="why">${esc(r.why)}</span>`}</div>
      <div class="bar"><i style="${r.v>=0?'left:50%':'right:50%'};width:${w/2}%;background:${r.v>=0?'var(--neg)':'var(--accent)'}"></i>
        <i style="left:50%;width:1px;background:#c8d2cc"></i></div>
      <div class="bv ${r.v<0?'pos':''}">${r.k==='anchor'?n2(r.v,0):sgn(r.v,0)}</div></div>`; });
  return h;
}

function dl(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove(); }
function importFile(el,merge){
  const f=el.files[0]; if(!f) return; const r=new FileReader();
  r.onload=()=>{ try{ const o=JSON.parse(r.result);
      if(!confirm('Thay thế TOÀN BỘ dữ liệu của hồ sơ "'+DB.meta.name+'" bằng file "'+f.name+'"?\n\nDữ liệu trong hồ sơ này sẽ bị ghi đè (vẫn Undo được 1 bước). Các hồ sơ khác và file .json đã export không bị ảnh hưởng.\n\nMuốn giữ cả hai thì bấm Hủy, đóng hồ sơ rồi nạp file ở màn hình chào — file sẽ mở thành hồ sơ riêng.')) return;
      const nm=DB.meta.name; push(); DB=normalize(o); DB.meta.name=nm; save(); render(); pill('Đã nhập '+f.name,'ok'); logline('import '+f.name);
    }catch(e){ pill('File JSON lỗi: '+e.message,'err'); } };
  r.readAsText(f); el.value='';
}
function clearData(){
  const n=DB.groups.length+DB.services.length+DB.payments.length+DB.revenues.length+DB.receipts.length+DB.bills.length;
  if(!confirm(`Xóa sạch ${n} bản ghi (đoàn + dịch vụ + thanh toán + tỷ giá) trong hồ sơ "${DB.meta.name}"?\n\nHồ sơ vẫn còn, chỉ rỗng dữ liệu. Chính sách tỷ giá và kỳ đối soát được giữ nguyên.\nCác file .json đã export không bị ảnh hưởng. Có thể hoàn tác bằng nút Undo.`)) return;
  push(); const p=DB.policy, m=DB.meta;
  DB=normalize(blankDB(m.name)); DB.policy=p; DB.meta=m;
  save(); render(); pill('Đã xóa sạch dữ liệu trong hồ sơ','warn');
}
function editMeta(){

/* ---------- normalize / boot ---------- */
/* Nâng cấp hồ sơ v1 (một NCC, chỉ chi phí) lên v2 (nhiều đối tác, hai chiều thu–chi).
   Không xoá dữ liệu cũ: gắn nhãn đối tác mặc định cho dữ liệu cũ rồi mới mở rộng. */
function migrate(o){
  if(o.schema>=2) return o;
  const P='SUP1';
  o.parties=[{code:P, kind:'sup', name:(o.meta&&o.meta.supplier)||'NCC',
              short:(o.meta&&o.meta.supplierShort)||'NCC', ccy:'RMB',
              open:(o.policy&&o.policy.openSup)||0, openOur:(o.policy&&o.policy.openTip)||0,
              note:'Chuyển tự động từ hồ sơ v1'}];
  o.bills=[];
  (o.groups||[]).forEach(g=>{
    if(g.costSup!==null&&g.costSup!==undefined)
      o.bills.push({id:'B-'+g.code, tour:g.code, party:P, total:g.costSup, note:'', src:'v1 groups.costSup'});
    g.cus=null; g.codeCus=null; delete g.costSup; delete g.inTip; delete g.inSup;
  });
  (o.services||[]).forEach(x=>{ x.party=P; });
  (o.payments||[]).forEach(x=>{ x.party=P; });
  o.revenues=o.revenues||[]; o.receipts=o.receipts||[];
  if(o.policy){ delete o.policy.openSup; delete o.policy.openTip; }
  if(o.meta){ delete o.meta.supplier; delete o.meta.supplierShort; }
  o.schema=2;
  return o;
}
/* v2 → v3: đoàn khóa theo mã khách (chưa có thì giữ mã cũ và đánh dấu TẠM),
   mã NCC hạ xuống cấp cấu phần, mỗi dòng tiền hàng gắn thêm hai trục comp/kind. */
function migrate3(o){
  if(o.schema>=3) return o;
  o.components = COMP_DEF.map(([code,name])=>({code, name, note:''}));
  o.tourParts = [];
  (o.groups||[]).forEach(g=>{
    g.tmp = !g.codeCus;               // mã hiện tại chưa phải mã khách → là mã tạm
    g.status = g.status || 'done';
    if(g.pax!==null&&g.pax!==undefined && g.paxAdult===undefined){ g.paxAdult=g.pax; g.paxChild=0; }
    if(g.paxAdult===undefined){ g.paxAdult=null; g.paxChild=null; }
  });
  const mark=(arr,side)=>(arr||[]).forEach(x=>{
    if(!x.comp){ x.comp=guessComp(x); x.compGuess=true; }
    if(!x.kind){ x.kind=guessKind(x); x.kindGuess=true; }
    x.side=side;
  });
  mark(o.services,'buy'); mark(o.revenues,'sell');
  /* mỗi (đoàn × cấu phần) có dòng chi phí → sinh một cấu phần đã khai, mang mã NCC cũ */
  const seen=new Set();
  (o.services||[]).forEach(x=>{
    const k=x.g+'|'+x.comp+'|'+x.party;
    if(seen.has(k)) return; seen.add(k);
    const g=(o.groups||[]).find(y=>y.code===x.g);
    o.tourParts.push({id:'TP-'+o.tourParts.length, tour:x.g, comp:x.comp, party:x.party,
      codeParty:(g&&g.codeSup)||null, note:''});
  });
  (o.groups||[]).forEach(g=>{ delete g.codeSup; });
  o.reviewPending = (o.services||[]).some(x=>x.compGuess||x.kindGuess)
                 || (o.revenues||[]).some(x=>x.compGuess||x.kindGuess);
  o.schema=3;
  return o;
}
/* v3 → v4: thêm lớp SỔ NGÂN HÀNG nằm TRÊN lớp phân bổ đã có.
   1 giao dịch ngân hàng ↔ n dòng phân bổ (payments/receipts). Không đụng vào engine đối soát.
   Khoản chỉ có đối tác ghi (amtTip=null) hoặc cấn trừ (OFFSET) KHÔNG sinh giao dịch ngân hàng —
   vì chúng chưa từng đi qua tài khoản; đó là điều đúng và cũng là chỗ hở cần thấy. */
function migrate4(o){
  if(o.schema>=4) return o;
  o.bank=[]; o.accounts=o.accounts||[{code:'ACC1', name:'Tài khoản chính', ccy:'VND', note:''}];
  const mk=(m,dir)=>{
    if(m.amtTip===null||m.amtTip===undefined) return;
    if(m.method==='OFFSET') return;
    const id='TX-'+m.id;
    o.bank.push({id, date:m.date||'', account:'ACC1', dir, ccy:m.ccy, amt:Number(m.amtTip),
      vndReal:(m.vndOut!==undefined&&m.vndOut!==null)?Number(m.vndOut):null,
      ref:'', desc:(dir==='out'?'Chuyển cho ':'Nhận từ ')+((o.parties.find(p=>p.code===m.party)||{}).name||m.party||''),
      note:'', src:m.src||'v3 '+m.id});
    m.txn=id;
  };
  (o.payments||[]).forEach(m=>mk(m,'out'));
  (o.receipts||[]).forEach(m=>mk(m,'in'));
  o.schema=4;
  return o;
}
/* v4 → v5: mỗi dòng phí/doanh thu mang TIỀN TỆ và TỶ GIÁ của chính nó, quy về đơn vị cuối RMB.
   Trường "a" giữ nguyên nguyên tệ để đối soát với đối tác; "aRmb" là số dùng cho giá vốn và lãi lỗ. */
function migrate5(o){
  if(o.schema>=5) return o;
  const P=o.policy||{}, R=Number(P.vndRate)||3850, U=Number(P.usdFixed)||6.9;
  const def=c=> c==='RMB'?1 : (c==='VND'?R : (c==='USD'?U:1));
  const fix=arr=>(arr||[]).forEach(x=>{
    if(!x.ccy){ const p=(o.parties||[]).find(y=>y.code===x.party);
      x.ccy = (p&&p.ccy) || 'RMB'; }
    if(x.rate===undefined||x.rate===null) x.rate=def(x.ccy);
  });
  fix(o.services); fix(o.revenues);
  o.schema=5;
  return o;
}
/* Khung hồ sơ đối tác. Gọi cả lúc nạp file lẫn lúc tạo mới trong phiên —
   đối tác thiếu khung sẽ làm vỡ sổ số dư ngay khi render. */
function fixParty(p){
  p.kind=p.kind||'sup'; p.short=p.short||p.code; p.ccy=p.ccy||(p.kind==='sup'?'RMB':'VND');
  p.open=Number(p.open)||0; p.openOur=Number(p.openOur)||0; p.note=p.note||'';
  p.legal=Object.assign({fullName:'',taxCode:'',address:'',country:'',rep:'',repTitle:'',license:'',note:''},p.legal||{});
  p.terms=Object.assign({payTerm:'',creditLimit:null,creditDays:null,rateRule:'',invoiceRule:'',note:''},p.terms||{});
  p.contacts=Array.isArray(p.contacts)?p.contacts:[];
  p.banks=Array.isArray(p.banks)?p.banks:[];
  p.contacts.forEach(c=>{ c.name=c.name||''; c.role=c.role||''; c.phone=c.phone||''; c.email=c.email||''; c.im=c.im||''; });
  p.banks.forEach(b=>{ b.bank=b.bank||''; b.branch=b.branch||''; b.accName=b.accName||''; b.accNo=b.accNo||'';
    b.swift=b.swift||''; b.ccy=b.ccy||p.ccy; b.def=!!b.def; b.note=b.note||''; });
  return p;
}
function normalize(o){
  o=migrate(o); o=migrate3(o); o=migrate4(o); o=migrate5(o);
  ['parties','components','accounts','groups','tourParts','bills','bank','services','payments','revenues','receipts'].forEach(k=>o[k]=o[k]||[]);
  if(!o.accounts.length) o.accounts=[{code:'ACC1',name:'Tài khoản chính',ccy:'VND',note:''}];
  o.bank.forEach(t=>{ t.note=t.note||''; t.ref=t.ref||''; if(t.vndReal===undefined)t.vndReal=null; });
  if(!o.components.length) o.components=COMP_DEF.map(([code,name])=>({code,name,note:''}));
  delete o.rates;
  o.policy=Object.assign({usdFixed:6.9,vndTip:3750,vndRate:3850,scopeFrom:'2026-03-01',scopeTo:'2026-07-31',
                          tolCost:1,tolPay:1,tolRev:10000,tolRcv:10000,usdVnd:26000,scopeBasis:'start'},o.policy||{});
  o.meta=Object.assign({name:'Hồ sơ',company:'Công ty',companyShort:'Ta',baseCost:'RMB',baseRev:'VND'},o.meta||{});
  o.recon=Object.assign({note:''},o.recon||{});
  o.parties.forEach(fixParty);
  o.groups.forEach(g=>{ g.note=g.note||''; if(g.codeCus===undefined)g.codeCus=null; if(g.cus===undefined)g.cus=null;
    if(g.dateEnd===undefined)g.dateEnd=null; if(g.tmp===undefined)g.tmp=!g.codeCus;
    g.status=g.status||'plan'; if(g.paxAdult===undefined)g.paxAdult=g.pax??null; if(g.paxChild===undefined)g.paxChild=null; });
  o.tourParts.forEach(t=>{ t.note=t.note||''; if(t.codeParty===undefined)t.codeParty=null; });
  o.bills.forEach(b=>{ b.note=b.note||''; if(b.total===undefined)b.total=null; });
  const fixLine=x=>{ x.note=x.note||''; x.t=x.t||'other'; if(x.m===undefined)x.m=null; if(!x.party)x.party=null;
    if(!x.comp)x.comp='TOUR'; if(!x.kind)x.kind='BG';
    if(!x.ccy)x.ccy='RMB'; if(x.rate===undefined||x.rate===null)x.rate=(x.ccy==='RMB'?1:null);
    if(x.link===undefined)x.link=null; };
  o.services.forEach(fixLine); o.revenues.forEach(fixLine);
  const fixMoney=m=>{ m.note=m.note||''; if(m.amtTip===undefined)m.amtTip=null; if(m.flag===undefined)m.flag=null;
    if(m.pair===undefined)m.pair=null; if(m.rateSup===undefined)m.rateSup=null; if(m.rateTip===undefined)m.rateTip=null;
    if(m.vndOut===undefined)m.vndOut=null; if(m.txn===undefined)m.txn=null;
    if(!m.party)m.party=null; };
  o.payments.forEach(fixMoney); o.receipts.forEach(fixMoney);
  return o;
}
function boot(){
  render();                                   // màn hình chào trước
  const last=localStorage.getItem(LS_LAST);
  if(last && localStorage.getItem(LS_PREFIX+last)) wsOpen(last);
  else pill('Chưa mở hồ sơ nào — nạp file .json hoặc tạo hồ sơ mới','warn');
  /* resizer */
  let drag=false;
  $('#resizer').addEventListener('mousedown',e=>{drag=true;e.preventDefault();});
  document.addEventListener('mousemove',e=>{ if(!drag)return; UI.sideW=Math.max(240,Math.min(560,e.clientX));
    $('#side').style.width=UI.sideW+'px'; $('#side').style.flexBasis=UI.sideW+'px'; });
  document.addEventListener('mouseup',()=>{drag=false;});
  document.addEventListener('keydown',e=>{ if(DB&&(e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();undo();} });
  window.addEventListener('beforeunload',()=>{ if(DB) save(); });
}
boot();
