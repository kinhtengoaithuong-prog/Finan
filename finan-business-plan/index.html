<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="docTitle">SBH Own channel — mạch vận hành FY2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@600;700&family=Outfit:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --ink:#16201C;--muted:#6a746e;--line:#e3e8e4;--card:#fff;--bg:#f4f6f4;
  --own:#0B5D4B;--neg:#B3402E;--soft:#eaf3ef;--warn:#8a5a12;--warnbg:#fff9e8;
  --derived:#5146A6;--derbg:#eeecf8;--imp:#1e5a8a;--impbg:#e6eff7;--alloc:#77817a;
  --panelw:20%;--midw:1fr;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font-family:inherit}
.top{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1{font-family:'Noto Serif Display',Georgia,serif;font-size:16px;font-weight:700;margin:0}
.badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--own);border-radius:999px;padding:2px 8px}
.stamp{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer}
.btn:hover{border-color:var(--own);color:var(--own)}
.btn:focus-visible{outline:none;border-color:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.2)}
.btn.on{background:var(--own);border-color:var(--own);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.pill-st{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;opacity:0;transition:opacity .2s}
.pill-st.on{opacity:1}
.pill-st.ok{background:var(--soft);color:var(--own)}
.pill-st.warn{background:var(--warnbg);color:var(--warn)}

/* ===== 20 | 40 | 40 ===== */
#shell{flex:1 1 auto;display:grid;grid-template-columns:var(--panelw) 12px var(--midw) 12px 1fr;min-height:0}
#shell.collapsed{grid-template-columns:0 0 var(--midw) 12px 1fr}
#shell.collapsed #gripL{display:none}
.pane{min-height:0;overflow:auto;padding:12px}
#panel{background:var(--card);border-right:1px solid var(--line)}
#shell.collapsed #panel{display:none}
.grip{background:var(--bg);cursor:col-resize;position:relative;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.grip::after{content:'';width:4px;height:44px;border-radius:3px;background:#cfd8d2;
  transition:background .12s,height .12s}
.grip:hover::after{background:var(--own);height:72px}
.grip.dragging::after{background:var(--own);height:100%;border-radius:0}
.grip:focus-visible{outline:none}
.grip:focus-visible::after{background:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.25)}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.resizing *{cursor:col-resize!important}
#mid{background:var(--bg)}
#right{background:var(--bg)}

.pt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.pt:first-child{margin-top:0}
.mchk{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;font-variant-numeric:tabular-nums}
.mchk input{accent-color:var(--own)}
.mchk .tag{font-size:9px;font-weight:800;border-radius:5px;padding:0 5px;margin-left:auto}
.tag.a{background:#f1f3f1;color:#8b948d}.tag.p{background:var(--soft);color:var(--own)}
.pbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pbtns .btn{font-size:11px;padding:3px 8px}

/* zones */
.zone{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.zh{display:flex;align-items:baseline;gap:8px;padding:9px 13px;background:#f7faf8;border-bottom:1px solid var(--line)}
.zn{font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;color:#fff;background:var(--own);border-radius:5px;padding:1px 7px}
.zt{font-family:'Noto Serif Display',Georgia,serif;font-size:14px;font-weight:600}
.zs{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;max-width:52%}
.zb{padding:9px 13px}
.row{display:grid;grid-template-columns:1fr 104px 74px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #eef1ee}
.row:last-child{border-bottom:none}
.row.out{background:var(--derbg);margin:3px -13px;padding:6px 13px;border-bottom:none}
.row.out .lb{color:var(--derived);font-weight:800}
.row.imp{background:var(--impbg);margin:3px -13px;padding:6px 13px;border-bottom:none}
.row.imp .lb{color:var(--imp);font-weight:800}
.row.flagged .lb::after{content:' ⚑';color:var(--warn)}
.lb{font-size:12px}
.lb small{display:block;color:var(--muted);font-size:10.5px}
input.num{width:100%;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input.num:focus{outline:none;border-color:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.18)}
input.num.empty{background:#fbfbfa;border-style:dashed}
.unit{font-size:11px;color:var(--muted)}
.val{text-align:right;font-family:'DM Mono',monospace;font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.val.neg{color:var(--neg)}
.val.chained{color:var(--imp);background:var(--impbg);border-radius:6px;padding:4px 7px}
.val.na{color:#b6bdb8}
.prop{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:4px;font-size:10px;padding:0 4px;cursor:pointer}
.prop:hover{border-color:var(--own);color:var(--own)}
.warnbox{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:0 7px 7px 0;padding:8px 11px;margin:7px 0;font-size:11.5px;color:#5c4410}
.warnbox b{color:var(--warn)}
.infobox{background:var(--impbg);border-left:3px solid var(--imp);border-radius:0 7px 7px 0;padding:8px 11px;margin:7px 0;font-size:11.5px;color:#1b3d5c}
.infobox b{color:var(--imp)}

/* P&L wide */

/* v0.4 — lưới nhiều tháng + tab phải */
.cnt{background:var(--own);color:#fff;border-radius:999px;padding:0 6px;font-size:9.5px;margin-left:5px}
.zrow{display:grid;gap:7px;align-items:center;padding:4px 0;border-bottom:1px dashed #eef1ee}
.zrow:last-child{border-bottom:none}
.zrow.zhead{border-bottom:1.5px solid var(--ink);padding-bottom:5px;position:sticky;top:0;background:var(--card);z-index:2}
.zrow.out{background:var(--derbg);margin:3px -13px;padding:5px 13px;border-bottom:none}
.zrow.out .lb{color:var(--derived);font-weight:800}
.zrow.big .lb{font-weight:800}
.zrow.flagged .lb::after{content:' ⚑';color:var(--warn)}
.cell{min-width:0}
.cell.na{text-align:right;color:#c3ccc6;font-family:'DM Mono',monospace;font-size:12px}
.cell .val{text-align:right}
.cell .val.imp{color:var(--imp)}
.mh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--own);text-align:right}
.mh.a{color:#8b948d}
.rtabs{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.rtab{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:7px;cursor:pointer}
.rtab:hover{color:var(--own)}
.rtab.on{background:var(--own);color:#fff}
.rtab:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(11,93,75,.25)}
.rmeta{margin-left:auto;font-size:11px;color:var(--muted)}
.saveinfo{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);padding:6px 0 0}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.dbtns .btn{font-size:11px;padding:4px 6px;text-align:center}
.dbtns .btn.wide{grid-column:1/-1}
.seghead .zh{background:var(--soft)}
.zrow.cmrow{background:#e6efe9;border-top:2px solid var(--own);border-bottom:2px solid var(--own);margin:3px -13px;padding:6px 13px}
.zrow.cmrow .lb{font-weight:800;color:var(--own)}
.acctbl{overflow-x:auto}
table.acc{border-collapse:collapse;font-size:11px;min-width:100%}
table.acc th{background:var(--ink);color:#fff;padding:4px 5px;font-size:9.5px;text-transform:uppercase;white-space:nowrap}
table.acc tr.sub td{background:#4a544e;color:#fff;font-size:9px;padding:2px 5px;text-align:center}
table.acc td{padding:3px 4px;border-bottom:1px solid #f2f5f2;white-space:nowrap}
table.acc td.rl{min-width:120px}
table.acc td.rev{text-align:right;font-family:'DM Mono',monospace;font-weight:800;color:var(--own)}
table.acc input.txt{width:118px;font-size:11px;padding:3px 5px;border:1px solid var(--line);border-radius:5px}
table.acc input.num.sm{width:62px;font-size:11px;padding:3px 4px}
table.acc select{font-size:10.5px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:#fff}
table.acc tr.badrow td{background:#fbeeeb}
table.acc td.okchk{color:var(--own);font-weight:800;text-align:center}
table.acc td.badchk{color:var(--neg);font-weight:800;text-align:center}
table.acc td.rl small{display:block;font-size:9.5px;color:var(--muted);font-style:italic}
.zrow.chkrow{background:#f7faf8;border-top:1px dashed var(--line);margin:3px -13px;padding:6px 13px;font-size:11.5px}
.zrow.chkrow .val.okchk{color:var(--own);font-weight:800}
.zrow.chkrow .val.badchk{color:var(--neg);font-weight:800}
table.pl td.okchk{color:var(--own);font-weight:800}
table.pl td.badchk{color:var(--neg);font-weight:800;background:#fbeeeb}
table.pl tr.chk td{background:#f7faf8;font-size:10.5px;color:var(--muted);border-top:1px dashed var(--line)}
table.pl tr.chk td.rl{background:#f7faf8;font-style:italic}
.rfoot{padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);background:#fbfcfb}
.plwrap{background:var(--card);border:1.5px solid var(--own);border-radius:11px;overflow:hidden}
.plh{padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:9px}
.plh .t{font-family:'Noto Serif Display',Georgia,serif;font-size:14px;font-weight:600}
.plh .s{font-size:11px;color:var(--muted);margin-left:auto}
.plscroll{overflow:auto;max-height:calc(100vh - 150px)}
table.pl{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
table.pl th,table.pl td{padding:4px 7px;text-align:right;white-space:nowrap;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;border-bottom:1px solid #f2f5f2}
table.pl th{background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;position:sticky;top:0;z-index:3}
table.pl th.a{background:#4a544e}
table.pl th.t{background:var(--own)}
table.pl .rl{text-align:left;font-family:'Outfit',sans-serif;position:sticky;left:0;background:var(--card);z-index:2;min-width:190px;border-right:1px solid var(--line)}
table.pl th.rl{background:var(--ink);z-index:4}
table.pl td.a{background:#f7f8f7;color:#5f6a63}
table.pl td.t{background:var(--soft);font-weight:800}
table.pl tr.g td{background:#f1f5f2;font-weight:800;color:var(--own);font-size:10px;text-transform:uppercase}
table.pl tr.g td.rl{background:#f1f5f2}
table.pl tr.cm td{background:var(--soft);font-weight:800}
table.pl tr.cm td.rl{background:var(--soft)}
table.pl tr.op td{background:#e6efe9;font-weight:800;border-top:2px solid var(--own);border-bottom:2px solid var(--own)}
table.pl tr.op td.rl{background:#e6efe9}
table.pl tr.aft td{color:var(--alloc)}
table.pl tr.sub2 td{color:var(--muted);font-size:10.5px}
table.pl tr.base td{background:var(--derbg);font-weight:800;color:var(--derived);border-top:1.5px solid var(--derived)}
table.pl tr.base td.rl{background:var(--derbg)}
.neg{color:var(--neg)}
td.na{color:#c3ccc6}


@media(max-width:1020px){#shell,#shell.collapsed{display:block}#panel{border-right:none;border-bottom:1px solid var(--line)}.grip{display:none}.pane{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Quy tắc trình bày thống nhất: số âm luôn đỏ =====
   Đặt cuối bảng style và dùng !important vì các luật trước đó
   (td.a cột actual xám, tr.aft tầng phân bổ, .val.imp, .val.chained)
   có độ ưu tiên cao hơn class .neg nên trước đây nuốt mất màu đỏ. */
table.pl td.neg, table.pl tr.cm td.neg, table.pl tr.op td.neg,
table.pl tr.aft td.neg, table.pl tr.sub2 td.neg, table.pl td.a.neg, table.pl td.t.neg{color:var(--neg)!important}
.val.neg, .cell .val.neg, .cell .val.imp.neg, .lad-row.after .lcell .val.neg{color:var(--neg)!important}
table.acc td.rev.neg{color:var(--neg)!important}
</style>
</head>

function calcAll(){

  sh.baseStart=(i===0)?g('s_baseStart',i):out[i-1].sh.baseEnd;
  sh.due=g('s_due',i); sh.renewalPct=g('s_renewal',i);
  sh.renewed=sh.due*sh.renewalPct/100; sh.churned=sh.due-sh.renewed;
  sh.react=g('s_react',i); sh.avgTerm=g('s_avgTerm',i);
  /* vòng 1: lấy new users từ các kênh (chưa cần baseAvg) */
  const pre={OWN:engOwn(i,{baseAvg:0,renewed:sh.renewed,react:sh.react}),PTN:engPtn(i,sh),HLB:engHlb(i,sh)};
  sh.newUsers=CH.reduce((a,c)=>a+(pre[c].newUsers||0),0);
  sh.stockUsers=CH.reduce((a,c)=>a+(pre[c].stockUsers||0),0);
  sh.baseEnd=sh.baseStart+sh.newUsers-sh.churned+sh.react;
  sh.baseTotal=sh.baseEnd+sh.stockUsers;          /* base dùng chung, gồm user từ đối tác */
  sh.baseAvg=(sh.baseStart+sh.stockUsers+sh.baseTotal)/2;
  sh.paying=sh.newUsers+sh.react+sh.renewed;
  /* vòng 2: chạy lại kênh với baseAvg thật (chỉ Own dùng base cho service attach) */
  const ch={OWN:chAgg(engOwn(i,sh)),PTN:chAgg(engPtn(i,sh)),HLB:chAgg(engHlb(i,sh))};
  sh.cloud=-sh.baseAvg*g('s_cloudPerUser',i)/1000;
  sh.payCS=-g('s_payCS',i); sh.payProduct=-g('s_payProduct',i); sh.payTech=-g('s_payTech',i);
  sh.platform=sh.cloud+sh.payCS+sh.payProduct+sh.payTech;
  sh.alloc=allocFromCSS(i,'12');   /* nối từ CSS — không còn gõ tay */
  const sumCM=CH.reduce((a,c)=>a+ch[c].channelCM,0);
  const bu={channelCM:sumCM, platform:sh.platform, opBefore:sumCM+sh.platform,
    alloc:sh.alloc, opAfter:sumCM+sh.platform+sh.alloc,
    rev:CH.reduce((a,c)=>a+ch[c].rev,0), disc:CH.reduce((a,c)=>a+ch[c].disc,0),
    direct:CH.reduce((a,c)=>a+ch[c].direct,0)};
  out.push({sh:sh,ch:ch,bu:bu});
 }

function calcCSS(){

 for(let i=0;i<nF;i++){
  const per=CSSL.map(x=>{const gr=Number(x.g[i])||0;
    const o=gr*(Number(x.own)||0)/100, b=gr*(Number(x.bu3)||0)/100;
    return {k:x.k,l:x.l,gross:gr,to12:o,to3:b,keep:gr-o-b};});
  const S=f=>per.reduce((a,x)=>a+x[f],0);
  const sh={gross:-S('gross'), to12:S('to12'), to3:S('to3'), keep:-S('keep'),
    platform:0, alloc:0, per:per};
  sh.channelCM=0;
  const ch={CSSC:{ch:'CSSC',rev:0,disc:0,direct:-S('gross')+S('to12')+S('to3'),
    channelCM:-S('keep'), gross:-S('gross'), to12:S('to12'), to3:S('to3'), keep:-S('keep')}};
  out.push({sh:sh,ch:ch,bu:{channelCM:-S('keep'),platform:0,opBefore:-S('keep'),
    alloc:0,opAfter:-S('keep'),rev:0,disc:0,direct:-S('keep')}});
 }
 return out;
}

function calcBU3(){

 for(let i=0;i<nF;i++){
  const sh={};

  const pre={}; CH3.forEach(c=>pre[c]=ENG3[c](i,{baseStart:sh.baseStart,custAvg:0}));
  sh.newUsers=CH3.reduce((a,c)=>a+(pre[c].newUsers||0),0);
  sh.churned=pre.DIR.churnOut||0;
  sh.baseEnd=sh.baseStart+sh.newUsers-sh.churned;
  sh.stockUsers=CH3.reduce((a,c)=>a+(pre[c].stockUsers||0),0);
  sh.baseTotal=sh.baseEnd+sh.stockUsers;
  sh.custAvg=(sh.baseStart+sh.baseEnd)/2;
  sh.baseAvg=sh.custAvg;
  sh.paying=sh.baseEnd;
  const ch={}; CH3.forEach(c=>ch[c]=chAgg(ENG3[c](i,sh)));
  sh.cloud=-g('s3_platform',i); sh.payCS=-g('s3_payCS',i);
  sh.payProduct=-g('s3_payProduct',i); sh.payTech=-g('s3_payTech',i);
  sh.platform=sh.cloud+sh.payCS+sh.payProduct+sh.payTech;
  sh.alloc=allocFromCSS(i,'3');    /* nối từ CSS — không còn gõ tay */
  const sumCM=CH3.reduce((a,c)=>a+ch[c].channelCM,0);
  out.push({sh:sh,ch:ch,bu:{channelCM:sumCM,platform:sh.platform,opBefore:sumCM+sh.platform,
    alloc:sh.alloc,opAfter:sumCM+sh.platform+sh.alloc,
    rev:CH3.reduce((a,c)=>a+ch[c].rev,0),disc:CH3.reduce((a,c)=>a+ch[c].disc,0),
    direct:CH3.reduce((a,c)=>a+ch[c].direct,0)}});
 }
 return out;
}

/* ===== P&L cấp trên: TRÌNH BÀY THEO LINE ITEM, rồi reconcile ngược về segment =====
   Hai mặt của cùng một con số:
     mặt 1 — cộng ngang theo từng dòng P&L (giống hệt cấp segment)
     mặt 2 — cộng dọc theo từng segment/BU
   Hai mặt phải ra cùng Σ Channel CM; dòng chênh lệch kiểm điều đó. */
function nodesOf(D){
 if(D.ch)return Object.keys(D.ch).map(c=>D.ch[c]);
 return [].concat(D.a?Object.keys(D.a.ch).map(c=>D.a.ch[c]):[],
                  D.b?Object.keys(D.b.ch).map(c=>D.b.ch[c]):[]);
}

function pick(D,r){
 const p=r.p;
 if(p[0]==='line'){let t=0,any=false;
   nodesOf(D).forEach(n=>{const v=n?n[p[1]]:undefined;if(v!==undefined&&v!==null&&!isNaN(v)){t+=v;any=true;}});
   return any?t:null;}
 if(p[0]==='__gapCMbu'){let t=0;nodesOf(D).forEach(n=>{t+=Number(n.channelCM)||0;});return t-D.bu.channelCM;}
 if(p[0]==='__gapCMco'){let t=0;nodesOf(D).forEach(n=>{t+=Number(n.channelCM)||0;});
   return t-((D.a?D.a.bu.channelCM:0)+(D.b?D.b.bu.channelCM:0));}
 if(p[0]==='__abCM')return (D.a?D.a.bu.channelCM:0)+(D.b?D.b.bu.channelCM:0);
 if(p[0]==='__abPlat')return (D.a?D.a.bu.platform:0)+(D.b?D.b.bu.platform:0);
 if(p[0]==='__gapBU')return D.bu.opBefore-(D.bu.channelCM+D.sh.platform);
 if(p[0]==='__gapAft')return D.bu.opAfter-(D.bu.opBefore+(D.sh&&D.sh.alloc!==undefined&&D.ch?D.sh.alloc:D.bu.alloc));
 if(p[0]==='__gapCo')return D.bu.opBefore-((D.a?D.a.bu.opBefore:0)+(D.b?D.b.bu.opBefore:0)+(D.c?D.c.bu.opBefore:0));
 if(p[0]==='__cloudpu')return D.sh.baseAvg?-D.sh.cloud*1000/D.sh.baseAvg:null;
 if(p[0]==='__ratio')return (D.sh.baseStart&&D.sh.baseTotal)?D.sh.baseTotal/D.sh.baseStart:null;
 let v;
 if(p[0]==='__a')v=D.a?D.a.bu[p[1]]:null;
 else if(p[0]==='__b')v=D.b?D.b.bu[p[1]]:null;
 else if(p[0]==='__c')v=D.c?D.c.bu[p[1]]:null;
 else if(p[0]==='ch')v=D.ch[p[1]]?D.ch[p[1]][p[2]]:null;
 else if(p[0]==='sh')v=D.sh[p[1]];
 else v=D.bu[p[1]];
 if(r.inv&&v!==null&&v!==undefined)v=-v;
 return (v===undefined)?null:v;
}

 if(RTAB==='seg'&&SEG===BUDEF[BU].shared)
   return `<div class="plwrap">${tabs}<div class="rfoot" style="padding:18px">
     Đang ở tầng <b>${CHLABEL[SEG]}</b> — tầng này không có P&L kênh. Chọn một kênh ở panel trái, hoặc xem tab P&L ${BU==='BU12'?'SBH':'FinanOne'}.</div></div>`;
 const foot=RTAB==='pl'
  ?`<div class="rfoot">Phần trên cộng <b>theo dòng P&L</b> — cùng loại dòng như cấp segment. Phần dưới cộng <b>theo segment</b>. Hai cách phải ra cùng Σ Channel CM. Cloud · 6.1 · 6.3 · 6.4 trừ một lần ở tầng BU, không phân bổ về kênh.</div>`
  :(RTAB==='seg'?`<div class="rfoot">Kênh <b>${CHLABEL[SEG]}</b> dừng ở <b>Channel CM</b>. Nền tảng dùng chung và back office nằm ở tầng ${BU==='BU12'?'SBH':'FinanOne'} — xem tab kế bên.</div>`
  :(RTAB==='co'?`<div class="rfoot">Phần trên cộng <b>theo dòng P&L</b> qua cả 8 kênh của hai BU. Phần dưới cộng <b>theo BU</b>. Ba dòng chênh lệch kiểm: hai cách cộng khớp nhau, xuống OP trước phân bổ, và xuống OP sau phân bổ.</div>`
  :`<div class="rfoot">Base dùng chung toàn SBH. Cột <b>Tổng</b>: dòng tồn lấy tháng cuối, dòng tỷ lệ lấy bình quân, dòng dòng chảy thì cộng.</div>`));
 return `<div class="plwrap">${tabs}<div class="plscroll"><table class="pl">
  <thead><tr><th class="rl">${RTAB==='pl'?'Dòng':'Chỉ tiêu'}</th>${th}<th class="t">Tổng</th></tr></thead>
  <tbody>${body}</tbody></table></div>${foot}</div>`;
}

/* ================= LƯU TRỮ =================
   3 lớp:  autosave localStorage  ·  JSON máy đọc (có version + hash)  ·  CSV người đọc
   SHAPE_VERSION bump mỗi khi đổi hình dạng dữ liệu → bản lưu cũ không nạp đè bừa. */
const APP_ID="sbh_bu12_mach_van_hanh";
const SHAPE_VERSION=8;
const STORAGE_KEY=APP_ID+'_v'+SHAPE_VERSION;
function hashOf(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(16).padStart(8,'0');}
function payload(){
 const data={IN:IN,AQ:AQ,ACCS:ACCS,PACC:PACC,PIPE:PIPE,CSSL:CSSL};
 return {app:APP_ID, appVersion:APP_VERSION, shapeVersion:SHAPE_VERSION,
   savedAt:new Date().toISOString(), hash:hashOf(JSON.stringify(data)),
   data:data, ui:{EDITM:EDITM, SHOW:SHOW, RTAB:RTAB, SEG:SEG, BU:BU,
     panelw:document.documentElement.style.getPropertyValue('--panelw')||DEFW.panel,
     midw:document.documentElement.style.getPropertyValue('--midw')||DEFW.mid}};
}
/* Nạp có kiểm: chỉ nhận khoá còn tồn tại, báo rõ cái gì bị bỏ. */
function applyPayload(p,label){
 if(!p||p.app!==APP_ID)return {ok:false,msg:'File không thuộc công cụ này'};
 const d=p.data||{}; let dropped=[],taken=0;
 if(d.IN)Object.keys(d.IN).forEach(k=>{
   if(!DEF[k]){dropped.push('IN.'+k);return;}
   const v=d.IN[k]; if(!Array.isArray(v)||v.length!==nF){dropped.push('IN.'+k+' (sai độ dài)');return;}
   IN[k]=v.map(x=>Number(x)||0);taken++;});
 if(d.AQ)Object.keys(d.AQ).forEach(k=>{
   if(!AQDEF[k]){dropped.push('AQ.'+k);return;}
   const v=d.AQ[k]; if(!Array.isArray(v)||v.length!==nA){dropped.push('AQ.'+k+' (sai độ dài)');return;}
   AQ[k]=v.map(x=>(x===null||x===''||isNaN(x))?null:Number(x));taken++;});
 const missing=Object.keys(DEF).filter(k=>!d.IN||!d.IN[k]).concat(Object.keys(AQDEF).filter(k=>!d.AQ||!d.AQ[k]));
 if(d.ACCS&&Array.isArray(d.ACCS)&&d.ACCS.length===ACCS.length){
   d.ACCS.forEach((a,ai)=>{['name','type','ev','com','contrib'].forEach(f=>{if(a[f]!==undefined)ACCS[ai][f]=a[f];});
     ['qty','price'].forEach(f=>{if(Array.isArray(a[f])&&a[f].length===nF)ACCS[ai][f]=a[f].map(x=>Number(x)||0);});});
   taken++;}
 else if(d.ACCS)dropped.push('ACCS (số dòng khác)');
 if(Array.isArray(d.PACC)&&d.PACC.length===PACC.length)PACC=d.PACC;
 if(Array.isArray(d.PIPE))PIPE=d.PIPE;
 if(Array.isArray(d.CSSL)&&d.CSSL.length===CSSL.length)CSSL=d.CSSL;
 if(p.ui){ if(p.ui.BU&&BUDEF[p.ui.BU])BU=p.ui.BU; if(p.ui.SEG&&ZN[p.ui.SEG])SEG=p.ui.SEG; if(p.ui.EDITM)EDITM=p.ui.EDITM; if(p.ui.SHOW){ALLM.forEach(m=>SHOW[m]=!!p.ui.SHOW[m]);}
  if(p.ui.RTAB)RTAB=p.ui.RTAB;
  if(p.ui.panelw)setW('--panelw',p.ui.panelw); if(p.ui.midw)setW('--midw',p.ui.midw);}
 const verMsg=(p.shapeVersion!==SHAPE_VERSION)?(' · bản lưu shape v'+p.shapeVersion+', công cụ v'+SHAPE_VERSION):'';
 return {ok:true,taken:taken,dropped:dropped,missing:missing,
   msg:label+': nhận '+taken+' trường'+(dropped.length?', bỏ '+dropped.length:'')+(missing.length?', thiếu '+missing.length+' (giữ mặc định)':'')+verMsg};
}
let saveT;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveLocal,600);}
function saveLocal(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload()));
   setSaveInfo('Đã lưu · '+new Date().toLocaleTimeString('vi-VN'));}
 catch(e){status('Không lưu được: '+e.message,'warn');}
}
function loadLocal(){
 let raw=null; try{raw=localStorage.getItem(STORAGE_KEY);}catch(e){}
 if(!raw){ /* thử bản lưu shape cũ để không mất công người dùng */
   for(let v=SHAPE_VERSION-1;v>=1;v--){try{const r=localStorage.getItem(APP_ID+'_v'+v);
     if(r){const p=JSON.parse(r);const res=applyPayload(p,'Bản lưu shape v'+v);
       return {found:true,msg:res.msg,old:true};}}catch(e){}}
   return {found:false};}
 try{const p=JSON.parse(raw);const res=applyPayload(p,'Bản lưu cục bộ');return {found:true,msg:res.msg,at:p.savedAt};}
 catch(e){return {found:false,msg:'Bản lưu hỏng, bỏ qua'};}
}
function clearLocal(){
 if(!confirm('Xoá bản lưu trong trình duyệt?\n\nMất: bản lưu tự động.\nGiữ: số đang hiện trên màn hình (chưa mất cho tới khi bạn tải lại trang).'))return;
 try{for(let v=1;v<=SHAPE_VERSION;v++)localStorage.removeItem(APP_ID+'_v'+v);}catch(e){}
 setSaveInfo('Đã xoá bản lưu');status('Đã xoá bản lưu cục bộ','warn');
}
function download(name,text,mime){
 const b=new Blob([text],{type:mime||'application/json;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}
function stamp(){const d=new Date();const p=n=>String(n).padStart(2,'0');
 return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}
function exportJSON(){const p=payload();
 download('SBH_Own_mach_van_hanh_'+stamp()+'.json',JSON.stringify(p,null,1));
 status('Đã xuất JSON · hash '+p.hash);}
function importJSON(file){
 const r=new FileReader();
 r.onload=()=>{let p;try{p=JSON.parse(r.result);}catch(e){status('File không phải JSON hợp lệ','warn');return;}
  if(!confirm('Nhập file này?\n\nGhi đè: toàn bộ số plan và số lượng actual đang có.\nGiữ: lịch sử undo.\n\nTrường lạ sẽ bị bỏ, trường thiếu giữ mặc định.'))return;
  pushUndo();
  const res=applyPayload(p,'File nhập');
  if(!res.ok){status(res.msg,'warn');return;}
  paint();scheduleSave();status(res.msg);
  if(res.dropped.length)console.warn('Trường bị bỏ:',res.dropped);};
 r.readAsText(file);
}
/* CSV người đọc — đúng bảng đang hiển thị bên phải */
function exportCSV(){
 const ms=showList(); if(!ms.length){status('Chưa chọn tháng nào','warn');return;}
 const D=ms.map(m=>({m:m,a:isActM(m),d:RTAB==='co'?dataCo(m):dataFor(m)}));
 const rows=(RTAB==='pl')?plRows():(RTAB==='co'?COROWS:CUSTROWS);
 const val=(d,r)=>pick(d,r);
 const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const out=[];
 out.push(esc('SBH BU12 — '+(RTAB==='pl'?'P&L hợp nhất':'Customer performance')));
 out.push(esc('Xuất '+new Date().toLocaleString('vi-VN')+' · '+APP_VERSION+' · đơn vị: triệu VND / user'));
 out.push('');
 out.push([esc(RTAB==='pl'?'Dòng':'Chỉ tiêu')].concat(D.map(c=>esc(c.m+(c.a?' (actual)':' (plan)')))).join(','));
 rows.forEach(r=>{
  if(r.g){out.push(esc(r.g));return;}
  const cells=D.map(c=>{const v=val(c.d,r);return (v===null||v===undefined)?'':String(Math.round(v*10000)/10000);});
  out.push([esc(r.l)].concat(cells).join(','));});
 download('SBH_Own_'+(RTAB==='pl'?'PL':'Customer')+'_'+stamp()+'.csv','\ufeff'+out.join('\n'),'text/csv;charset=utf-8');
 status('Đã xuất CSV — '+(RTAB==='pl'?'P&L':'Customer performance'));
}
function setSaveInfo(t){const e=document.getElementById('saveInfo');if(e)e.textContent=t;}

/* ===== paint + sự kiện ===== */
function paint(){
 document.getElementById('panel').innerHTML=renderPanel();
 document.getElementById('mid').innerHTML=renderMid();
 document.getElementById('right').innerHTML=renderRight();
 document.querySelectorAll('[data-show]').forEach(el=>el.onchange=()=>{SHOW[el.dataset.show]=el.checked;paint();scheduleSave();});
 document.querySelectorAll('[data-edit]').forEach(el=>el.onchange=()=>{
   if(el.checked)EDITM[el.dataset.edit]=true;else delete EDITM[el.dataset.edit];paint();scheduleSave();});
 const bulk=(attr,tgt)=>document.querySelectorAll('['+attr+']').forEach(b=>b.onclick=()=>{const s=b.dataset[tgt];
   ALLM.forEach(m=>{const on=(s==='all')||(s==='act'&&isActM(m))||(s==='plan'&&!isActM(m));
     if(tgt==='sel')SHOW[m]=on; else {if(on)EDITM[m]=true;else delete EDITM[m];}});paint();scheduleSave();});
 bulk('data-sel','sel'); bulk('data-esel','esel');
 document.querySelectorAll('[data-seg]').forEach(b=>b.onclick=()=>{SEG=b.dataset.seg;paint();scheduleSave();});
 document.querySelectorAll('[data-bu]').forEach(b=>b.onclick=()=>{BU=b.dataset.bu;SEG=BUDEF[BU].ch[0];paint();scheduleSave();});
 document.querySelectorAll('[data-pacc]').forEach(el=>el.onchange=()=>{pushUndo();
   const a=PACC[+el.dataset.pacc],f=el.dataset.f;
   if(f==='qty'||f==='price')a[f][+el.dataset.mi]=parseFloat(el.value)||0;
   else if(f==='ev'||f==='com'||f==='share')a[f]=parseFloat(el.value)||0; else a[f]=el.value;
   paint();scheduleSave();status('Cập nhật deal · '+(a.name||''));});
 document.querySelectorAll('[data-pipe]').forEach(el=>el.onchange=()=>{pushUndo();
   const p=PIPE[+el.dataset.pipe],f=el.dataset.f;
   if(f==='val')p.val[+el.dataset.mi]=parseFloat(el.value)||0;
   else if(f==='share')p.share=parseFloat(el.value)||0; else p.name=el.value;
   paint();scheduleSave();status('Cập nhật pipeline');});
 document.querySelectorAll('[data-css]').forEach(el=>el.onchange=()=>{pushUndo();
   const x=CSSL[+el.dataset.css],f=el.dataset.f;
   if(f==='g')x.g[+el.dataset.mi]=parseFloat(el.value)||0; else x[f]=parseFloat(el.value)||0;
   paint();scheduleSave();status('Cập nhật CSS · '+x.l);});
 const pa=document.getElementById('pipeAdd');
 if(pa)pa.onclick=()=>{pushUndo();PIPE.push({name:'Đối tác mới',share:50,val:a5(0),contrib:'none'});paint();scheduleSave();};
 document.querySelectorAll('[data-acc]').forEach(el=>{
  const h=()=>{pushUndo();const a=ACCS[+el.dataset.acc],f=el.dataset.f;
   if(f==='qty'||f==='price')a[f][+el.dataset.mi]=parseFloat(el.value)||0;
   else if(f==='ev'||f==='com')a[f]=parseFloat(el.value)||0;
   else a[f]=el.value;
   paint();scheduleSave();status('Cập nhật đối tác · '+(a.name||''));};
  el.onchange=h;});
 document.querySelectorAll('[data-rtab]').forEach(b=>b.onclick=()=>{RTAB=b.dataset.rtab;paint();scheduleSave();});
 document.querySelectorAll('[data-in]').forEach(el=>el.onchange=()=>{
  pushUndo();IN[el.dataset.in][+el.dataset.mi]=parseFloat(el.value)||0;paint();scheduleSave();
  status('Cập nhật '+el.dataset.in+' · '+FM[+el.dataset.mi]);});
 document.querySelectorAll('[data-aq]').forEach(el=>el.onchange=()=>{
  pushUndo();const v=el.value===''?null:parseFloat(el.value);
  AQ[el.dataset.aq][+el.dataset.mi]=(v===null||isNaN(v))?null:v;paint();scheduleSave();
  status('Cập nhật số lượng · '+AM[+el.dataset.mi]);});
 const B=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn;};
 B('btnSave',()=>{saveLocal();status('Đã lưu vào trình duyệt');});
 B('btnExport',exportJSON); B('btnCSV',exportCSV); B('btnClear',clearLocal);
 B('btnImport',()=>document.getElementById('fileIn').click());
 const f=document.getElementById('fileIn');
 if(f)f.onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value='';};
}
const UNDO=[];
const snapshot=()=>JSON.stringify({IN:IN,AQ:AQ,ACCS:ACCS,PACC:PACC,PIPE:PIPE,CSSL:CSSL});
function pushUndo(){UNDO.push(snapshot());if(UNDO.length>60)UNDO.shift();syncUndo();}
function syncUndo(){const b=document.getElementById('undoBtn');b.textContent='↩ Undo ('+UNDO.length+')';b.disabled=!UNDO.length;}
document.getElementById('undoBtn').onclick=()=>{if(!UNDO.length)return;
 const s=JSON.parse(UNDO.pop());IN=s.IN;AQ=s.AQ;if(s.ACCS)ACCS=s.ACCS;if(s.PACC)PACC=s.PACC;if(s.PIPE)PIPE=s.PIPE;if(s.CSSL)CSSL=s.CSSL;syncUndo();paint();scheduleSave();status('Đã hoàn tác','warn');};
document.getElementById('resetBtn').onclick=()=>{
 if(!confirm('Đưa mọi ô về mốc ban đầu?\n\nMất: số plan đã sửa VÀ số lượng đã điền cho tháng actual.\nGiữ: lịch sử undo, lựa chọn tháng, bản lưu sẽ được ghi đè sau 0.6s.'))return;
 pushUndo();Object.keys(DEF).forEach(k=>IN[k]=DEF[k].v.slice());
 Object.keys(AQDEF).forEach(k=>AQ[k]=a7(null));ACCS=PTN_ACC0.map(a=>({name:a.name,type:a.type,unit:a.unit,ev:a.ev,com:a.com,qty:a.qty.slice(),price:a.price.slice(),contrib:(a.unit==='user'?'stock':'none')}));paint();scheduleSave();status('Đã về mốc ban đầu','warn');};
let stT;
function status(msg,kind='ok'){const p=document.getElementById('statusPill');
 p.className='pill-st on '+kind;p.textContent=msg;clearTimeout(stT);stT=setTimeout(()=>p.classList.remove('on'),4000);}
document.getElementById('tgPanel').onclick=()=>document.getElementById('shell').classList.toggle('collapsed');
/* ===== Kéo giãn ranh giới =====
   Trước v0.9.3: gripR ghi thẳng style.gridTemplateColumns nên đè lên --panelw,
   khiến gripL mất tác dụng sau lần kéo đầu. Nay mỗi tay nắm ghi một biến riêng.
   Dải kéo cũng chỉ 6px và nằm sát thanh cuộn panel nên gần như không bấm trúng. */
const DEFW={panel:'20%',mid:'1fr'};
function setW(v,val){document.documentElement.style.setProperty(v,val);}
function shellBox(){return document.getElementById('shell').getBoundingClientRect();}
function panelW(){return document.getElementById('panel').offsetWidth;}
function drag(g,move){
 const start=e=>{
  e.preventDefault();
  g.classList.add('dragging');document.body.classList.add('resizing');
  const mv=ev=>move(ev.clientX);
  const up=()=>{g.classList.remove('dragging');document.body.classList.remove('resizing');
   document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
   document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',up);
   scheduleSave();};
  const tm=ev=>{if(ev.touches&&ev.touches[0])move(ev.touches[0].clientX);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',up);
 };
 g.onmousedown=start;
 g.ontouchstart=start;
 g.onkeydown=e=>{                      /* bàn phím: mũi tên trái/phải */
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();
  const box=shellBox(),d=(e.key==='ArrowLeft'?-24:24);
  move((g.id==='gripL'?panelW():panelW()+12+document.getElementById('mid').offsetWidth)+box.left+d);
 };
}
drag(document.getElementById('gripL'),x=>{
 const box=shellBox();
 const w=Math.max(160,Math.min(x-box.left,box.width*0.5));
 setW('--panelw',w+'px');
});
drag(document.getElementById('gripR'),x=>{
 const box=shellBox(),pw=panelW();
 const maxMid=Math.max(240,box.width-pw-24-260);
 const mw=Math.max(240,Math.min(x-box.left-pw-12,maxMid));
 setW('--midw',mw+'px');
});
document.getElementById('gripL').ondblclick=()=>{setW('--panelw',DEFW.panel);scheduleSave();status('Về bề rộng mặc định');};
document.getElementById('gripR').ondblclick=()=>{setW('--midw',DEFW.mid);scheduleSave();status('Về bề rộng mặc định');};

/* ===== khởi động ===== */
const boot=loadLocal();
paint();syncUndo();
if(boot.found){setSaveInfo(boot.at?('Đã lưu · '+new Date(boot.at).toLocaleString('vi-VN')):'Đã nạp bản lưu');
 status(boot.msg,boot.old?'warn':'ok');}
else{setSaveInfo('Chưa có bản lưu');
 status('Chọn nhiều tháng nhập để đặt actual cạnh plan làm baseline','warn');}
