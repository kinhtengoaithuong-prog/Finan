<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title id="docTitle">SBH Own channel — mạch vận hành FY2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wght@600;700&family=Outfit:wght@400;600;800&family=DM+Mono:wght@400;500&display=swap&subset=vietnamese" rel="stylesheet">
<style>
:root{
  --ink:#16201C;--muted:#6a746e;--line:#e3e8e4;--card:#fff;--bg:#f4f6f4;
  --own:#0B5D4B;--neg:#B3402E;--soft:#eaf3ef;--warn:#8a5a12;--warnbg:#fff9e8;
  --derived:#5146A6;--derbg:#eeecf8;--imp:#1e5a8a;--impbg:#e6eff7;--alloc:#77817a;
  --panelw:20%;--midw:1fr;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Outfit',system-ui,sans-serif;font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button,input,select{font-family:inherit}
.top{flex:0 0 auto;background:var(--card);border-bottom:1px solid var(--line);padding:9px 16px;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
h1{font-family:'Noto Serif Display',Georgia,serif;font-size:16px;font-weight:700;margin:0}
.badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--own);border-radius:999px;padding:2px 8px}
.stamp{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted)}
.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:7px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer}
.btn:hover{border-color:var(--own);color:var(--own)}
.btn:focus-visible{outline:none;border-color:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.2)}
.btn.on{background:var(--own);border-color:var(--own);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}
.pill-st{font-size:11px;font-weight:800;border-radius:999px;padding:3px 10px;opacity:0;transition:opacity .2s}
.pill-st.on{opacity:1}
.pill-st.ok{background:var(--soft);color:var(--own)}
.pill-st.warn{background:var(--warnbg);color:var(--warn)}

/* ===== 20 | 40 | 40 ===== */
#shell{flex:1 1 auto;display:grid;grid-template-columns:var(--panelw) 12px var(--midw) 12px 1fr;min-height:0}
/* LỖI trước: khi ẩn bớt cột bằng display:none, các phần tử còn lại bị grid
   TỰ ĐỘNG xếp lại từ cột 1 — mà cột 1 đang khai 0px. #mid và #right rơi vào
   track rộng 0 nên màn hình trắng. Cách chữa: khai lại đúng số track còn dùng,
   và chỉ định grid-column tường minh cho phần tử còn hiện. */
#shell.collapsed{grid-template-columns:var(--midw) 12px 1fr}
#shell.collapsed #gripL{display:none}
#shell.collapsed #mid{grid-column:1}
#shell.collapsed #gripR{grid-column:2}
#shell.collapsed #right{grid-column:3}
/* Chế độ P&L toàn màn hình — ẩn panel trái và vùng nhập giữa */
#shell.focus{grid-template-columns:1fr}
#shell.focus #panel,#shell.focus #mid,#shell.focus .grip{display:none}
#shell.focus #right{grid-column:1}
#shell.focus #right{padding:12px 18px}
#shell.focus .plscroll{max-height:calc(100vh - 128px)}
/* Ẩn RIÊNG vùng nhập, giữ panel trái */
#shell.nomid{grid-template-columns:var(--panelw) 12px 1fr}
#shell.nomid #mid,#shell.nomid #gripR{display:none}
#shell.nomid #panel{grid-column:1}
#shell.nomid #gripL{grid-column:2}
#shell.nomid #right{grid-column:3}
#shell.nomid.collapsed{grid-template-columns:1fr}
#shell.nomid.collapsed #right{grid-column:1}
.btn.focuson{background:var(--own);border-color:var(--own);color:#fff}
.focus-hint{font-size:11px;color:var(--muted);margin-left:auto;font-style:italic}
.pane{min-height:0;overflow:auto;padding:12px}
#panel{background:var(--card);border-right:1px solid var(--line)}
#shell.collapsed #panel{display:none}
.grip{background:var(--bg);cursor:col-resize;position:relative;touch-action:none;
  display:flex;align-items:center;justify-content:center}
.grip::after{content:'';width:4px;height:44px;border-radius:3px;background:#cfd8d2;
  transition:background .12s,height .12s}
.grip:hover::after{background:var(--own);height:72px}
.grip.dragging::after{background:var(--own);height:100%;border-radius:0}
.grip:focus-visible{outline:none}
.grip:focus-visible::after{background:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.25)}
body.resizing{cursor:col-resize;user-select:none;-webkit-user-select:none}
body.resizing *{cursor:col-resize!important}
#mid{background:var(--bg)}
#right{background:var(--bg)}

.dbanner{border-radius:9px;padding:9px 11px;margin-bottom:12px;font-size:11.5px;line-height:1.45}
.dbanner.ok{background:var(--soft);border-left:3px solid var(--own);color:#2b4a3f}
.dbanner.warnsrc{background:#fff9e8;border-left:3px solid var(--warn);color:#5c4410}
.dbanner.empty{background:var(--warnbg);border-left:3px solid var(--warn);color:#5c4410}
.dbanner .dv{display:block;color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;margin-top:3px}
.dbanner .btn{margin-top:7px}
.dbanner code{font-family:'DM Mono',monospace;background:#fff;padding:0 4px;border-radius:4px}
.pt{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px}
.pt:first-child{margin-top:0}
.mchk{display:flex;align-items:center;gap:7px;padding:3px 0;font-size:12px;font-variant-numeric:tabular-nums}
.mchk input{accent-color:var(--own)}
.mchk .tag{font-size:9px;font-weight:800;border-radius:5px;padding:0 5px;margin-left:auto}
.tag.a{background:#f1f3f1;color:#8b948d}.tag.p{background:var(--soft);color:var(--own)}
.pbtns{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.pbtns .btn{font-size:11px;padding:3px 8px}

/* zones */
.zone{background:var(--card);border:1px solid var(--line);border-radius:11px;margin-bottom:11px;overflow:hidden}
.zh{display:flex;align-items:baseline;gap:8px;padding:9px 13px;background:#f7faf8;border-bottom:1px solid var(--line)}
.zn{font-family:'DM Mono',monospace;font-size:10.5px;font-weight:500;color:#fff;background:var(--own);border-radius:5px;padding:1px 7px}
.zt{font-family:'Noto Serif Display',Georgia,serif;font-size:14px;font-weight:600}
.zs{font-size:11px;color:var(--muted);margin-left:auto;text-align:right;max-width:52%}
.zb{padding:9px 13px}
.row{display:grid;grid-template-columns:1fr 104px 74px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px dashed #eef1ee}
.row:last-child{border-bottom:none}
.row.out{background:var(--derbg);margin:3px -13px;padding:6px 13px;border-bottom:none}
.row.out .lb{color:var(--derived);font-weight:800}
.row.imp{background:var(--impbg);margin:3px -13px;padding:6px 13px;border-bottom:none}
.row.imp .lb{color:var(--imp);font-weight:800}
.row.flagged .lb::after{content:' ⚑';color:var(--warn)}
.lb{font-size:12px}
.lb small{display:block;color:var(--muted);font-size:10.5px}
input.num{width:100%;text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px;padding:4px 7px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink)}
input.num:focus{outline:none;border-color:var(--own);box-shadow:0 0 0 3px rgba(11,93,75,.18)}
input.num.empty{background:#fbfbfa;border-style:dashed}
.unit{font-size:11px;color:var(--muted)}
.val{text-align:right;font-family:'DM Mono',monospace;font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.val.neg{color:var(--neg)}
.val.chained{color:var(--imp);background:var(--impbg);border-radius:6px;padding:4px 7px}
.val.na{color:#b6bdb8}
.prop{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:4px;font-size:10px;padding:0 4px;cursor:pointer}
.prop:hover{border-color:var(--own);color:var(--own)}
.warnbox{background:var(--warnbg);border-left:3px solid var(--warn);border-radius:0 7px 7px 0;padding:8px 11px;margin:7px 0;font-size:11.5px;color:#5c4410}
.warnbox b{color:var(--warn)}
.infobox{background:var(--impbg);border-left:3px solid var(--imp);border-radius:0 7px 7px 0;padding:8px 11px;margin:7px 0;font-size:11.5px;color:#1b3d5c}
.infobox b{color:var(--imp)}

/* P&L wide */

/* v0.4 — lưới nhiều tháng + tab phải */
.cnt{background:var(--own);color:#fff;border-radius:999px;padding:0 6px;font-size:9.5px;margin-left:5px}
.zrow{display:grid;gap:7px;align-items:center;padding:4px 0;border-bottom:1px dashed #eef1ee}
.zrow:last-child{border-bottom:none}
.zrow.zhead{border-bottom:1.5px solid var(--ink);padding-bottom:5px;position:sticky;top:0;background:var(--card);z-index:2}
.zrow.out{background:var(--derbg);margin:3px -13px;padding:5px 13px;border-bottom:none}
.zrow.out .lb{color:var(--derived);font-weight:800}
.zrow.big .lb{font-weight:800}
.zrow.flagged .lb::after{content:' ⚑';color:var(--warn)}
.cell{min-width:0}
.cell.na{text-align:right;color:#c3ccc6;font-family:'DM Mono',monospace;font-size:12px}
.cell .val{text-align:right}
.cell .val.imp{color:var(--imp)}
.mh{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--own);text-align:right}
.mh.a{color:#8b948d}
.rtabs{display:flex;align-items:center;gap:6px;padding:8px 12px;background:var(--soft);border-bottom:1px solid var(--line)}
.rtab{border:1px solid transparent;background:transparent;color:var(--muted);font-weight:800;font-size:12.5px;padding:4px 11px;border-radius:7px;cursor:pointer}
.rtab:hover{color:var(--own)}
.rtab.on{background:var(--own);color:#fff}
.rtab:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(11,93,75,.25)}
.tabsub{display:block;font-size:9.5px;font-weight:400;opacity:.75;margin-top:1px}
.rtab{line-height:1.25}
.rmeta{margin-left:auto;font-size:11px;color:var(--muted)}
.filekinds{font-size:10.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.filekinds b{color:var(--ink);display:block;margin-bottom:3px}
.filekinds div{margin-top:3px}
.fk{display:inline-block;font-weight:800;color:var(--own);background:var(--soft);border-radius:5px;padding:0 5px;margin-right:4px}
.saveinfo{font-family:'DM Mono',monospace;font-size:10.5px;color:var(--muted);padding:6px 0 0}
.dbtns{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.dbtns .btn{font-size:11px;padding:4px 6px;text-align:center}
.dbtns .btn.wide{grid-column:1/-1}
.seghead .zh{background:var(--soft)}
.zrow.cmrow{background:#e6efe9;border-top:2px solid var(--own);border-bottom:2px solid var(--own);margin:3px -13px;padding:6px 13px}
.zrow.cmrow .lb{font-weight:800;color:var(--own)}
.acctbl{overflow-x:auto}
table.acc{border-collapse:collapse;font-size:11px;min-width:100%}
table.acc th{background:var(--ink);color:#fff;padding:4px 5px;font-size:9.5px;text-transform:uppercase;white-space:nowrap}
table.acc tr.sub td{background:#4a544e;color:#fff;font-size:9px;padding:2px 5px;text-align:center}
table.acc td{padding:3px 4px;border-bottom:1px solid #f2f5f2;white-space:nowrap}
table.acc td.rl{min-width:120px}
table.acc td.rev{text-align:right;font-family:'DM Mono',monospace;font-weight:800;color:var(--own)}
table.acc input.txt{width:118px;font-size:11px;padding:3px 5px;border:1px solid var(--line);border-radius:5px}
table.acc input.num.sm{width:62px;font-size:11px;padding:3px 4px}
table.acc select{font-size:10.5px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;background:#fff}
table.acc td.warncell{background:var(--warnbg)}
table.acc tr.badrow td{background:#fbeeeb}
table.acc td.okchk{color:var(--own);font-weight:800;text-align:center}
table.acc td.badchk{color:var(--neg);font-weight:800;text-align:center}
table.acc td.rl small{display:block;font-size:9.5px;color:var(--muted);font-style:italic}
.zrow.chkrow{background:#f7faf8;border-top:1px dashed var(--line);margin:3px -13px;padding:6px 13px;font-size:11.5px}
.zrow.chkrow .val.okchk{color:var(--own);font-weight:800}
.zrow.chkrow .val.badchk{color:var(--neg);font-weight:800}
table.pl td.okchk{color:var(--own);font-weight:800}
table.pl td.t.badchk{font-size:10px;white-space:normal;line-height:1.3}
table.pl td.badchk{color:var(--neg);font-weight:800;background:#fbeeeb}
table.pl tr.chk td{background:#f7faf8;font-size:10.5px;color:var(--muted);border-top:1px dashed var(--line)}
table.pl tr.chk td.rl{background:#f7faf8;font-style:italic}
.segbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;padding:7px 12px;background:#f7faf8;border-bottom:1px solid var(--line)}
.sblab{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:3px}
.sbsp{flex:1}
.chip{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:3px 11px;
 font-size:11.5px;font-weight:800;cursor:pointer}
.chip:hover{border-color:var(--own);color:var(--own)}
.chip:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(11,93,75,.25)}
.chip.on{background:var(--own);border-color:var(--own);color:#fff}
.chip i{font-style:normal;font-size:9px;opacity:.7;margin-left:4px}
.chip.q{border-style:dashed;font-weight:600}
.rfoot{padding:8px 12px;font-size:11px;color:var(--muted);border-top:1px solid var(--line);background:#fbfcfb}
.plwrap{background:var(--card);border:1.5px solid var(--own);border-radius:11px;overflow:hidden}
.plh{padding:9px 13px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:9px}
.plh .t{font-family:'Noto Serif Display',Georgia,serif;font-size:14px;font-weight:600}
.plh .s{font-size:11px;color:var(--muted);margin-left:auto}
.plscroll{overflow:auto;max-height:calc(100vh - 150px)}
table.pl{border-collapse:separate;border-spacing:0;width:100%;font-size:11.5px}
table.pl th,table.pl td{padding:4px 7px;text-align:right;white-space:nowrap;font-family:'DM Mono',monospace;font-variant-numeric:tabular-nums;border-bottom:1px solid #f2f5f2}
table.pl th{background:var(--ink);color:#fff;font-size:9.5px;font-weight:800;text-transform:uppercase;position:sticky;top:0;z-index:3}
table.pl th.a{background:#4a544e}
table.pl th.t{background:var(--own)}
table.pl .rl{text-align:left;font-family:'Outfit',sans-serif;position:sticky;left:0;background:var(--card);z-index:2;min-width:190px;border-right:1px solid var(--line)}
table.pl th.rl{background:var(--ink);z-index:4}
table.pl td.a{background:#f7f8f7;color:#5f6a63}
table.pl td.t{background:var(--soft);font-weight:800}
table.pl tr.g.grpx td{background:#eaf1eb}
table.pl tr.g.grpx td.rl{background:#eaf1eb;cursor:default}
table.pl tr.g.grpx td{font-family:'DM Mono',monospace;font-weight:800;color:var(--own);font-size:11px;text-transform:none}
.xdel{font-size:11px;padding:1px 6px;color:var(--neg)}
.xdel:hover{border-color:var(--neg);color:var(--neg)}
.gtog{border:1px solid var(--line);background:#fff;color:var(--own);border-radius:5px;font-size:10px;
 width:18px;height:18px;line-height:1;cursor:pointer;margin-right:7px;padding:0}
.gtog:hover{border-color:var(--own);background:var(--soft)}
.gtog:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(11,93,75,.25)}
.gn{font-weight:400;color:var(--muted);font-size:10px;margin-left:7px;font-family:'Outfit',sans-serif;text-transform:none}
table.pl tr.g td{background:#f1f5f2;font-weight:800;color:var(--own);font-size:10px;text-transform:uppercase}
table.pl tr.g td.rl{background:#f1f5f2}
table.pl tr.cm td{background:var(--soft);font-weight:800}
table.pl tr.cm td.rl{background:var(--soft)}
table.pl tr.op td{background:#e6efe9;font-weight:800;border-top:2px solid var(--own);border-bottom:2px solid var(--own)}
table.pl tr.op td.rl{background:#e6efe9}
table.pl tr.aft td{color:var(--alloc)}
table.pl tr.sub2 td{color:var(--muted);font-size:10.5px}
table.pl tr.base td{background:var(--derbg);font-weight:800;color:var(--derived);border-top:1.5px solid var(--derived)}
table.pl tr.base td.rl{background:var(--derbg)}
.neg{color:var(--neg)}
td.na{color:#c3ccc6}


@media(max-width:1020px){#shell,#shell.collapsed{display:block}#panel{border-right:none;border-bottom:1px solid var(--line)}.grip{display:none}.pane{overflow:visible}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Quy tắc trình bày thống nhất: số âm luôn đỏ =====
   Đặt cuối bảng style và dùng !important vì các luật trước đó
   (td.a cột actual xám, tr.aft tầng phân bổ, .val.imp, .val.chained)
   có độ ưu tiên cao hơn class .neg nên trước đây nuốt mất màu đỏ. */
table.pl td.neg, table.pl tr.cm td.neg, table.pl tr.op td.neg,
table.pl tr.aft td.neg, table.pl tr.sub2 td.neg, table.pl td.a.neg, table.pl td.t.neg{color:var(--neg)!important}
.val.neg, .cell .val.neg, .cell .val.imp.neg, .lad-row.after .lcell .val.neg{color:var(--neg)!important}
table.acc td.rev.neg{color:var(--neg)!important}

/* ===== Dải màu cho vùng RECONCILE — tách khỏi P&L chính =====
   P&L chính dùng xanh lá; reconcile dùng tím để mắt biết ngay đây là
   phần đối chiếu, không phải dòng P&L mới. */
table.pl tr.recrow td{background:#f5f3fb!important;border-left:none}
table.pl tr.recrow td.rl{background:#f5f3fb!important;box-shadow:inset 3px 0 0 #b9b0e0}
table.pl tr.recrow td.a{background:#f1eff8!important}
table.pl tr.g.recrow td{background:#e9e4f6!important;color:#4a3f8f!important;font-family:'Outfit',sans-serif;
 font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
table.pl tr.g.recrow td.rl{background:#e9e4f6!important;box-shadow:inset 3px 0 0 #7c6fc0}
table.pl tr.recrow.cm td{background:#ece8f8!important;font-weight:800;color:#4a3f8f}
table.pl tr.recrow.cm td.rl{background:#ece8f8!important}
table.pl tr.recrow.chk td{background:#faf9fd!important;color:#8b84ab}
table.pl tr.recrow.chk td.rl{background:#faf9fd!important}
table.pl tr.recrow td.neg{color:var(--neg)!important}
table.pl tr.recrow td.okchk{color:var(--own)!important}
table.pl tr.recrow td.badchk{color:var(--neg)!important;background:#fbeeeb!important}
</style>
</head>
<body>
<header class="top">
  <button class="btn" id="tgPanel" title="Ẩn/hiện panel trái">☰</button>
  <h1>Finan — mạch vận hành toàn công ty</h1>
  <span class="badge" id="verBadge"></span>
  <span class="stamp" id="relStamp"></span>
  <span class="sp"></span>
  <button class="btn" id="tgMid" title="Ẩn/hiện vùng nhập liệu ở giữa">▥ Vùng nhập</button>
  <button class="btn" id="tgFocus" title="Ẩn panel và vùng nhập để xem P&amp;L toàn màn hình · Esc để thoát">⛶ P&amp;L toàn màn hình</button>
  <button class="btn" id="undoBtn" disabled>↩ Undo (0)</button>
  <button class="btn" id="btnSave">💾 Lưu</button>
  <button class="btn" id="resetBtn">Về mốc ban đầu</button>
  <input type="file" id="fileIn" accept=".json,application/json" style="display:none">
  <span class="pill-st" id="statusPill"></span>
</header>
<div id="shell">
  <div class="pane" id="panel"></div>
  <div class="grip" id="gripL" tabindex="0" role="separator" aria-orientation="vertical" title="Kéo để đổi bề rộng · nhấp đúp để về mặc định"></div>
  <div class="pane" id="mid"></div>
  <div class="grip" id="gripR" tabindex="0" role="separator" aria-orientation="vertical" title="Kéo để đổi bề rộng · nhấp đúp để về mặc định"></div>

  const pre={OWN:engOwn(i,{baseAvg:0,renewed:sh.renewed,react:sh.react}),PTN:engPtn(i,sh),HLB:engHlb(i,sh)};

  sh.baseEnd=sh.baseStart+sh.newUsers-sh.churned+sh.react;   /* riêng kênh trực tiếp */

     Lỗi trước: opening lấy base kênh trực tiếp, closing lấy base tổng → hụt đúng

  sh.stockPrev=(i===0)?sh.stockUsers:out[i-1].sh.stockUsers;

  const ch={OWN:chAgg(engOwn(i,sh)),PTN:chAgg(engPtn(i,sh)),HLB:chAgg(engHlb(i,sh))};

 sh.impAOV=(sh.paying)?AL('OWN','1.1 Revenue_Software',i)/sh.paying:null;
 return sh;
}

function engDir(i,sh){
 const o={ch:'DIR'};
 o.custStart=sh.baseStart;
 o.newAdds=g('d_grossNewAdds',i);
 o.churned=o.custStart*g('d_churnPct',i)/100;
 o.custEnd=o.custStart+o.newAdds-o.churned;
 o.custAvg=(o.custStart+o.custEnd)/2;
 o.newUsers=o.newAdds; o.churnOut=o.churned;
 o['1.1']=sh.custAvg*g('d_blendedARPA',i);
 o['1.5']=sh.custAvg*g('d_arpuToken',i);
 o['3.5']=-o['1.5']*g('d_cogsTokenPct',i)/100;
 o['4.2']=-(o['1.1']+o['1.5'])*g('d_commissionPct',i)/100;
 o['5.3']=-g('d_perfMkt',i); o['6.5']=-g('d_payMkt',i);
 return o;
}
function engPpn(i,sh){
 const o={ch:'PPN'};
 /* Gồm cả deal theo gói lẫn pipeline outsource — cùng một loại: giá trị × % chia sẻ */
 o['1.3']=PACC.reduce((a,x)=>a+accRev(x,i),0);
 o['4.4']=-PACC.reduce((a,x)=>a+accRev(x,i)*((Number(x.share)||0)/100),0);
 /* 5.5 và 6.2 phục vụ kênh đối tác nên thuộc segment này, không thuộc Direct */
 o['5.5']=-g('d_ptnMkt',i);
 o['6.2']=-g('d_payBD',i);
 o.newUsers=PACC.reduce((a,x)=>a+(x.contrib==='flow'?(Number(x.qty[i])||0):0),0);
 o.stockUsers=PACC.reduce((a,x)=>a+(x.contrib==='stock'?(Number(x.qty[i])||0):0),0);
 return o;
}
function engLen(i,sh){

 o.disb=g('l_newBorrowers',i)*g('l_disbPer',i);

function calcCSS(){
 const out=[];
 for(let i=0;i<nF;i++){
  const per=CSSL.map(x=>{const gr=Number(x.g[i])||0;
    const o=gr*(Number(x.own)||0)/100, b=gr*(Number(x.bu3)||0)/100;
    return {k:x.k,l:x.l,gross:gr,to12:o,to3:b,keep:gr-o-b};});
  const S=f=>per.reduce((a,x)=>a+x[f],0);
  const rev=CSSREV.reduce((a,r)=>a+(Number(r.val[i])||0),0);
  /* OP tại CSS TRƯỚC khi đẩy chi phí đi = doanh thu − chi phí gross */
  const opGross=rev-S('gross');
  /* OP CÒN LẠI ở CSS sau khi phân bổ chi phí về hai BU */
  const opKeep=rev-S('keep');
  const sh={gross:-S('gross'), to12:S('to12'), to3:S('to3'), keep:-S('keep'),
    rev:rev, opGross:opGross, opKeep:opKeep, platform:0, alloc:0, per:per, revper:CSSREV.map((r,ri)=>({i:ri,name:r.name,v:Number(r.val[i])||0}))};
  sh.channelCM=opKeep;
  const ch={CSSC:{ch:'CSSC',rev:rev,disc:0,direct:-S('keep'),
    channelCM:opKeep, gross:-S('gross'), to12:S('to12'), to3:S('to3'), keep:-S('keep'),
    opGross:opGross, opKeep:opKeep}};
  out.push({sh:sh,ch:ch,bu:{channelCM:opKeep,platform:0,opBefore:opKeep,
    alloc:0,opAfter:opKeep,rev:rev,disc:0,direct:-S('keep')}});
 }
 return out;
}
/* Số phân bổ mà BU12 / BU3 nhận — LẤY TỪ CSS, không còn gõ tay */
function allocFromCSS(i,which){const c=calcCSS()[i];return -(which==='12'?c.sh.to12:c.sh.to3);}

/* Actual CSS — dùng SỔ THẬT của CSS, không suy ngược.
   gross  : 7.x của CSS khi TẮT phân bổ  (chi phí phát sinh tại CSS)
   keep   : 7.x của CSS khi BẬT phân bổ  (phần CSS còn giữ)
   to12/3 : 7.x mà hai BU đã NHẬN, lấy từ sổ của chính hai BU
   Ba nguồn độc lập → dòng kiểm là phép đối chiếu thật, không phải phép cộng vòng. */
function actCSS(i){
 const A=(ACTS.__CSS||{});
 const gL=A.gross||{}, kL=A.keep||{}, rL=A.rev||{};
 const S=o=>Object.keys(o).length?Object.keys(o).reduce((a,k)=>a+((o[k]&&o[k][i])||0),0):null;
 const gross=S(gL), keep=S(kL), rev=S(rL);
 const per=CSSL.map(x=>{
   const key=Object.keys(gL).filter(k=>k.indexOf(x.k+' ')===0||k===x.l)[0];
   const g=key?(gL[key][i]||0):null;
   return {k:x.k,l:x.l,gross:(g===null?null:-g),to12:null,to3:null,keep:null};});
 const g12=CH.reduce((a,c)=>a+Object.keys(ACTS[c]||{}).filter(k=>k.indexOf('7.')===0)
   .reduce((t,k)=>t+((ACTS[c][k]&&ACTS[c][k][i])||0),0),0);
 const g3=CH3.reduce((a,c)=>a+Object.keys(ACTS3[c]||{}).filter(k=>k.indexOf('7.')===0)
   .reduce((t,k)=>t+((ACTS3[c][k]&&ACTS3[c][k][i])||0),0),0);
 const sh={gross:gross, to12:-g12, to3:-g3, keep:keep, rev:rev,
   opGross:(rev===null||gross===null)?null:rev+gross,
   opKeep:(rev===null||keep===null)?null:rev+keep,
   platform:0, alloc:0, per:per,
   revper:Object.keys(rL).map((k,ri)=>({i:ri,name:k,v:rL[k][i]||0}))};
 const ch={CSSC:{ch:'CSSC',rev:rev,disc:0,direct:keep,channelCM:sh.opKeep,
   gross:gross,to12:-g12,to3:-g3,keep:keep,opGross:sh.opGross,opKeep:sh.opKeep}};
 return {sh:sh,ch:ch,bu:{channelCM:sh.opKeep,platform:0,opBefore:sh.opKeep,
   alloc:0,opAfter:sh.opKeep,rev:rev,disc:0,direct:keep}};
}

function calcBU3(){
 const out=[];
 for(let i=0;i<nF;i++){
  const sh={};
  sh.baseStart=(i===0)?g('d_custBaseline',i):out[i-1].sh.baseEnd;
  sh.vpbOpen=(i===0)?g('v_cardsOpen',i):out[i-1].ch.VPB.cardsEnd;   /* tồn thẻ nối chuỗi */
  const pre={}; CH3.forEach(c=>pre[c]=ENG3[c](i,{baseStart:sh.baseStart,custAvg:0,vpbOpen:sh.vpbOpen}));
  sh.newUsers=CH3.reduce((a,c)=>a+(pre[c].newUsers||0),0);
  sh.churned=pre.DIR.churnOut||0;
  sh.baseEnd=sh.baseStart+sh.newUsers-sh.churned;
  sh.stockUsers=CH3.reduce((a,c)=>a+(pre[c].stockUsers||0),0);
  sh.baseTotal=sh.baseEnd+sh.stockUsers;
  sh.stockPrev=(i===0)?sh.stockUsers:out[i-1].sh.stockUsers;
  sh.dStock=sh.stockUsers-sh.stockPrev;
  sh.openTotal=(i===0)?(sh.baseStart+sh.stockUsers):out[i-1].sh.baseTotal;
  sh.custAvg=(sh.openTotal+sh.baseTotal)/2;
  sh.baseAvg=sh.custAvg; sh.react=0; sh.renewed=0;
  sh.payingPartner=sh.stockUsers;
  sh.payingDirect=sh.baseEnd;
  sh.paying=sh.baseEnd+sh.stockUsers;
  const ch={}; CH3.forEach(c=>ch[c]=chAgg(ENG3[c](i,sh)));
  sh.cloud=-g('s3_platform',i); sh.payCS=-g('s3_payCS',i);
  sh.payProduct=-g('s3_payProduct',i); sh.payTech=-g('s3_payTech',i);
  sh.platform=sh.cloud+sh.payCS+sh.payProduct+sh.payTech;
  sh.alloc=allocFromCSS(i,'3');    /* nối từ CSS — không còn gõ tay */
  const sumCM=CH3.reduce((a,c)=>a+ch[c].channelCM,0);
  out.push({sh:sh,ch:ch,bu:{channelCM:sumCM,platform:sh.platform,opBefore:sumCM+sh.platform,
    alloc:sh.alloc,opAfter:sumCM+sh.platform+sh.alloc,
    rev:CH3.reduce((a,c)=>a+ch[c].rev,0),disc:CH3.reduce((a,c)=>a+ch[c].disc,0),
    direct:CH3.reduce((a,c)=>a+ch[c].direct,0)}});
 }
 return out;
}
function actBU3(i){
 const ch={}; CH3.forEach(c=>{
  const A=ACTS3[c]||{}; const L=(k)=>(A[k]&&A[k][i])||0;
  const o={ch:c};
  o['1.1']=L('1.1 Revenue_Software');o['1.2']=L('1.2 Revenue_Hardware');o['1.3']=L('1.3 Revenue_Service');
  o['1.4']=L('1.4 Revenue_Accounting Svc');o['1.5']=L('1.5 Revenue_AI Token');
  o['1.6']=L('1.6 Interest income');o['1.7']=L('1.7 Revenue_Embedded Finance');
  o['2.1']=L('2.1 Sale discount');o['2.2']=L('2.2 Sale promotion');
  o['3.2']=L('3.2 COGS_Hardware');o['3.4']=L('3.4 COGS_Accounting Svc');o['3.5']=L('3.5 COGS_AI Token');
  o['3.6']=L('3.6 COGS_Funding cost');o['3.7']=L('3.7 COGS_Provision');
  o['4.1']=L('4.1 Staff cost — Salary');o['4.2']=L('4.2 In-house commission');
  o['4.3']=L('4.3 Partner commission');o['4.4']=L('4.4 Direct cost (commission/partner/sharing/kickback)');
  o['5.1']=L('5.1 Brand / Comms');o['5.3']=L('5.3 Performance Marketing');o['5.5']=L('5.5 Partnership Marketing');
  o['6.2']=L('6.2 Staff - BD & Partnership');o['6.5']=L('6.5 Staff - Marketing');
  ch[c]=chAgg(o);});
 const A=ACTS3.DIR||{},L=k=>(A[k]&&A[k][i])||0;
 const sh={cloud:L('3.1 COGS_Software'),payCS:L('6.1 Staff - Customer Operation'),
   payProduct:L('6.3 Staff - Product Development'),payTech:L('6.4 Staff - Technology')};
 sh.platform=sh.cloud+sh.payCS+sh.payProduct+sh.payTech;
 sh.alloc=Object.keys(A).filter(k=>k.indexOf('7.')===0).reduce((t,k)=>t+L(k),0);
 ['baseStart','baseEnd','baseTotal','baseAvg','newUsers','churned','stockUsers','paying','custAvg']
   .forEach(k=>sh[k]=null);
 const sumCM=CH3.reduce((a,c)=>a+ch[c].channelCM,0);
 return {sh:sh,ch:ch,bu:{channelCM:sumCM,platform:sh.platform,opBefore:sumCM+sh.platform,
   alloc:sh.alloc,opAfter:sumCM+sh.platform+sh.alloc,
   rev:CH3.reduce((a,c)=>a+ch[c].rev,0),disc:CH3.reduce((a,c)=>a+ch[c].disc,0),
   direct:CH3.reduce((a,c)=>a+ch[c].direct,0)}};
}

function cellFor(m,r){
 const act=isActM(m), i=idxOf(m), D=dataFor(m);
 const seg=SEG, node=(seg==='SHARED')?D.sh:D.ch[seg];
 if(act){
  if(r.aq){const v=AQ[r.aq][i];
   return `<div class="cell"><input class="num${(v===null||v==='')?' empty':''}" type="number" step="any"
     data-aq="${r.aq}" data-mi="${i}" value="${v===null?'':v}" placeholder="—"></div>`;}
  if(r.ai){const v=D.sh[r.ai];
   return `<div class="cell"><div class="val imp ${v===null||v===undefined?'na':''}">${fmt(v,r.d===undefined?1:r.d)}</div></div>`;}
  const key=r.o||r.sh||r.k;
  let v=(r.sh)?D.sh[r.sh]:(node?node[r.o]:undefined);
  if(v===undefined&&r.k)return `<div class="cell na">—</div>`;
  const cls=(v===null||v===undefined)?'na':(v<0?'neg':'');
  return `<div class="cell"><div class="val ${cls}">${fmt(v,r.d===undefined?1:r.d)}</div></div>`;
 }
 if(r.k){
  const ch=CHAIN(r.k)&&i>0;
  if(ch){ /* LỖI v0.7: gọi cứng calcAll() nên tab BU3 hiện base của BU12. Phải theo BU đang chọn. */
   const P=curCalc()[i-1];
   const prev=(DEF[r.k]&&DEF[r.k].chainSrc==='vpbCards')?(P.ch.VPB?P.ch.VPB.cardsEnd:0):P.sh.baseEnd;
   return `<div class="cell"><div class="val chained" title="Nối từ tháng ${FM[i-1]} — không sửa được, đây là kết quả của tháng trước">${fmt(prev,0)}</div></div>`;}
  return `<div class="cell"><input class="num" type="number" step="any" data-in="${r.k}" data-mi="${i}" value="${IN[r.k][i]}"></div>`;
 }
 const v=(r.sh)?D.sh[r.sh]:(node?node[r.o]:null);
 return `<div class="cell"><div class="val ${(v===null||v===undefined)?'na':(v<0?'neg':'')}">${fmt(v,r.d===undefined?1:r.d)}</div></div>`;
}

/* ================= P&L THEO TẦNG: kênh → BU → công ty ================= */
const LINELBL={
 '1.1':'1.1 Revenue_Software','1.2':'1.2 Revenue_Hardware','1.3':'1.3 Revenue_Service',
 '1.4':'1.4 Revenue_Accounting Svc','1.5':'1.5 Revenue_AI Token','1.6':'1.6 Interest income',
 '1.7':'1.7 Revenue_Embedded Finance','2.1':'2.1 Sale discount','2.2':'2.2 Sale promotion',
 '3.1x':'3.1 COGS_Software (riêng kênh)','3.2':'3.2 COGS_Hardware','3.4':'3.4 COGS_Accounting Svc',
 '3.5':'3.5 COGS_AI Token','3.6':'3.6 COGS_Funding cost','3.7':'3.7 COGS_Provision',
 '4.1':'4.1 Staff cost — Salary','4.2':'4.2 In-house commission','4.3':'4.3 Partner commission',
 '4.4':'4.4 Direct cost — chia sẻ đối tác','5.1':'5.1 Brand / Comms',
 '5.3':'5.3 Performance Marketing','5.5':'5.5 Partnership Marketing',
 '6.2':'6.2 Staff - BD & Partnership','6.5':'6.5 Staff - Marketing'
};
/* ===== Sắp xếp & phân nhóm theo mã COA =====
   Lỗi trước: DIRK được push thêm 3.5/3.6/3.7/4.4 ở cuối khi thêm BU3,
   nên bốn dòng đó hiện sau 6.5. Nay thứ tự do mã quyết định, không do thứ tự khai. */
function coaNum(k){const s=String(k).replace(/[^0-9.]/g,'').split('.');
 return [parseInt(s[0]||'0',10), parseInt(s[1]||'0',10)];}
function coaSort(a,b){const A=coaNum(a),B=coaNum(b);return A[0]-B[0]||A[1]-B[1];}
const GRPDEF=[
 {id:'g1',pre:1,t:'1 · Doanh thu'},
 {id:'g2',pre:2,t:'2 · Chiết khấu / promotion'},
 {id:'g3',pre:3,t:'3 · Giá vốn'},
 {id:'g4',pre:4,t:'4 · Chi phí bán hàng'},
 {id:'g5',pre:5,t:'5 · Marketing'},
 {id:'g6',pre:6,t:'6 · Nhân sự trực tiếp của kênh'}
];
const ALLK=()=>REVK.concat(DISCK,DIRK).filter((v,i,a)=>a.indexOf(v)===i).sort(coaSort);
let COLL={};                       /* nhóm nào đang thu gọn */
function buildGroups(usedFn,mode){
 /* mode 'seg' → lấy từ một kênh; 'line' → cộng ngang nhiều kênh */
 const out=[];
 GRPDEF.forEach(G=>{
  const ks=ALLK().filter(k=>coaNum(k)[0]===G.pre&&usedFn(k));
  if(!ks.length)return;
  out.push({g:G.t,gid:G.id,keys:ks,mode:mode});
  /* LỖI trước: hardcode ['line',k] nên dòng con cộng MỌI kênh, không theo tập đang chọn.
     Tiêu đề nhóm dùng grpsum theo mode nên ra số khác → hai chỗ lệch nhau. */
  if(!COLL[G.id])ks.forEach(k=>out.push({l:LINELBL[k]||k,p:[mode==='seg'?'chk_':mode,k],grp:G.id}));
  if(G.pre===1)out.push({l:'Tổng doanh thu',p:[mode==='seg'?'chk_':mode,'rev'],cls:'cm'});
 });
 return out;
}
/* P&L của TẦNG CHUNG mỗi BU — trước đây tab này bỏ trống, nhưng các dòng chi phí
   chung hoàn toàn hiện được. */
function sharedRows(ms){
 const L=[{k:'cloud',l:'3.1 COGS_Software — nền tảng / cloud'},
          {k:'payCS',l:'6.1 Staff - Customer Operation'},
          {k:'payProduct',l:'6.3 Staff - Product Development'},
          {k:'payTech',l:'6.4 Staff - Technology'}];
 const rows=[{g:'Chi phí dùng chung toàn '+BULBL()+' — theo dòng',gid:'gshb',keys:L.map(x=>x.k),mode:'shb'}];
 if(!COLL.gshb)L.forEach(x=>rows.push({l:x.l,p:['shb',x.k],grp:'gshb'}));
 rows.push({l:'Cộng chi phí dùng chung',p:['shb','platform'],cls:'op'},
  {g:'Các dòng này đi đâu',rec:1},
  {l:'Trừ một lần ở tầng '+BULBL()+', không phân bổ về kênh',p:['shb','platform'],sub:1,rec:1},
  {l:'Σ Channel CM của '+BULBL(),p:['bu','channelCM'],sub:1,rec:1},
  {l:'= OP TRƯỚC PHÂN BỔ — '+BULBL(),p:['bu','opBefore'],cls:'op',rec:1},
  {l:'Chênh lệch (phải = 0)',p:['__gapBU'],d:2,cls:'chk',rec:1});
 return rows;
}
/* P&L của CSS — doanh thu + chi phí gross, rồi đối chiếu phần đẩy đi và phần còn lại */
function cssRows(ms){
 /* Dòng doanh thu: gộp danh sách khai ở plan với tên dòng có trên sổ actual,
    để tháng actual không bị mất 1.250/tháng chỉ vì plan chưa khai dòng nào. */
 const names=[];
 CSSREV.forEach(r=>{const n=r.name||('Doanh thu #'+(names.length+1));if(names.indexOf(n)<0)names.push(n);});
 ms.filter(isActM).forEach(m=>{const rp=dataFor(m).sh.revper||[];
   rp.forEach(x=>{if(x.name&&names.indexOf(x.name)<0)names.push(x.name);});});
 const rows=[];
 rows.push({g:'Doanh thu phát sinh tại CSS',gid:'gcr',keys:names,mode:'cssrevn'});
 if(!COLL.gcr){
  if(names.length)names.forEach(n=>rows.push({l:n,p:['cssrevn',n],grp:'gcr'}));
  else rows.push({l:'Chưa khai dòng doanh thu nào',p:['sh','rev'],grp:'gcr'});
 }
 rows.push({l:'Tổng doanh thu CSS',p:['sh','rev'],cls:'cm'});
 const per=CSSL.slice().sort((a,b)=>coaSort(a.k,b.k));
 rows.push({g:'Chi phí gross 7.x — toàn công ty, theo dòng',gid:'gcc',keys:per.map(x=>x.k),mode:'css7'});
 if(!COLL.gcc)per.forEach(x=>rows.push({l:x.l,p:['css7',x.k],grp:'gcc'}));
 rows.push({l:'Cộng chi phí gross',p:['css7tot'],cls:'cm'},

function applyData(D,label){
 if(!D||D.app!=='finan_mach_van_hanh')return {ok:false,msg:'File không phải bộ dữ liệu của công cụ này'};
 const rep=[];let taken=0,dropped=[];
 if(D.actuals){ACTS=D.actuals.BU12||{};ACTS3=D.actuals.BU3||{};
   if(D.actuals.CSS)ACTS.__CSS=D.actuals.CSS;taken++;}
 if(D.drivers)Object.keys(D.drivers).forEach(k=>{
   if(!DEF[k]){dropped.push('driver '+k);return;}
   const v=D.drivers[k];
   if(!Array.isArray(v)||v.length!==nF){dropped.push('driver '+k+' sai độ dài');return;}
   IN[k]=v.map(x=>Number(x)||0);taken++;});
 const T=D.tables||{};
 if(Array.isArray(T.ACCS)){ACCS=T.ACCS.map(a=>Object.assign({},a,{qty:(a.qty||a5(0)).slice(),price:(a.price||a5(0)).slice()}));taken++;}
 if(Array.isArray(T.PACC)){PACC=T.PACC.map(a=>Object.assign({},a,{qty:(a.qty||a5(0)).slice(),price:(a.price||a5(0)).slice()}));taken++;}
 /* Pipeline outsource nay là deal trong danh mục Partnership BU3.
    File cũ còn tách riêng thì dồn vào PACC: qty = 1, đơn giá = giá trị, ev = 100%. */
 if(Array.isArray(T.PIPE)&&T.PIPE.length){
   T.PIPE.forEach(p=>PACC.push({name:p.name||'Pipeline outsource',type:'Tech service',unit:'package',
     ev:100,com:0,share:Number(p.share)||0,qty:a5(1),price:(p.val||a5(0)).slice(),contrib:'none'}));
   PIPE=[];taken++;}
 if(Array.isArray(T.CSSREV)){CSSREV=T.CSSREV.map(r=>Object.assign({},r,{val:(r.val||a5(0)).slice()}));taken++;}
 if(Array.isArray(T.CSSL)&&T.CSSL.length){CSSL=T.CSSL.map(x=>Object.assign({},x,{g:(x.g||a5(0)).slice()}));taken++;}
 const missing=Object.keys(DEF).filter(k=>!D.drivers||!D.drivers[k]);
 DATA_META={label:D.label||label,dataVersion:D.dataVersion||'—',shapeVersion:D.shapeVersion,
   months:D.months,loadedFrom:label};
 const verMsg=(D.shapeVersion&&D.shapeVersion!==SHAPE_VERSION)
   ?(' · dữ liệu shape v'+D.shapeVersion+', khung v'+SHAPE_VERSION):'';
 return {ok:true,taken:taken,dropped:dropped,
   msg:label+': nhận '+taken+' khối'+(dropped.length?', bỏ '+dropped.length:'')
      +(missing.length?', thiếu '+missing.length+' driver (giữ 0)':'')+verMsg};
}

function loadDataFile(file){
 const r=new FileReader();
 r.onload=()=>{let D;try{D=JSON.parse(r.result);}catch(e){status('File không phải JSON hợp lệ','warn');return;}
  const res=applyData(D,file.name);
  if(res.ok)DATA_SRC={kind:'file',label:file.name};
  if(!res.ok){status(res.msg,'warn');return;}
  paint();scheduleSave();status(res.msg);
  if(res.dropped.length)console.warn('Bỏ:',res.dropped);};
 r.readAsText(file);
}
function tryFetchData(cb){
 if(typeof fetch!=='function'){cb(false);return;}
 fetch(DATA_URL,{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject(r.status))
  .then(D=>{FETCHED=D;const res=applyData(D,DATA_URL);if(res.ok)DATA_SRC={kind:'fetch',label:DATA_URL};cb(res.ok,res.msg);})
  .catch(()=>cb(false));
}

function sniff(D){
 if(!D||typeof D!=='object')return null;
 if(D.app===KIND.data.app)return 'data';
 if(D.app===KIND.work.app||LEGACY_APP.indexOf(D.app)>=0)return 'work';
 if(D.data&&D.data.IN)return 'work';        /* bản làm việc cũ chưa có app đúng */
 if(D.drivers&&D.actuals)return 'data';
 return null;
}
function openJSON(file){
 const r=new FileReader();
 r.onload=()=>{
  let D;try{D=JSON.parse(r.result);}catch(e){status('File không phải JSON hợp lệ','warn');return;}
  const k=sniff(D);
  if(!k){status('Không nhận ra loại file. Cần bộ dữ liệu nền hoặc bản làm việc của công cụ này.','warn');return;}
  const K=KIND[k];
  if(!confirm('Mở "'+file.name+'" — nhận ra là '+K.t.toUpperCase()+'.\n\n'+K.note
    +'\n\nGiữ: cấu trúc mạch, phép kiểm.\n\nTiếp tục?'))return;
  pushUndo();
  const res=(k==='data')?applyData(D,file.name):applyPayload(D,file.name);
  if(!res.ok){status(res.msg,'warn');return;}
  if(k==='data')DATA_SRC={kind:'file',label:file.name};
  paint();scheduleSave();status('Đã mở '+K.t+' · '+res.msg);
  if(res.dropped&&res.dropped.length)console.warn('Bỏ:',res.dropped);
 };
 r.readAsText(file);
}

/* ================= LƯU TRỮ =================
   3 lớp:  autosave localStorage  ·  JSON máy đọc (có version + hash)  ·  CSV người đọc
   SHAPE_VERSION bump mỗi khi đổi hình dạng dữ liệu → bản lưu cũ không nạp đè bừa. */
const APP_ID="finan_mach_van_hanh_shell";
/* Tên cũ của bản làm việc — vẫn nhận để không bỏ rơi file người dùng đã xuất */
const LEGACY_APP=["sbh_bu12_mach_van_hanh","sbh_own_mach_van_hanh"];
const SHAPE_VERSION=12;
const STORAGE_KEY=APP_ID+'_v'+SHAPE_VERSION;
function hashOf(s){let h=5381;for(let i=0;i<s.length;i++)h=((h*33)^s.charCodeAt(i))>>>0;return h.toString(16).padStart(8,'0');}
function payload(){
 const data={IN:IN,AQ:AQ,ACCS:ACCS,PACC:PACC,PIPE:PIPE,CSSL:CSSL,CSSREV:CSSREV,ACTS:ACTS,ACTS3:ACTS3,META:DATA_META};
 return {app:APP_ID, appVersion:APP_VERSION, shapeVersion:SHAPE_VERSION,
   savedAt:new Date().toISOString(), hash:hashOf(JSON.stringify(data)),
   data:data, ui:{EDITM:EDITM, SHOW:SHOW, RTAB:RTAB, SEG:SEG, BU:BU, COLL:COLL, SEGSEL:SEGSEL,
     focus:document.getElementById('shell').classList.contains('focus'),
     collapsed:document.getElementById('shell').classList.contains('collapsed'),
     nomid:document.getElementById('shell').classList.contains('nomid'),
     panelw:document.documentElement.style.getPropertyValue('--panelw')||DEFW.panel,
     midw:document.documentElement.style.getPropertyValue('--midw')||DEFW.mid}};
}
/* Nạp có kiểm: chỉ nhận khoá còn tồn tại, báo rõ cái gì bị bỏ. */
function applyPayload(p,label){
 /* LỖI trước: sniff() nhận file bản làm việc cũ (app = sbh_bu12_mach_van_hanh, tên
    dùng ở v1.0) nhưng applyPayload lại chặn vì app khác APP_ID hiện tại.
    Hai cổng kiểm không thống nhất → người dùng thấy "File không thuộc công cụ này"
    với chính file do công cụ này xuất ra. */
 const okApp=p&&(p.app===APP_ID||LEGACY_APP.indexOf(p.app)>=0||(p.data&&p.data.IN));
 if(!okApp)return {ok:false,msg:'File không thuộc công cụ này'};
 const d=p.data||{}; let dropped=[],taken=0;
 if(d.IN)Object.keys(d.IN).forEach(k=>{
   if(!DEF[k]){dropped.push('IN.'+k);return;}
   const v=d.IN[k]; if(!Array.isArray(v)||v.length!==nF){dropped.push('IN.'+k+' (sai độ dài)');return;}
   IN[k]=v.map(x=>Number(x)||0);taken++;});
 if(d.AQ)Object.keys(d.AQ).forEach(k=>{
   if(!AQDEF[k]){dropped.push('AQ.'+k);return;}
   const v=d.AQ[k]; if(!Array.isArray(v)||v.length!==nA){dropped.push('AQ.'+k+' (sai độ dài)');return;}
   AQ[k]=v.map(x=>(x===null||x===''||isNaN(x))?null:Number(x));taken++;});
 const missing=Object.keys(DEF).filter(k=>!d.IN||!d.IN[k]).concat(Object.keys(AQDEF).filter(k=>!d.AQ||!d.AQ[k]));
 if(d.ACCS&&Array.isArray(d.ACCS)&&ACCS.length&&d.ACCS.length===ACCS.length){
   d.ACCS.forEach((a,ai)=>{['name','type','ev','com','contrib'].forEach(f=>{if(a[f]!==undefined)ACCS[ai][f]=a[f];});
     ['qty','price'].forEach(f=>{if(Array.isArray(a[f])&&a[f].length===nF)ACCS[ai][f]=a[f].map(x=>Number(x)||0);});});
   taken++;}
 else if(Array.isArray(d.ACCS)){ACCS=d.ACCS;taken++;}
 if(Array.isArray(d.PACC))PACC=d.PACC;
 if(Array.isArray(d.PIPE))PIPE=d.PIPE;
 if(Array.isArray(d.CSSL)&&d.CSSL.length)CSSL=d.CSSL;
 if(Array.isArray(d.CSSREV))CSSREV=d.CSSREV;
 if(d.ACTS)ACTS=d.ACTS; if(d.ACTS3)ACTS3=d.ACTS3; if(d.META)DATA_META=d.META;
 if(p.ui){ if(p.ui.COLL)COLL=p.ui.COLL; if(p.ui.SEGSEL)SEGSEL=p.ui.SEGSEL; if(p.ui.BU&&BUDEF[p.ui.BU])BU=p.ui.BU; if(p.ui.SEG&&ZN[p.ui.SEG])SEG=p.ui.SEG; if(p.ui.EDITM)EDITM=p.ui.EDITM; if(p.ui.SHOW){ALLM.forEach(m=>SHOW[m]=!!p.ui.SHOW[m]);}
  if(p.ui.RTAB)RTAB=p.ui.RTAB;
  if(p.ui.panelw)setW('--panelw',p.ui.panelw); if(p.ui.midw)setW('--midw',p.ui.midw);
 if(typeof p.ui.collapsed==='boolean')document.getElementById('shell').classList.toggle('collapsed',p.ui.collapsed);
 if(typeof p.ui.nomid==='boolean')setNoMid(p.ui.nomid);
 if(typeof p.ui.focus==='boolean')setFocus(p.ui.focus);}
 const verMsg=(p.shapeVersion!==SHAPE_VERSION)?(' · bản lưu shape v'+p.shapeVersion+', công cụ v'+SHAPE_VERSION):'';
 return {ok:true,taken:taken,dropped:dropped,missing:missing,
   msg:label+': nhận '+taken+' trường'+(dropped.length?', bỏ '+dropped.length:'')+(missing.length?', thiếu '+missing.length+' (giữ mặc định)':'')+verMsg};
}
let saveT;
function scheduleSave(){clearTimeout(saveT);saveT=setTimeout(saveLocal,600);}
function saveLocal(){
 try{localStorage.setItem(STORAGE_KEY,JSON.stringify(payload()));
   setSaveInfo('Đã lưu · '+new Date().toLocaleTimeString('vi-VN'));}
 catch(e){status('Không lưu được: '+e.message,'warn');}
}
function loadLocal(){
 let raw=null; try{raw=localStorage.getItem(STORAGE_KEY);}catch(e){}
 if(!raw)return {found:false};
 try{const p=JSON.parse(raw);const res=applyPayload(p,'Bản lưu cục bộ');
   if(!DATA_SRC&&(res.taken||0)>0)DATA_SRC={kind:'local',label:'Bản lưu trong trình duyệt',at:p.savedAt};
   return {found:true,msg:res.msg,at:p.savedAt};}
 catch(e){return {found:false,msg:'Bản lưu hỏng, bỏ qua'};}
}

 pushUndo();
 Object.keys(DEF).forEach(k=>IN[k]=DEF[k].v.slice());
 Object.keys(AQDEF).forEach(k=>AQ[k]=a7(null));
 ACCS=[];PACC=[];PIPE=[];CSSREV=[];CSSL=CSS_LINES.map(x=>({k:x.k,l:x.l,g:a5(0),own:0,bu3:0,note:x.note||''}));
 ACTS={};ACTS3={};DATA_META=null;DATA_SRC=null;
 try{localStorage.removeItem(STORAGE_KEY);}catch(e){}

function download(name,text,mime){
 const b=new Blob([text],{type:mime||'application/json;charset=utf-8'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;
 document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},0);
}

 return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());}

function importJSON(file){

 r.onload=()=>{let p;try{p=JSON.parse(r.result);}catch(e){status('File không phải JSON hợp lệ','warn');return;}
  if(!confirm('Nhập file này?\n\nGhi đè: toàn bộ số plan và số lượng actual đang có.\nGiữ: lịch sử undo.\n\nTrường lạ sẽ bị bỏ, trường thiếu giữ mặc định.'))return;

/* CSV người đọc — đúng bảng đang hiển thị bên phải */
function exportCSV(){
 const ms=showList(); if(!ms.length){status('Chưa chọn tháng nào','warn');return;}
 const D=ms.map(m=>({m:m,a:isActM(m),d:RTAB==='co'?dataCo(m):dataFor(m)}));
 const rows=(RTAB==='pl')?plRows():(RTAB==='co'?COROWS:CUSTROWS);
 const val=(d,r)=>pick(d,r);
 const esc=s=>'"'+String(s).replace(/"/g,'""')+'"';
 const out=[];
 out.push(esc('SBH BU12 — '+(RTAB==='pl'?'P&L hợp nhất':'Customer performance')));
 out.push(esc('Xuất '+new Date().toLocaleString('vi-VN')+' · '+APP_VERSION+' · đơn vị: triệu VND / user'));
 out.push('');
 out.push([esc(RTAB==='pl'?'Dòng':'Chỉ tiêu')].concat(D.map(c=>esc(c.m+(c.a?' (actual)':' (plan)')))).join(','));
 rows.forEach(r=>{
  if(r.g){out.push(esc(r.g));return;}
  const cells=D.map(c=>{const v=val(c.d,r);return (v===null||v===undefined)?'':String(Math.round(v*10000)/10000);});
  out.push([esc(r.l)].concat(cells).join(','));});
 download('SBH_Own_'+(RTAB==='pl'?'PL':'Customer')+'_'+stamp()+'.csv','\ufeff'+out.join('\n'),'text/csv;charset=utf-8');
 status('Đã xuất CSV — '+(RTAB==='pl'?'P&L':'Customer performance'));
}

function syncUndo(){const b=document.getElementById('undoBtn');b.textContent='↩ Undo ('+UNDO.length+')';b.disabled=!UNDO.length;}
document.getElementById('undoBtn').onclick=()=>{if(!UNDO.length)return;
 const s=JSON.parse(UNDO.pop());IN=s.IN;AQ=s.AQ;if(s.ACCS)ACCS=s.ACCS;if(s.PACC)PACC=s.PACC;if(s.PIPE)PIPE=s.PIPE;if(s.CSSL)CSSL=s.CSSL;if(s.CSSREV)CSSREV=s.CSSREV;syncUndo();paint();scheduleSave();status('Đã hoàn tác','warn');};

 if(sh.classList.contains('focus')){setFocus(false);return;}   /* đang toàn màn hình thì ☰ đưa về */
 sh.classList.toggle('collapsed');scheduleSave();};
/* Chế độ xem P&L toàn màn hình: ẩn cả panel trái lẫn vùng nhập giữa. */
function setFocus(on){
 const sh=document.getElementById('shell'),b=document.getElementById('tgFocus');
 sh.classList.toggle('focus',!!on);
 b.classList.toggle('focuson',!!on);
 b.textContent=on?'⛶ Thoát toàn màn hình':'⛶ P&L toàn màn hình';
 b.title=on?'Hiện lại panel và vùng nhập · hoặc bấm Esc':'Ẩn panel và vùng nhập để xem P&L toàn màn hình · Esc để thoát';
 scheduleSave();
 if(on){document.getElementById('shell').classList.remove('nomid');
  const bm=document.getElementById('tgMid');if(bm){bm.classList.remove('focuson');bm.textContent='▥ Ẩn vùng nhập';}
  status('P&L toàn màn hình · Esc để thoát');}
}
document.getElementById('tgFocus').onclick=()=>setFocus(!document.getElementById('shell').classList.contains('focus'));
/* Ẩn riêng vùng nhập — giữ panel trái để vẫn đổi tháng/kênh được */
function setNoMid(on){
 const sh=document.getElementById('shell'),b=document.getElementById('tgMid');
 sh.classList.toggle('nomid',!!on);
 b.classList.toggle('focuson',!!on);
 b.textContent=on?'▥ Hiện vùng nhập':'▥ Ẩn vùng nhập';
 scheduleSave();
}
document.getElementById('tgMid').onclick=()=>{
 const sh=document.getElementById('shell');
 if(sh.classList.contains('focus'))setFocus(false);
 setNoMid(!sh.classList.contains('nomid'));};
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&document.getElementById('shell').classList.contains('focus')){e.preventDefault();setFocus(false);}
});
/* ===== Kéo giãn ranh giới =====
   Trước v0.9.3: gripR ghi thẳng style.gridTemplateColumns nên đè lên --panelw,
   khiến gripL mất tác dụng sau lần kéo đầu. Nay mỗi tay nắm ghi một biến riêng.
   Dải kéo cũng chỉ 6px và nằm sát thanh cuộn panel nên gần như không bấm trúng. */
const DEFW={panel:'20%',mid:'1fr'};
function setW(v,val){document.documentElement.style.setProperty(v,val);}
function shellBox(){return document.getElementById('shell').getBoundingClientRect();}
function panelW(){return document.getElementById('panel').offsetWidth;}
function drag(g,move){
 const start=e=>{
  e.preventDefault();
  g.classList.add('dragging');document.body.classList.add('resizing');
  const mv=ev=>move(ev.clientX);
  const up=()=>{g.classList.remove('dragging');document.body.classList.remove('resizing');
   document.removeEventListener('mousemove',mv);document.removeEventListener('mouseup',up);
   document.removeEventListener('touchmove',tm);document.removeEventListener('touchend',up);
   scheduleSave();};
  const tm=ev=>{if(ev.touches&&ev.touches[0])move(ev.touches[0].clientX);};
  document.addEventListener('mousemove',mv);document.addEventListener('mouseup',up);
  document.addEventListener('touchmove',tm,{passive:false});document.addEventListener('touchend',up);
 };
 g.onmousedown=start;
 g.ontouchstart=start;
 g.onkeydown=e=>{                      /* bàn phím: mũi tên trái/phải */
  if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
  e.preventDefault();
  const box=shellBox(),d=(e.key==='ArrowLeft'?-24:24);
  move((g.id==='gripL'?panelW():panelW()+12+document.getElementById('mid').offsetWidth)+box.left+d);
 };
}
drag(document.getElementById('gripL'),x=>{
 const box=shellBox();
 const w=Math.max(160,Math.min(x-box.left,box.width*0.5));
 setW('--panelw',w+'px');
});
drag(document.getElementById('gripR'),x=>{
 const box=shellBox(),pw=panelW();
 const maxMid=Math.max(240,box.width-pw-24-260);
 const mw=Math.max(240,Math.min(x-box.left-pw-12,maxMid));
 setW('--midw',mw+'px');
});
document.getElementById('gripL').ondblclick=()=>{setW('--panelw',DEFW.panel);scheduleSave();status('Về bề rộng mặc định');};
document.getElementById('gripR').ondblclick=()=>{setW('--midw',DEFW.mid);scheduleSave();status('Về bề rộng mặc định');};

/* ===== khởi động =====
   Thứ tự: dữ liệu nền (fetch) → bản lưu của người dùng đè lên → render. */
function boot(){
 const local=loadLocal();
 paint();syncUndo();
 if(local.found){setSaveInfo(local.at?('Đã lưu · '+new Date(local.at).toLocaleString('vi-VN')):'Đã nạp bản lưu');
  status(local.msg,local.old?'warn':'ok');}
 else setSaveInfo('Chưa có bản lưu');
}
tryFetchData(function(ok,msg){
 boot();
 if(ok)status(msg);
 else if(!hasData())status('Khung rỗng — bấm "Nạp file dữ liệu" ở panel trái','warn');
});
</script></body></html>
